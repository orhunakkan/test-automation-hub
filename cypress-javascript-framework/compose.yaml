services:
  tests:
    build: .
    image: cypress-javascript-framework:local
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    environment:
      HOME: /tmp
      BASE_URL:
      ADMIN_USERNAME:
      ADMIN_PASSWORD:
      MEMBER_USERNAME:
      MEMBER_PASSWORD:
    shm_size: 2gb
    volumes:
      - .:/app
      - /app/node_modules
