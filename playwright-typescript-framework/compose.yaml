services:
  tests:
    build: .
    image: playwright-typescript-framework:local
    # Run as your host user so reports written to this folder belong to you.
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    environment:
      HOME: /tmp
      # Passed through from the host when set (CI); otherwise the mounted .env is used.
      CI:
      BASE_URL:
      ADMIN_USERNAME:
      ADMIN_PASSWORD:
      MEMBER_USERNAME:
      MEMBER_PASSWORD:
      PW_TEST_HTML_REPORT_OPEN: never
    shm_size: 2gb
    volumes:
      # This folder is mounted, so test edits need no rebuild and reports land here.
      # node_modules always comes from the image.
      - .:/app
      - /app/node_modules
