services:
  tests:
    build: .
    image: playwright-typescript-framework:local
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    environment:
      HOME: /tmp
      CI:
      BASE_URL:
      ADMIN_USERNAME:
      ADMIN_PASSWORD:
      MEMBER_USERNAME:
      MEMBER_PASSWORD:
      PW_TEST_HTML_REPORT_OPEN: never
    shm_size: 2gb
    volumes:
      - .:/app
      - /app/node_modules
