# Folio's HTTP API: every endpoint in src/routes with a server handler, for contract testing by test-automation-hub.
# Pages (the HTML a browser gets) and TanStack server functions (internal RPC at hashed URLs) are not in it.
# Hand-written from the handlers; when one of them changes what it takes or answers, change this file in the same
# commit. docs/accounts.md and docs/features/ are the prose behind it.
openapi: 3.1.0
info:
  title: Folio API
  version: 1.0.0
  summary: Every HTTP endpoint Folio serves, besides its pages.
  description: |
    **Signing in.** Each operation's `security` says what it takes:

    - **Bearer token or cookie** (the default: `GET /api/tokens`, `POST /api/tokens/{tokenId}`, `GET /api/me` and
      the three shelves endpoints): exchange a username and password for a token at `POST /api/tokens`, then send
      `Authorization: Bearer <token>`. With that header present it alone decides; the cookie is no fallback.
    - **Session cookie only** (`security: [sessionCookie: []]`): everything else under `/account`, plus
      `POST /confirm-email` and `POST /read/{book}/ask`. A bearer token is ignored there, so a request with only a
      token is signed out (401 without `WWW-Authenticate`, or a 303 or 302 to `/login`). The cookie comes from the
      `POST /login` form, `POST /passkeys/sign-in` (a passkey) or finishing a sign-up at `POST /signup`.
    - **Cookie optional** (`security: [{}, sessionCookie: []]`): `POST /logout`, and `GET /offline/{file}`, where a
      catalogue book is anyone's and a private one needs its owner's cookie.
    - **Public** (`security: []`): `POST /api/tokens` (it takes the password itself), the sign-in, sign-up and
      password-reset forms, the passkey sign-in, public files, the manifest and the health check.
    - **Signed webhooks**: `POST /billing/paddle` (`paddleSignature`) and `POST /mail/events`
      (`resendSvixSignature`) take no account; each checks an HMAC signature over the raw body instead.

    A cookie request that changes something must come from Folio's own origin (`Origin`, or `Sec-Fetch-Site:
    same-origin`), else a plain-text 403. Admin-only operations answer a member with 404, so a member learns nothing.

    **Gates and limits** are on each operation as vendor extensions, and in its description: `x-admin-only`,
    `x-pro-feature` (Free gets 403 `pro`, or a form's `?error=pro`), `x-rate-limit`, `x-quota` (with the Free and Pro
    numbers) and `x-outside-services` (Anthropic, ElevenLabs, Wikimedia, Open Library, Paddle, Resend).

    **Form posts.** Pages that are also form targets (`/login`, `/signup`, `/account`, `/account/api-keys` and others)
    take `application/x-www-form-urlencoded` or `multipart/form-data` and answer with a `303` whose `Location` carries
    the outcome (`?status=…` or `?error=…`); only the post is described here, not the HTML page. The form handlers set
    no byte cap, ignore fields they don't use and read a missing field as empty: the form schemas are what Folio's
    own pages send.

    **JSON bodies** are `Content-Type: application/json` (else 415) under each operation's size cap (else 413).
    Unknown fields and wrong types are refused with 400 `invalid`, never ignored. Uploads of a private book's
    chapters, pictures, cover and audiobook files are raw bodies, step by step, as each operation says.

    **Errors** are JSON `{ "error": "<code>" }` (the `Error` schema, or a schema of its own when the body carries
    more), except a foreign `Origin`, which is a plain-text 403, and the file and download routes, which answer
    plain text. The private book import's first steps use hyphenated codes (`signed-out`, `not-found`).

    **Caching.** Every JSON answer about an account is `Cache-Control: private, no-store`. A request that carries a
    session cookie gets `private, no-store` on every answer, public files included (src/start.ts).

    **Another account's** token, shelf, book, highlight or other record is a 404 `not_found`, never a 403.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://dev.agenticlibrary.app
    description: Dev, deployed from main
  - url: https://agenticlibrary.app
    description: Production
security:
  - bearerToken: []
  - sessionCookie: []
tags:
  - name: Access tokens
    description: Making, listing and revoking access tokens.
  - name: Account
    description: Who a request signs in as.
  - name: Shelves
    description: The account's named shelves of books (docs/features/shelves.md).
  - name: Sign-in
    description: Signing in and out with a password, and resetting a forgotten one (docs/accounts.md).
  - name: Sign-up
    description: Making an account from an emailed or invite link, and confirming an email address.
  - name: Passkeys
    description: Signing in with a passkey, and adding one to the account (WebAuthn).
  - name: Account settings
    description: The account page's forms (password, sessions, tokens, passkeys, email, deleting the account).
  - name: API keys
    description: The reader's own Anthropic and ElevenLabs keys, and the models they use.
  - name: Books
    description: Importing, serving and deleting the account's private books (docs/features/private-books.md).
  - name: Book details
    description: |
      A private book's cover and details, by hand or from Open Library (docs/features/covers-and-book-details.md).
  - name: Audiobooks
    description: Importing and playing the account's audiobooks (docs/features/audiobook-uploads.md).
  - name: Removed books
    description: Hiding catalogue books from the library, and bringing them back (docs/features/removed-books.md).
  - name: Repositories
    description: Reading public GitHub repositories (docs/features/github-repositories.md).
  - name: Bookmarks
    description: Page bookmarks (docs/features/bookmarks.md).
  - name: Audio bookmarks
    description: Bookmarks at a moment in an audiobook (docs/features/audio-bookmarks.md).
  - name: Highlights
    description: Highlights, their notes and their Markdown exports (docs/features/highlights-and-notes.md).
  - name: Flashcards
    description: Flashcards and their reviews (docs/features/flashcards.md).
  - name: Sync
    description: Reading places, bookmarks and highlights across devices (docs/features/sync-across-devices.md).
  - name: Data export
    description: Downloading everything the account holds.
  - name: Word lookup
    description: Dictionary and Wikipedia lookups, and translation (docs/features/word-lookup.md).
  - name: Read aloud
    description: Read aloud with an ElevenLabs voice (docs/features/read-aloud.md).
  - name: Ask the book
    description: Questions about a book, answered with the reader's own Anthropic key (docs/features/ask-the-book.md).
  - name: Plans and billing
    description: Free and Pro, Paddle checkout and the billing portal (docs/features/plans.md, billing.md).
  - name: Webhooks
    description: Signed events from Paddle (subscriptions) and Resend (mail delivery).
  - name: Users
    description: Adding and changing accounts, for admins (the Users page).
  - name: Invites
    description: Invite links for new members, for admins.
  - name: Public files
    description: Covers, pictures, offline downloads, link-preview images, the manifest and old /works links.
  - name: Health
    description: Whether the server and its database answer.

paths:
  /api/tokens:
    post:
      operationId: createAccessToken
      tags: [Access tokens]
      summary: Exchange a username and password for an access token
      description: |
        A sign-in: it counts towards the username's lock and the IP block, like the sign-in form. The token is in
        this answer once and never again; only its hash is stored. Tokens end at `expiresAt`, after 7 days without
        use, or when the account's password changes or it signs out everywhere. An account may have 10 live tokens.
        Test suites should make short ones (`expiresInDays: 1`) and revoke them in teardown.

        Needs no `Origin` header, but a foreign one is 403. Any cookie sent is ignored.
      security: []
      requestBody:
        required: true
        description: At most 8 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreateBody"
            example:
              username: reader
              password: correct horse battery staple
              name: API suite
              expiresInDays: 1
      responses:
        "201":
          description: The new token.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenCreated"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          description: |
            A wrong password, or an unknown, disabled, malformed or locked username: all the same answer, so nobody
            learns which accounts exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid_credentials
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "409":
          description: The account already has 10 live tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenQuotaError"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          description: Too many sign-in attempts from this IP address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: limited
        "500":
          $ref: "#/components/responses/Failed"
        "503":
          description: The server has no database configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: unavailable
    get:
      operationId: listAccessTokens
      tags: [Access tokens]
      summary: List the account's live access tokens
      description: Newest first. Never includes a token or its hash.
      responses:
        "200":
          description: The live tokens.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "500":
          $ref: "#/components/responses/Failed"

  /api/tokens/{tokenId}:
    post:
      operationId: revokeAccessToken
      tags: [Access tokens]
      summary: Revoke one of the account's access tokens
      description: |
        `current` revokes the token the request was made with. An id that isn't a UUID, another account's token, or
        `current` on a cookie request is 404.
      parameters:
        - name: tokenId
          in: path
          required: true
          description: A token's `id`, or `current`.
          schema:
            oneOf:
              - $ref: "#/components/schemas/Uuid"
              - type: string
                const: current
      requestBody:
        required: true
        description: At most 1 KB.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [intent]
              properties:
                intent:
                  type: string
                  const: revoke
      responses:
        "200":
          description: Revoked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
                    const: true
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /api/me:
    get:
      operationId: getMe
      tags: [Account]
      summary: Who the request signs in as
      responses:
        "200":
          description: The signed-in account.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"

  /account/shelves/new:
    post:
      operationId: createShelf
      tags: [Shelves]
      summary: Make a shelf, optionally with a book already on it
      requestBody:
        required: true
        description: At most 2 KB.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  $ref: "#/components/schemas/ShelfName"
                book:
                  $ref: "#/components/schemas/BookSlug"
            example:
              name: To read
              book: pride-and-prejudice
      responses:
        "201":
          description: The new shelf.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShelfAnswer"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: The book isn't in the catalogue or isn't one of the account's ready books.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found
        "409":
          $ref: "#/components/responses/ShelfConflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /account/shelves/{shelfId}:
    post:
      operationId: changeShelf
      tags: [Shelves]
      summary: Rename or delete a shelf
      parameters:
        - $ref: "#/components/parameters/ShelfId"
      requestBody:
        required: true
        description: At most 2 KB. A rename or a delete, never both.
        content:
          application/json:
            schema:
              oneOf:
                - title: Rename
                  type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    name:
                      $ref: "#/components/schemas/ShelfName"
                - title: Delete
                  type: object
                  additionalProperties: false
                  required: [intent]
                  properties:
                    intent:
                      type: string
                      const: delete
            examples:
              rename:
                value:
                  name: Finished
              delete:
                value:
                  intent: delete
      responses:
        "200":
          description: 'The renamed shelf, or `{ "deleted": true }`.'
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ShelfAnswer"
                  - type: object
                    additionalProperties: false
                    required: [deleted]
                    properties:
                      deleted:
                        type: boolean
                        const: true
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another of the account's shelves has this name (case and accents ignored).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: duplicate
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /account/shelves/{shelfId}/books:
    post:
      operationId: setShelfBook
      tags: [Shelves]
      summary: Put a book on a shelf, or take it off
      description: Putting on a book that's already there, or taking off one that isn't, is not an error.
      parameters:
        - $ref: "#/components/parameters/ShelfId"
      requestBody:
        required: true
        description: At most 2 KB.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [book, "on"]
              properties:
                book:
                  $ref: "#/components/schemas/BookSlug"
                "on":
                  type: boolean
                  description: "`true` puts the book on the shelf, `false` takes it off."
            example:
              book: pride-and-prejudice
              "on": true
      responses:
        "200":
          description: The shelf as it is afterwards.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShelfAnswer"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/SignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: The shelf or the book isn't found, or isn't the account's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found
        "409":
          description: The account has 2,000 books on shelves.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShelfQuotaError"
              example:
                error: quota
                scope: shelf_books
                max: 2000
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /login:
    post:
      operationId: signIn
      tags: [Sign-in]
      summary: Sign in with a username and password (the sign-in form)
      description: |
        A plain HTML form post, answered with a `303`. Every refusal, whatever the reason (wrong password; unknown,
        disabled or malformed username; a password over 1,024 characters; a locked username; a blocked IP), is the
        same `error=invalid`, so nobody learns which accounts exist. The attempt is recorded as a failure before the
        password is checked, so parallel requests can't slip past the limits; an unknown or disabled username is
        still checked against a dummy hash, so timing reveals nothing.

        On success any session the request's cookie still names is ended, a new 30-day session starts (it also ends
        after 7 days without use), and the browser goes to `next`. `next` is followed only when it is a same-site path
        (`src/shared/lib/safe-next.ts`): it starts with `/` but not `//` or `/\`, has no scheme, backslash or control
        characters, is at most 1,000 characters and still is a same-site path after URL normalisation. Anything else,
        or none, is `/library`.

        A foreign `Origin` header is 403; without `Origin` the request needs `Sec-Fetch-Site: same-origin`. The cookie
        sent with the request plays no part beyond being replaced. Answers are `Cache-Control: private, no-store`.
      security: []
      x-rate-limit:
        - 5 failed sign-ins for a username within 15 minutes lock it for 15 minutes (303 error=invalid)
        - 30 failed sign-ins from one IP within 15 minutes, passkey failures included, block it for 15 minutes
          (303 error=invalid)
      requestBody:
        required: true
        description: |
          A form, `application/x-www-form-urlencoded` (or `multipart/form-data`). No byte cap in the handler. A
          missing field reads as empty; fields not listed are ignored. A body that isn't a form is `error=invalid`.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginForm"
            example:
              username: reader
              password: correct horse battery staple
              next: /account
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/LoginForm"
      responses:
        "303":
          description: |
            - Signed in: `Location` is `next` (as `safeNext` returned it), or `/library`, with the new session in
              `Set-Cookie`.
            - `/login?error=invalid`: the body isn't a form, or the username and password don't sign in (any reason
              above, limits included).
            - `/login?error=unavailable`: no database is configured, or something failed on the server (logged).

            Both error targets add `&next=<the safe next path, URL-encoded>` unless it is `/library`, for example
            `/login?error=invalid&next=%2Faccount`. No `Set-Cookie` on an error.
          headers:
            Location:
              description: Where the browser goes next; see above.
              schema:
                type: string
                examples: [/account, /library, /login?error=invalid&next=%2Faccount]
            Set-Cookie:
              $ref: "#/components/headers/SessionSetCookie"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "403":
          $ref: "#/components/responses/ForeignOrigin"

  /logout:
    post:
      operationId: signOut
      tags: [Sign-in]
      summary: Sign out (the sign-out form)
      description: |
        POST only; a GET changes nothing. Ends the session the cookie names, if any (audited as `logout`), clears the
        cookie and goes to `/library`. Without a cookie, with a malformed or ended one, with no database, or when
        deleting the session fails (logged), the answer is the same: the cookie is cleared either way. Access tokens
        aren't touched.

        A foreign `Origin` header is 403; without `Origin` the request needs `Sec-Fetch-Site: same-origin`.
      security: [{}, sessionCookie: []]
      responses:
        "303":
          description: Signed out. `Location` is always `/library`.
          headers:
            Location:
              schema:
                type: string
                const: /library
            Set-Cookie:
              $ref: "#/components/headers/SessionClearCookie"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "403":
          $ref: "#/components/responses/ForeignOrigin"

  /signup:
    post:
      operationId: submitSignup
      tags: [Sign-up]
      summary: Ask for a sign-up link, or finish a sign-up from a link (the sign-up forms)
      description: |
        One handler for `/signup`'s two forms, told apart by the `token` field: a form with `token` finishes a sign-up,
        anything else asks for a link. Plain form posts answered with `303`.

        **Asking for a link** (only when the server's `SIGNUP` mode is `open`). Every answer that isn't about the
        request itself is `status=sent`, at once: an address that already has accounts, a bounced one, one over its 3
        links a day, and a filled honeypot (`website`) all get it. The link is made and mailed (through Resend) after
        the response, so neither the answer nor its timing says anything about the address. A sign-up link works once,
        for 24 hours; the account it makes has the address already confirmed.

        **Finishing** (an invite in `invite` or `open` mode, a mailed link only in `open` mode). The link is checked,
        then the username (`^[a-z0-9][a-z0-9_-]{2,31}$` after trimming and lowercasing; a reserved name such as
        `admin` is refused as `taken`), then the password policy, then the confirmation. Each refusal counts against
        the link, which dies at the 10th. The account is a `member`, made in one transaction (one link makes one
        account), and is signed in at once: any session the cookie named is ended and a new one set. An invite works
        once, for 7 days.

        A signed-in visitor can do neither. A foreign `Origin` header is 403; without `Origin` the request needs
        `Sec-Fetch-Site: same-origin`. Answers carry `Cache-Control: private, no-store` and
        `Referrer-Policy: strict-origin`.
      security: []
      x-rate-limit:
        - 5 link requests an hour from one IP, honeypot ones included (303 error=limited)
        - 3 sign-up links a day to one address (over it nothing is sent, and the answer is still status=sent)
        - 30 sign-up links a day for the whole site (303 error=busy)
        - 10 refused attempts to finish kill the link (it then answers like an expired one)
      x-outside-services: [Resend]
      requestBody:
        required: true
        description: |
          A form, `application/x-www-form-urlencoded` (or `multipart/form-data`). No byte cap in the handler; any
          field over 1,024 characters is refused (an address as `error=invalid`, a finish field as
          `error=unavailable`). A missing field reads as empty; fields not listed are ignored.
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SignupRequestForm"
                - $ref: "#/components/schemas/SignupFinishForm"
            examples:
              request:
                value:
                  email: reader@example.com
              finish:
                value:
                  token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                  username: reader
                  password: correct horse battery staple
                  confirm: correct horse battery staple
          multipart/form-data:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SignupRequestForm"
                - $ref: "#/components/schemas/SignupFinishForm"
      responses:
        "303":
          description: |
            Asking for a link (no `token` field):

            - `/signup`: sign-up isn't `open`, or the visitor is signed in.
            - `/signup?status=sent`: accepted (or quietly not sent; see above). Also a filled honeypot.
            - `/signup?error=invalid`: not an address (or not a form).
            - `/signup?error=limited`: 5 requests in the last hour from this IP.
            - `/signup?error=busy`: the site has made 30 sign-up links in the last 24 hours.
            - `/signup?error=unavailable`: the database is down or not configured.

            Finishing (`token` field; `T` is the token):

            - `/signup`: the token isn't 43 base64url characters.
            - `/signup?token=T`: sign-up is `off`, the visitor is signed in, or the link isn't live (unknown, used,
              expired, revoked, killed by refusals) or its kind isn't allowed in this mode. The page says which.
            - `/signup?token=T&error=username&username=U`: the username doesn't match the pattern.
            - `/signup?token=T&error=taken&username=U`: the username is reserved or already taken.
            - `/signup?token=T&error=policy&reason=short|long|username&username=U`: the password is under 15 or over
              256 characters, or is the username.
            - `/signup?token=T&error=mismatch&username=U`: `confirm` isn't `password`.
            - `/signup?token=T&error=unavailable`: a field is over 1,024 characters; with `&username=U` when
              something failed on the server.
            - `/account?status=welcome`: the account was made and signed in; `Set-Cookie` carries the session.

            `U` is the lowercased username, cut to 32 characters, URL-encoded. The password is never in `Location`.
          headers:
            Location:
              schema:
                type: string
                examples: [/signup?status=sent, /account?status=welcome]
            Set-Cookie:
              $ref: "#/components/headers/SessionSetCookie"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Referrer-Policy:
              $ref: "#/components/headers/SigninReferrerPolicy"
        "403":
          $ref: "#/components/responses/ForeignOrigin"

  /confirm-email:
    post:
      operationId: confirmEmail
      tags: [Sign-up]
      summary: Confirm an email address from its link (the confirm form)
      description: |
        Uses the confirmation link up and makes its address the account's: the address is set and its bounce mark
        cleared, and every other unused link of the account used up, in one transaction. Opening the link's page never
        uses it up; only this POST does. It needs the session of the account that asked, so a stranger who gets a
        mistyped link can't confirm it. A link works once, for 24 hours. When the new address replaced one that hadn't
        bounced, "Your email address was changed" is mailed to the old one (a failed send undoes nothing).

        A foreign `Origin` header is 403; without `Origin` the request needs `Sec-Fetch-Site: same-origin`. Answers
        carry `Cache-Control: private, no-store` and `Referrer-Policy: strict-origin`.
      security: [sessionCookie: []]
      x-outside-services: [Resend]
      requestBody:
        required: true
        description: |
          A form, `application/x-www-form-urlencoded` (or `multipart/form-data`). No byte cap in the handler. Fields
          not listed are ignored.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ConfirmEmailForm"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ConfirmEmailForm"
      responses:
        "303":
          description: |
            `T` is the token:

            - `/confirm-email`: mail isn't set up on this server, or the token isn't 43 base64url characters (or the
              body isn't a form).
            - `/login?next=%2Fconfirm-email%3Ftoken%3DT`: no session; signing in comes back to the link.
            - `/confirm-email?token=T`: the link isn't live (unknown, used, expired, superseded) or is another
              account's. The page says which.
            - `/account?status=email-confirmed#email`: confirmed.
            - `/account?error=unavailable`: something failed on the server (logged).
          headers:
            Location:
              schema:
                type: string
                examples: [/account?status=email-confirmed#email]
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Referrer-Policy:
              $ref: "#/components/headers/SigninReferrerPolicy"
        "403":
          $ref: "#/components/responses/ForeignOrigin"

  /forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [Sign-in]
      summary: Ask for a password-reset link (the forgot-password form)
      description: |
        The answer never says whether an account exists: every request that isn't refused for its own sake is
        `status=sent` at once, and the account lookup and the mail (through Resend) happen after the response. A link
        is mailed only to an enabled account's confirmed, unbounced address; by address, at most 5 accounts sharing it
        each get one. A reset link works once, for 30 minutes.

        A foreign `Origin` header is 403; without `Origin` the request needs `Sec-Fetch-Site: same-origin`. Answers
        carry `Cache-Control: private, no-store` and `Referrer-Policy: strict-origin`.
      security: []
      x-rate-limit:
        - 20 requests an hour from one IP (303 error=limited)
        - 3 reset links an hour per account (over it nothing is sent, and the answer is still status=sent)
      x-outside-services: [Resend]
      requestBody:
        required: true
        description: |
          A form, `application/x-www-form-urlencoded` (or `multipart/form-data`). No byte cap in the handler. Fields
          not listed are ignored.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ForgotPasswordForm"
            examples:
              username:
                value:
                  identifier: reader
              email:
                value:
                  identifier: reader@example.com
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ForgotPasswordForm"
      responses:
        "303":
          description: |
            - `/forgot-password`: mail isn't set up on this server (checked before the body is read).
            - `/forgot-password?error=invalid`: `identifier` is empty or over 254 characters after trimming (or the
              body isn't a form).
            - `/forgot-password?error=limited`: 20 requests in the last hour from this IP.
            - `/forgot-password?error=unavailable`: the limit couldn't be checked (database down).
            - `/forgot-password?status=sent`: everything else, whatever `identifier` names, including nothing.
          headers:
            Location:
              schema:
                type: string
                examples: [/forgot-password?status=sent]
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Referrer-Policy:
              $ref: "#/components/headers/SigninReferrerPolicy"
        "403":
          $ref: "#/components/responses/ForeignOrigin"

  /reset-password:
    post:
      operationId: resetPassword
      tags: [Sign-in]
      summary: Set a new password from a reset link (the reset form)
      description: |
        Checks the link, then the new password (a refused password leaves the link unused), then, in one transaction:
        sets the password, uses the link up, removes every passkey of the account, ends every session and access
        token, and clears the username's sign-in lock. Then "Your password was reset" is mailed to the address (a
        failed send undoes nothing). It doesn't sign in, and sets no cookie: the reader signs in with the new password.

        The link must still be live: unused, under 30 minutes old, made after the last password change, for the
        account's current confirmed and unbounced address, on an enabled account.

        A foreign `Origin` header is 403; without `Origin` the request needs `Sec-Fetch-Site: same-origin`. Answers
        carry `Cache-Control: private, no-store` and `Referrer-Policy: strict-origin`.
      security: []
      x-outside-services: [Resend]
      requestBody:
        required: true
        description: |
          A form, `application/x-www-form-urlencoded` (or `multipart/form-data`). No byte cap in the handler. Fields
          not listed are ignored.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ResetPasswordForm"
            example:
              token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
              password: correct horse battery staple
              confirm: correct horse battery staple
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ResetPasswordForm"
      responses:
        "303":
          description: |
            `T` is the token:

            - `/reset-password`: the body isn't a form, mail isn't set up, or the token isn't 43 base64url characters.
            - `/reset-password?token=T`: the link isn't live (or stopped qualifying while the request ran). The page
              says the link expired or was used.
            - `/reset-password?token=T&error=mismatch`: `confirm` isn't `password`.
            - `/reset-password?token=T&error=policy&reason=short|long|username`: the password is under 15 or over 256
              characters, or is the username.
            - `/reset-password?token=T&error=unavailable`: something failed on the server (logged).
            - `/login?status=password-reset`: the password is set.
          headers:
            Location:
              schema:
                type: string
                examples: [/login?status=password-reset]
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Referrer-Policy:
              $ref: "#/components/headers/SigninReferrerPolicy"
        "403":
          $ref: "#/components/responses/ForeignOrigin"

  /passkeys/challenge:
    post:
      operationId: createPasskeySignInChallenge
      tags: [Passkeys]
      summary: Get the options for signing in with a passkey
      description: |
        Step 1 of signing in with a passkey, from `/login`, without a username. Answers the options for
        `navigator.credentials.get()`: a new 32-byte challenge (only its SHA-256 is stored) that works once, for 5
        minutes, no allowed credentials (any of this site's discoverable passkeys), and user verification required.
        Step 2 is `POST /passkeys/sign-in` with the credential the browser returns; the challenge travels inside its
        `clientDataJSON`.

        Needs no session. A foreign `Origin` header is 403; without `Origin` the request needs
        `Sec-Fetch-Site: same-origin`.
      security: []
      x-rate-limit:
        - 30 challenges from one IP within 15 minutes (429 limited)
      requestBody:
        required: false
        description: None is needed; any body, of any content type, is ignored. At most 1 KB, else 413.
        content:
          "*/*":
            schema: {}
      responses:
        "200":
          description: The options.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [options]
                properties:
                  options:
                    $ref: "#/components/schemas/PasskeyRequestOptions"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          description: 30 challenges from this IP in the last 15 minutes. No `retryAt`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: limited
        "503":
          $ref: "#/components/responses/Unavailable"
          description: No database is configured, or something failed on the server (logged).

  /passkeys/sign-in:
    post:
      operationId: signInWithPasskey
      tags: [Passkeys]
      summary: Sign in with a passkey's assertion
      description: |
        Step 2 of signing in with a passkey: the credential `navigator.credentials.get()` returned for the options of
        `POST /passkeys/challenge`. The challenge named in its `clientDataJSON` is used up at once. Then the credential
        is looked up, its `userHandle` must match the account's, the account must be enabled, and the library checks
        the signature, origin, RP ID (the server's exact hostname), user verification and signature counter.

        The username lock doesn't apply, but the IP block does: each attempt is recorded in the sign-in attempts
        (under no username) before it is checked, so passkey and password failures count together. Every refusal is
        the same 401 `refused`, audited with its reason.

        On success it is a password sign-in's: any session the cookie named is ended, a new 30-day session is set, and
        the answer says where to go. A foreign `Origin` header is 403; without `Origin` the request needs
        `Sec-Fetch-Site: same-origin`.
      security: []
      x-rate-limit:
        - 30 failed sign-ins from one IP within 15 minutes, password failures included, block it for 15 minutes
          (429 limited)
      requestBody:
        required: true
        description: At most 8 KB.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential:
                  $ref: "#/components/schemas/PasskeyAuthenticationCredential"
                next:
                  description: |
                    Where to go afterwards, judged by the same rule as the sign-in form's `next` (a same-site path, else
                    `/library`). A value that isn't a string of at most 2,048 characters is ignored, not refused.
            example:
              credential:
                id: AAAAAAAAAAAAAAAAAAAAAA
                rawId: AAAAAAAAAAAAAAAAAAAAAA
                type: public-key
                response:
                  clientDataJSON: eyJ0eXBlIjoid2ViYXV0aG4uZ2V0In0
                  authenticatorData: AAAA
                  signature: AAAA
                  userHandle: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                authenticatorAttachment: platform
                clientExtensionResults: {}
              next: /account
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionSetCookie"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [next]
                properties:
                  next:
                    type: string
                    description: "`next` as `safeNext` returned it, or `/library`."
                    examples: [/account]
        "400":
          $ref: "#/components/responses/Invalid"
          description: |
            The body isn't JSON or doesn't match the schema: an unknown field, a field of the wrong type, a base64url
            string that is malformed or over its size, `rawId` not equal to `id`, an unknown transport or extension.
        "401":
          description: |
            The passkey didn't sign in: the challenge is unknown, used, expired or missing from `clientDataJSON`; the
            credential is unknown; `userHandle` doesn't match; the account is disabled; or the library refused it
            (signature, origin, RP ID, user verification, a counter that didn't go up). One answer for all.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: refused
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          description: This IP is blocked (30 failed sign-ins in 15 minutes). No `retryAt`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: limited
        "503":
          $ref: "#/components/responses/Unavailable"
          description: No database is configured, or something failed on the server (logged).

  /account/passkeys/options:
    post:
      operationId: createPasskeyRegistrationOptions
      tags: [Passkeys]
      summary: Check the current password and get the options for adding a passkey
      description: |
        Step 1 of adding a passkey on `/account`. The current password is checked first, so a stolen session can't
        add the attacker's passkey; the check counts towards the username's sign-in lock, and a locked name is refused
        the same way as a wrong password. Then the account must have fewer than 10 passkeys. Answers the options for
        `navigator.credentials.create()`: a new 32-byte challenge for this account that works once, for 5 minutes
        (it replaces any earlier one), a discoverable credential with user verification, no attestation, Ed25519,
        ES256 and RS256, and the account's own passkeys excluded. Step 2 is `POST /account/passkeys/new`.

        The session cookie only, from Folio's own origin (`Origin`, or `Sec-Fetch-Site: same-origin`).
      security: [sessionCookie: []]
      x-rate-limit:
        - 5 wrong passwords for the username within 15 minutes, sign-ins included, lock it for 15 minutes
          (400 password)
      x-quota:
        - 10 passkeys per account (409 quota)
      requestBody:
        required: true
        description: At most 1 KB.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  maxLength: 1024
                  format: password
                  description: The account's current password.
            example:
              password: correct horse battery staple
      responses:
        "200":
          description: The options.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [options]
                properties:
                  options:
                    $ref: "#/components/schemas/PasskeyCreationOptions"
        "400":
          description: |
            `invalid`: the body isn't JSON or doesn't match the schema. `password`: the password is wrong, or the
            username is locked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid:
                  value:
                    error: invalid
                password:
                  value:
                    error: password
        "401":
          $ref: "#/components/responses/CookieSignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "409":
          $ref: "#/components/responses/PasskeyQuota"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /account/passkeys/new:
    post:
      operationId: createPasskey
      tags: [Passkeys]
      summary: Store the passkey the browser made
      description: |
        Step 2 of adding a passkey: the credential `navigator.credentials.create()` returned for the options of
        `POST /account/passkeys/options`. The challenge named in its `clientDataJSON` must be this account's live
        register challenge, and is used up at once. The library then verifies the credential (origin, RP ID, user
        verification, algorithm). The passkey is named from the request's `User-Agent` ("Chrome on macOS", or
        "Passkey"). After the answer, "A passkey was added to your Folio account" is mailed to the account's
        confirmed, unbounced address, if it has one and mail is on; a failed send undoes nothing.

        The session cookie only, from Folio's own origin (`Origin`, or `Sec-Fetch-Site: same-origin`).
      security: [sessionCookie: []]
      x-quota:
        - 10 passkeys per account (409 quota)
      x-outside-services: [Resend]
      requestBody:
        required: true
        description: At most 16 KB.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential:
                  $ref: "#/components/schemas/PasskeyRegistrationCredential"
            example:
              credential:
                id: AAAAAAAAAAAAAAAAAAAAAA
                rawId: AAAAAAAAAAAAAAAAAAAAAA
                type: public-key
                response:
                  clientDataJSON: eyJ0eXBlIjoid2ViYXV0aG4uY3JlYXRlIn0
                  attestationObject: AAAA
                  transports: [internal, hybrid]
                  publicKeyAlgorithm: -7
                authenticatorAttachment: platform
                clientExtensionResults:
                  credProps:
                    rk: true
      responses:
        "200":
          description: The new passkey, as `/account` lists it.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [passkey]
                properties:
                  passkey:
                    $ref: "#/components/schemas/PasskeyView"
        "400":
          description: |
            `invalid`: the body isn't JSON or doesn't match the schema. `expired`: `clientDataJSON` names no challenge,
            or not a live register challenge of this account (unknown, used, over 5 minutes old, or replaced by a
            newer one). `refused`: the library didn't verify the credential (audited with the reason).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid:
                  value:
                    error: invalid
                expired:
                  value:
                    error: expired
                refused:
                  value:
                    error: refused
        "401":
          $ref: "#/components/responses/CookieSignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "409":
          description: |
            `quota` (with `max`): the account already has 10 passkeys. `taken`: this credential is already stored, on
            this or another account.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PasskeyQuotaError"
                  - $ref: "#/components/schemas/Error"
              examples:
                quota:
                  value:
                    error: quota
                    max: 10
                taken:
                  value:
                    error: taken
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /account:
    post:
      operationId: submitAccountForm
      tags: [Account settings]
      summary: The account page's forms (password, sessions, tokens, passkeys, email address, deleting the account)
      description: |
        One plain HTML form post, its `intent` field choosing the action. Every answer is a `303` with no body, back
        to `/account` with a `status` or `error` code (and a fragment naming the page's section), so it works without
        JavaScript. The page maps each code to fixed text. Fields the intent doesn't use are ignored, and a missing
        field reads as an empty string.

        Order of checks: a foreign `Origin` (or, without one, no `Sec-Fetch-Site: same-origin`) is 403 before
        anything else; then no session cookie, or one naming no live session (or a failed lookup), goes to
        `/login?next=%2Faccount`; then a body that isn't a form is `?error=invalid`; then the intent. An unknown or
        missing intent is `?error=invalid`. A database failure inside an intent is `?error=unavailable`.

        What each intent answers:

        - `change-password`: `password` and `confirm` differ → `?error=mismatch#password`; the new password breaks
          the policy → `?error=policy&reason=<short|long|username>#password` (fewer than 15 or more than 256
          characters after NFC, or the username itself, case ignored); the current password is wrong, over 1,024
          characters, or the username is locked → `?error=current#password` (checked in that order, so only the last
          check counts towards the lock). Success → `?status=password-changed`: the hash is replaced, every other
          session and every access token of the account end, and this session's cookie stays as it is.
        - `revoke-others`: ends every other session and every access token → `?status=signed-out-others#sessions`.
        - `token-revoke`: `token` is a token id. Another account's id, or one that isn't a UUID, gets the same answer
          and changes nothing → `?status=token-revoked#access-tokens`.
        - `passkey-remove`: `passkey` is a passkey id (case ignored). No password asked. Another account's id, or a
          malformed one, gets the same answer and changes nothing → `?status=passkey-removed#passkeys`.
        - `delete-account`: wrong or locked current password → `?error=delete-current#delete`; the account is the only
          enabled admin → `?error=last-admin#delete`; billing is on and Paddle couldn't cancel a subscription that
          can still bill → `?error=delete-billing#delete`. Otherwise the account and everything in it are deleted
          (an account that was already gone answers the same) → `/login?status=account-deleted` with a `Set-Cookie`
          that clears the session cookie. This is the only intent that sets a cookie.
        - `email-add`, `email-resend`, `email-remove`: with mail off (no mail settings or no database) every one
          answers `/account#email` and touches nothing.
          - `email-add`: an address `parseEmail` refuses → `?error=email-invalid#email` (before the password is
            checked); wrong or locked current password → `?error=email-current#email`; it is already the confirmed,
            unbounced address → `?error=email-same#email`; 5 links in the last hour → `?error=email-limit#email`;
            the mail is refused (Resend 400/422) → `?error=email-invalid#email`; Resend 429 → `?error=email-busy#email`;
            any other send failure → `?error=email-failed#email`. A failed send leaves the earlier pending address in
            place. Sent → `?status=email-sent#email`; the link, valid 24 hours, replaces any older pending one.
          - `email-resend`: nothing pending, or the pending address bounced → `/account#email`; otherwise a new link to
            the pending address, with `email-add`'s limit and send outcomes (`email-limit`, `email-invalid`,
            `email-busy`, `email-failed`, `email-sent`).
          - `email-remove`: with `pending=1` drops only the pending address → `/account#email`; otherwise clears the
            confirmed address and every unused link → `?status=email-removed#email`.

        A current-password re-check (`change-password`, `delete-account`, `email-add`) is recorded as a sign-in
        attempt for the username: a failure counts towards the username's lock and the IP's block on `/login`, and
        while the username is locked every re-check fails without checking the password (audited as `login.locked`).
      security: [sessionCookie: []]
      x-rate-limit:
        - >-
          A wrong current password counts towards the username's sign-in lock: 5 failures in 15 minutes lock it for
          15 minutes, during which every re-check fails (303 error=current, delete-current or email-current)
        - 5 confirmation links an hour per account, resends and failed sends included (303 error=email-limit)
      x-outside-services: [Resend, Paddle]
      requestBody:
        required: true
        description: |
          A form post. The handler sets no byte cap of its own. Values are strings; `username` is a hidden field the
          page sends so password managers file the password under the right account, and the server ignores it.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AccountFormBody"
            examples:
              changePassword:
                value:
                  intent: change-password
                  username: reader
                  current: correct horse battery staple
                  password: another correct horse battery staple
                  confirm: another correct horse battery staple
              revokeOthers:
                value:
                  intent: revoke-others
              tokenRevoke:
                value:
                  intent: token-revoke
                  token: 0b6f4c1e-2d3a-4f5b-8c7d-9e0f1a2b3c4d
              passkeyRemove:
                value:
                  intent: passkey-remove
                  passkey: 5a1d2c3b-4e5f-4a6b-9c8d-7e6f5a4b3c2d
              deleteAccount:
                value:
                  intent: delete-account
                  username: reader
                  current: correct horse battery staple
              emailAdd:
                value:
                  intent: email-add
                  username: reader
                  email: reader@example.com
                  current: correct horse battery staple
              emailResend:
                value:
                  intent: email-resend
              emailCancelPending:
                value:
                  intent: email-remove
                  pending: "1"
              emailRemove:
                value:
                  intent: email-remove
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AccountFormBody"
      responses:
        "303":
          description: |
            Back to the page with the outcome (see the operation's description for which intent answers what), or to
            `/login` when signed out or after deleting the account. No body.
          headers:
            Location:
              description: Where the browser goes next; the fragment names the page's section.
              schema:
                type: string
                enum:
                  - /login?next=%2Faccount
                  - /login?status=account-deleted
                  - /account?error=invalid
                  - /account?error=unavailable
                  - /account?error=mismatch#password
                  - /account?error=policy&reason=short#password
                  - /account?error=policy&reason=long#password
                  - /account?error=policy&reason=username#password
                  - /account?error=current#password
                  - /account?status=password-changed
                  - /account?status=signed-out-others#sessions
                  - /account?status=token-revoked#access-tokens
                  - /account?status=passkey-removed#passkeys
                  - /account?error=delete-current#delete
                  - /account?error=last-admin#delete
                  - /account?error=delete-billing#delete
                  - /account#email
                  - /account?error=email-invalid#email
                  - /account?error=email-current#email
                  - /account?error=email-same#email
                  - /account?error=email-limit#email
                  - /account?error=email-busy#email
                  - /account?error=email-failed#email
                  - /account?status=email-sent#email
                  - /account?status=email-removed#email
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Set-Cookie:
              $ref: "#/components/headers/AccountClearedSessionCookie"
        "403":
          $ref: "#/components/responses/ForeignOrigin"

  /account/api-keys:
    post:
      operationId: submitApiKeysForm
      tags: [API keys]
      summary: Save, replace or delete a provider API key, or choose the agent or voice model
      description: |
        One plain HTML form post, its `intent` field choosing the action. Every answer is a `303` with no body, back
        to `/account/api-keys` with a `status` or `error` code; a key's answer also carries `provider=` and the
        provider's section as the fragment, so the page shows the outcome there. No answer sets a cookie.

        Order of checks: a foreign `Origin` (or, without one, no `Sec-Fetch-Site: same-origin`) is 403; then no live
        session goes to `/login?next=%2Faccount%2Fapi-keys`; then a body that isn't a form is `?error=invalid`.

        - `model` (the model Ask the book uses with the Anthropic key): an id not in the list → `?error=invalid#model`;
          saved → `?status=model-saved#model`; a database failure → `?error=failed#model`. Not counted against the
          key limit, and not a Pro check.
        - `speech-model` (the ElevenLabs voice model for read aloud): the same, answered with
          `?<code>&provider=elevenlabs#speech-model` (`error=invalid`, `status=speech-model-saved`, `error=failed`).
        - Anything else needs `provider` to be `anthropic` or `elevenlabs`, else `?error=invalid` (no provider, no
          fragment). Then the key limit: 10 `api_key.saved`, `api_key.deleted` and `api_key.rejected` events in the
          last hour, both providers together, answer `error=limit` for every intent below, deletes included. Then:
          - `save`: ElevenLabs on Free → `error=pro`. The key is trimmed, then shape-checked before anything leaves the
            server: Anthropic needs `sk-ant-`, 20–300 characters, no whitespace (`error=shape`); ElevenLabs needs
            20–300 characters, no whitespace (`error=shape`), and not an `sk-ant-` key (`error=anthropic`). Then the
            provider checks it (10 s, no redirects): Anthropic `GET {ANTHROPIC_API_BASE}/v1/models?limit=1` with
            `x-api-key`, ElevenLabs `GET {ELEVENLABS_API_BASE}/v2/voices?page_size=1` with `xi-api-key`. 200 saves it
            → `status=saved`; Anthropic 401/403 or ElevenLabs 401 → `error=rejected`; ElevenLabs 403 (the key can't
            read voices) → `error=permission` (both audited as `api_key.rejected`, so they count towards the limit);
            any other status, a timeout or a network error → `error=unavailable`. Saving replaces any earlier key of
            that provider.
          - `delete`: deletes the provider's key, if there is one (on Free too) → `status=deleted`.
          - any other intent → `error=invalid`.
          - a database failure, or no KEK configured (after the provider accepted the key) → `error=failed`.

        What is stored: the key encrypted with AES-256-GCM under the server's KEK (a fresh 12-byte IV, the auth tag,
        the KEK's id, associated data binding it to the account and provider), its last 4 characters, and when it was
        saved and checked. The key is never sent back; the page shows only the last 4 characters.
      security: [sessionCookie: []]
      x-pro-feature: elevenlabs
      x-rate-limit:
        - >-
          10 key saves, replaces, deletes and rejected keys an hour per account, both providers together; models
          aren't counted (303 error=limit)
      x-outside-services: [Anthropic, ElevenLabs]
      requestBody:
        required: true
        description: A form post. The handler sets no byte cap of its own. Values are strings.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ApiKeysFormBody"
            examples:
              saveAnthropic:
                value:
                  intent: save
                  provider: anthropic
                  key: sk-ant-api00-placeholder-placeholder
              saveElevenLabs:
                value:
                  intent: save
                  provider: elevenlabs
                  key: sk_placeholder_placeholder_placeholder
              delete:
                value:
                  intent: delete
                  provider: anthropic
              model:
                value:
                  intent: model
                  model: claude-sonnet-5-5
              speechModel:
                value:
                  intent: speech-model
                  model: eleven_v4
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ApiKeysFormBody"
      responses:
        "303":
          description: Back to the page with the outcome (see the operation's description), or to `/login`. No body.
          headers:
            Location:
              description: |
                Where the browser goes next. A key's answer is `?<code>&provider=<provider>#<provider>`.
              schema:
                type: string
                enum:
                  - /login?next=%2Faccount%2Fapi-keys
                  - /account/api-keys?error=invalid
                  - /account/api-keys?error=invalid#model
                  - /account/api-keys?status=model-saved#model
                  - /account/api-keys?error=failed#model
                  - /account/api-keys?error=invalid&provider=elevenlabs#speech-model
                  - /account/api-keys?status=speech-model-saved&provider=elevenlabs#speech-model
                  - /account/api-keys?error=failed&provider=elevenlabs#speech-model
                  - /account/api-keys?error=limit&provider=anthropic#anthropic
                  - /account/api-keys?error=shape&provider=anthropic#anthropic
                  - /account/api-keys?error=rejected&provider=anthropic#anthropic
                  - /account/api-keys?error=unavailable&provider=anthropic#anthropic
                  - /account/api-keys?status=saved&provider=anthropic#anthropic
                  - /account/api-keys?status=deleted&provider=anthropic#anthropic
                  - /account/api-keys?error=invalid&provider=anthropic#anthropic
                  - /account/api-keys?error=failed&provider=anthropic#anthropic
                  - /account/api-keys?error=limit&provider=elevenlabs#elevenlabs
                  - /account/api-keys?error=pro&provider=elevenlabs#elevenlabs
                  - /account/api-keys?error=shape&provider=elevenlabs#elevenlabs
                  - /account/api-keys?error=anthropic&provider=elevenlabs#elevenlabs
                  - /account/api-keys?error=rejected&provider=elevenlabs#elevenlabs
                  - /account/api-keys?error=permission&provider=elevenlabs#elevenlabs
                  - /account/api-keys?error=unavailable&provider=elevenlabs#elevenlabs
                  - /account/api-keys?status=saved&provider=elevenlabs#elevenlabs
                  - /account/api-keys?status=deleted&provider=elevenlabs#elevenlabs
                  - /account/api-keys?error=invalid&provider=elevenlabs#elevenlabs
                  - /account/api-keys?error=failed&provider=elevenlabs#elevenlabs
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "403":
          $ref: "#/components/responses/ForeignOrigin"

  /account/books:
    post:
      operationId: deleteBook
      tags: [Books]
      summary: Delete one of the account's own books (a form post)
      description: |
        The Delete button on My books and on a private book's page: a plain form post, so it works without JavaScript,
        answered with a `303` back to My books. It deletes a text book (finished or still uploading) or an imported
        audiobook with every row it has (chapters, cover, pictures), then an audiobook's files on disk, and audits
        `book.deleted`. The page itself (GET) is HTML and not described here.

        Checks, in order: the origin (403), the session (303 to sign-in; also when the server has no database), the
        form (`error=invalid`), then the store.
      security: [sessionCookie: []]
      requestBody:
        required: true
        description: |
          Read with the platform's form parser, which takes `application/x-www-form-urlencoded` or
          `multipart/form-data`; the handler sets no byte cap of its own. A body that isn't a form, a missing or other
          `intent`, or an `id` that isn't a lowercase UUID is `?error=invalid`. Other fields are ignored.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/BooksDeleteForm"
            example:
              intent: delete
              id: 3f2b8c1e-5d4a-4e6b-9c7d-1a2b3c4d5e6f
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BooksDeleteForm"
      responses:
        "303":
          description: |
            Where the browser goes next:

            - `/login?next=%2Faccount%2Fbooks`: no valid session cookie, or the server has no database.
            - `/account/books?error=invalid`: the body isn't a form, or `intent`/`id` is wrong.
            - `/account/books?error=missing`: the account has no book with this id (another account's included).
            - `/account/books?status=deleted`: deleted.
            - `/account/books?error=unavailable`: the database failed; it is logged.
          headers:
            Location:
              schema:
                type: string
                enum:
                  - /login?next=%2Faccount%2Fbooks
                  - /account/books?error=invalid
                  - /account/books?error=missing
                  - /account/books?status=deleted
                  - /account/books?error=unavailable
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "403":
          $ref: "#/components/responses/ForeignOrigin"

  /account/books/lookup:
    post:
      operationId: lookUpBookDetails
      tags: [Book details]
      summary: Search Open Library for one of the account's books
      description: |
        Find cover and details: the server (never the browser) searches Open Library with only the title and author,
        or the ISBN, in the request, and answers at most five works. A valid ISBN wins; an ISBN that isn't valid is
        dropped and the title and author are searched instead. The search is remembered on the server for an hour, so
        applying a match (`POST /account/books/{id}/open-library`) can fill an empty ISBN and year from Open Library's
        own answer.

        Checks, in order: the origin (403), the session (401), the body (415, 413, 400), the book (404: not a UUID,
        not the account's, or not ready; an audiobook is a book here), the search fields (400), the hourly limit
        (429), then Open Library. Every search that reaches Open Library counts towards the limit and is audited as
        `book.looked_up`, even when Open Library fails.

        Open Library is asked at most once a second by the whole server (three times with a contact configured); a
        request that would wait more than 5 seconds for its turn, or that Open Library answers 429 or 503, is `busy`.
        Answers are cached in memory for an hour.
      security: [sessionCookie: []]
      x-rate-limit: ["30 lookups an hour per account, searches and applied matches together (429 rate)"]
      x-outside-services: [Open Library]
      requestBody:
        required: true
        description: At most 2 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BooksLookupBody"
            examples:
              byTitle:
                value:
                  book: 3f2b8c1e-5d4a-4e6b-9c7d-1a2b3c4d5e6f
                  title: Pride and Prejudice
                  author: Jane Austen
              byIsbn:
                value:
                  book: 3f2b8c1e-5d4a-4e6b-9c7d-1a2b3c4d5e6f
                  isbn: 978-0-14-143951-8
      responses:
        "200":
          description: The matches, in Open Library's order. May be empty.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksLookupAnswer"
        "400":
          description: |
            The body isn't a JSON object, has a field besides `book`, `title`, `author` and `isbn`, has one of those
            that isn't a string or null, or has nothing to search for (no valid ISBN, and a title that is empty or over
            300 characters, or an author over 200, once cleaned).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid
        "401":
          $ref: "#/components/responses/CookieSignedOut"
          description: No valid session cookie, or the server has no database.
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: "`book` is missing or not a UUID, or is not one of the account's ready books."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/BooksDetailsFailed"
        "502":
          $ref: "#/components/responses/BooksOpenLibraryUnavailable"
        "503":
          $ref: "#/components/responses/BooksOpenLibraryBusy"

  /account/books/new:
    post:
      operationId: startBookImport
      tags: [Books]
      summary: Start a private book import (step 1 of 4)
      description: |
        The browser reads the book file itself (EPUB, PDF, Markdown or a ZIP of Markdown; the file is never uploaded)
        and sends structured blocks, never HTML. An import is four kinds of request, all linked by the `id` this one
        answers:

        1. **This request**: the metadata, the four optional details, `chapterCount` and the pictures that will
           follow (`images.count` and their bytes in all). It sweeps the account's imports still uploading after 24
           hours, checks the limits with the account locked, and makes an `uploading` book. Then, optionally, the
           cover: `POST /account/books/{id}/cover?source=epub|zip|pdf`.
        2. `POST /account/books/{id}/images/{n}` once for each picture `n` from 1 to `images.count`.
        3. `POST /account/books/{id}/chapters/{position}` once for each chapter `position` from 0 to
           `chapterCount - 1`; a chapter may show only pictures already stored.
        4. `POST /account/books/{id}/finish` once every chapter and picture has arrived; it marks the book ready.

        An import never finished is deleted at the account's next import after 24 hours. Error codes on these four
        endpoints are hyphenated (`not-found`, `signed-out`), unlike the rest of the API.

        Checks, in order: the origin (403), the session (401), the body (415, 413, 400), then the store: the hourly
        import limit (429), the plan's book limit (409 `books`), the account's picture room (409 `user`).
      security: [sessionCookie: []]
      x-rate-limit: ["10 finished imports an hour per account, text books and audiobooks together (429 rate)"]
      x-quota:
        - 2 books on Free, 25 on Pro, besides the starter book, unfinished imports included (409 quota, scope books)
        - 250 MB of pictures per account, across its books (409 quota, scope user)
        - 1,000 chapters per book (400 too-long)
        - 500 pictures and 30 MB of pictures per book (400 invalid)
      requestBody:
        required: true
        description: At most 16 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BooksStartBody"
            example:
              title: Pride and Prejudice
              author: Jane Austen
              language: en
              chapterCount: 61
              description: A novel of manners.
              isbn: "9780141439518"
              publisher: Penguin Classics
              publishedYear: 2003
              images:
                count: 2
                bytes: 180000
      responses:
        "201":
          description: The new `uploading` book.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksStarted"
        "400":
          description: |
            `invalid`: the body isn't a JSON object, has an unknown or missing field or a wrong type, an empty title or
            author, a language that isn't a BCP 47 tag, a bad ISBN or year, a description over 4,000 or publisher over
            200 characters, or `images` that don't fit (over 500 pictures or 30 MB, or bytes fewer than the count or
            more than 900 KB a picture). `too-long`: a title over 300 or an author over 200 characters once cleaned,
            or more than 1,000 chapters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid:
                  value:
                    error: invalid
                tooLong:
                  value:
                    error: too-long
        "401":
          $ref: "#/components/responses/BooksImportSignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "409":
          description: |
            `scope: books`: the account is at its plan's book limit (2 on Free, 25 on Pro), counting unfinished
            imports and not the starter book. `scope: user`: the pictures declared are more than the account's
            250 MB of picture room has left.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BooksPlanQuotaError"
                  - $ref: "#/components/schemas/BooksPictureRoomError"
              examples:
                books:
                  value:
                    error: quota
                    scope: books
                    max: 2
                    plan: free
                pictures:
                  value:
                    error: quota
                    scope: user
                    max: 262144000
        "413":
          $ref: "#/components/responses/BooksImportTooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          description: The account has finished 10 imports (text books and audiobooks) in the last hour.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: rate
        "500":
          $ref: "#/components/responses/Failed"

  /account/books/new-audiobook:
    post:
      operationId: startAudiobookImport
      tags: [Audiobooks]
      summary: Start an audiobook import (step 1 of 3)
      description: |
        One DRM-free `.m4b` file, or the `.mp3` files of one audiobook, read in the browser first. An audiobook import
        is three kinds of request, linked by the `id` this one answers:

        1. **This request**: the reviewed details, each file's kind and size in play order (file `n` is
           `files[n - 1]`), and the chapters as windows into the files that must tile them. It makes the `uploading`
           book, its file and chapter rows and its directory on disk, and sweeps the account's directories no row
           names. Then, when `cover` is true, the cover: `POST /account/books/{id}/cover?source=audio`.
        2. `POST /account/books/{id}/audio/{n}?offset=<bytes>` for each file `n`, in chunks of at most 896 KiB, each
           at the exact offset the server holds.
        3. `POST /account/books/{id}/audio/finish`: the server reads every file itself and marks the book ready.

        Uploading audiobooks is part of Pro: on Free this answers 403 `pro` before the body is read. The chunks and
        the finish aren't gated, so an upload started on Pro may finish. When the server has no usable
        `AUDIOBOOKS_DIR`, this (after the body checks) and every other audiobook route answer 404.

        Checks, in order: the origin (403), the session (401), the plan (403 `pro`), the body (415, 413, 400), the
        feature (404), the server's free disk (409 `server`), then, with the account locked: the hourly import limit
        (409 `rate`, not a 429), the plan's book limit (409 `books`) and the account's 8 GB of audio (409 `audio`).
      security: [sessionCookie: []]
      x-pro-feature: audiobooks
      x-rate-limit:
        - 10 finished imports an hour per account, text books and audiobooks together (409 quota, scope rate)
      x-quota:
        - 2 books on Free, 25 on Pro, besides the starter book, unfinished imports included (409 quota, scope books)
        - 8 GB of audio per account, finished or uploading (409 quota, scope audio)
        - 2 GB, 500 files and 1,000 chapters per audiobook (400 invalid)
        - 10 GB left free on the server's disk after the upload (409 quota, scope server)
      requestBody:
        required: true
        description: At most 512 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudiobookStartBody"
            example:
              title: Pride and Prejudice
              author: Jane Austen
              narrator: A. Reader
              language: en
              details:
                description: A novel of manners.
                publishedYear: 2003
              files:
                - type: mp4
                  bytes: 482000000
              chapters:
                - title: Chapter 1
                  fileN: 1
                  startMs: 0
                  durationMs: 600000
                - title: Chapter 2
                  fileN: 1
                  startMs: 600000
                  durationMs: 41000000
              cover: true
      responses:
        "201":
          description: The new `uploading` audiobook.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id:
                    $ref: "#/components/schemas/Uuid"
        "400":
          description: |
            The body isn't valid JSON, or doesn't match the schema: an unknown or missing field, an empty or too long
            title, author or narrator, a bad language, ISBN or year, mixed file kinds, an M4B that isn't exactly one
            file, more than 2 GB in all, or chapters that don't tile the files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid
        "401":
          $ref: "#/components/responses/CookieSignedOut"
          description: No valid session cookie, or the server has no database.
        "403":
          description: |
            Plain-text `Forbidden`: an `Origin` header from another site (or none, without `Sec-Fetch-Site:
            same-origin`). JSON `pro`: the account is on Free.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: Forbidden
            application/json:
              schema:
                $ref: "#/components/schemas/ProError"
              example:
                error: pro
                feature: audiobooks
        "404":
          description: Audiobook import is off on this server (`AUDIOBOOKS_DIR` unset or not usable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found
        "409":
          description: |
            `scope: server`: the server would have less than 10 GB free after this upload. `scope: rate`: the account
            has finished 10 imports in the last hour. `scope: books`: the plan's book limit. `scope: audio`: the
            account's 8 GB of audio.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AudiobookServerFullError"
                  - $ref: "#/components/schemas/BooksPlanQuotaError"
                  - $ref: "#/components/schemas/AudiobookStartQuotaError"
              examples:
                server:
                  value:
                    error: quota
                    scope: server
                rate:
                  value:
                    error: quota
                    scope: rate
                    max: 10
                    plan: pro
                books:
                  value:
                    error: quota
                    scope: books
                    max: 25
                    plan: pro
                audio:
                  value:
                    error: quota
                    scope: audio
                    max: 8589934592
                    plan: pro
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /account/books/{id}:
    post:
      operationId: submitBookDetailsForm
      tags: [Book details]
      summary: Save a private book's details, or go back to its generated cover (a form post)
      description: |
        The book page's Cover and details form, answered with a `303` back to the page, so it works without
        JavaScript. `intent=details` saves the title, author, description, ISBN, publisher and year (a field left out
        or empty is cleared, except the title and author, which are required) and audits `book.details_changed` with
        the names of the fields that changed. `intent=remove-cover` deletes the stored cover so the generated one shows,
        and audits `book.cover_changed`. Works for a text book or an audiobook. The page itself (GET) is HTML and not
        described here.

        Checks, in order: the origin (403), the session (303 to sign-in; also without a database), the id (404), the
        form, then the store.
      security: [sessionCookie: []]
      parameters:
        - name: id
          in: path
          required: true
          description: |
            A private book's id. Signed in, anything that isn't a lowercase UUID is a plain-text 404 before any query;
            signed out, it is the 303 to sign-in like any other id.
          schema:
            $ref: "#/components/schemas/Uuid"
      requestBody:
        required: true
        description: |
          Read with the platform's form parser (`application/x-www-form-urlencoded` or `multipart/form-data`); the
          handler sets no byte cap of its own. Only the fields below may be sent, each at most once; any other field,
          or a repeated one, is `?error=invalid`.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/BooksDetailsForm"
            examples:
              details:
                value:
                  intent: details
                  title: Pride and Prejudice
                  author: Jane Austen
                  description: A novel of manners.
                  isbn: 978-0-14-143951-8
                  publisher: Penguin Classics
                  year: "2003"
              removeCover:
                value:
                  intent: remove-cover
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BooksDetailsForm"
      responses:
        "303":
          description: |
            Where the browser goes next (`<id>` is the path's id):

            - `/login?next=%2Faccount%2Fbooks%2F<id>`: no valid session cookie, or the server has no database.
            - `/account/books/<id>?error=invalid`: not a form, an unknown or repeated field, a missing or other
              `intent`, an empty title or author, a title over 300, author over 200 or publisher over 200 characters, or
              a year that isn't 1 to next year.
            - `/account/books/<id>?error=invalid-isbn`: an ISBN that isn't a valid ISBN-10 or ISBN-13.
            - `/account/books/<id>?error=too-long`: a description over 4,000 characters once cleaned.
            - `/account/books/<id>?error=missing`: not one of the account's books (for `details`, not a ready one).
            - `/account/books/<id>?status=saved`: the details are saved (also when nothing changed).
            - `/account/books/<id>?status=cover-removed`: the generated cover shows (also when there was no cover).
            - `/account/books/<id>?error=unavailable`: the database failed; it is logged.
          headers:
            Location:
              description: One of the targets above.
              schema:
                type: string
                pattern: '^/(login\?next=%2Faccount%2Fbooks%2F.+|account/books/[^?]+\?(status|error)=[a-z-]+)$'
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: Signed in, and the id isn't a lowercase UUID.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: Not found

  /account/books/{id}/audio/finish:
    post:
      operationId: finishAudiobookImport
      tags: [Audiobooks]
      summary: Finish an audiobook import (step 3 of 3)
      description: |
        Once every file has arrived whole, the server reads each one itself (what it is by its first bytes, whether
        an M4B's sound is copy-protected or not AAC, then its length and codec). A copy-protected or unreadable file
        deletes the whole upload, rows and files, so a new import must start again. The lengths the server read are
        the ones that count: each file's last chapter is moved to end at the file's end. Then the book is marked
        ready and `book.imported` is audited (it counts towards the hourly import limit).

        Needs no body. Checks, in order: the origin (403), the session (404), the id and the feature (404), the
        upload (404: not the account's audiobook or not uploading), then the files.
      security: [sessionCookie: []]
      parameters:
        - $ref: "#/components/parameters/BooksBookId"
      responses:
        "200":
          description: The audiobook is ready.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksOk"
        "400":
          description: |
            `drm`: a file is copy-protected (an Audible AAX, a protected M4A/M4B). `unreadable`: a file isn't what the
            start said, its sound isn't AAC or MP3, it has no sound track, it is under a second or over 48 hours, it
            couldn't be parsed, or the chapters don't fit its length; `reason` says which, in words. Either way the
            upload is deleted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/AudiobookUnreadableError"
              examples:
                drm:
                  value:
                    error: drm
                unreadable:
                  value:
                    error: unreadable
                    reason: it’s shorter than a second
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
          description: |
            No session, an id that isn't a UUID, another account's book, or a book not in the state this needs: all the
            same 404, so nothing confirms a book exists.
        "409":
          description: A file hasn't arrived whole yet.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: incomplete
        "500":
          $ref: "#/components/responses/Failed"

  /account/books/{id}/audio/{n}:
    get:
      operationId: serveAudiobookFile
      tags: [Audiobooks]
      summary: An imported audiobook's file, with byte ranges
      description: |
        File `n` of the account's own ready audiobook, as the player streams it. One byte range may be asked for
        (`Range: bytes=a-b`, `bytes=a-` or `bytes=-n`), answered 206; a list of ranges, or one that starts past the
        end, is 416. There is no `ETag`, `Last-Modified` or `If-Range` handling. Served with its stored type, never one
        sniffed from the bytes, and never cached.

        Anyone else's book, an unfinished upload, a bad id or number, no session, a file missing on disk and the
        feature turned off all get the same 404, so nothing confirms a book exists. No `Origin` check (a GET).
      security: [sessionCookie: []]
      parameters:
        - $ref: "#/components/parameters/BooksBookId"
        - $ref: "#/components/parameters/AudiobookFileNumber"
        - name: Range
          in: header
          required: false
          description: One range of bytes. Anything else is 416.
          schema:
            type: string
            pattern: '^bytes=\d*-\d*$'
          example: bytes=0-1048575
      responses:
        "200":
          description: The whole file.
          headers:
            Content-Type:
              $ref: "#/components/headers/AudiobookContentType"
            Content-Length:
              $ref: "#/components/headers/AudiobookContentLength"
            Accept-Ranges:
              $ref: "#/components/headers/AudiobookAcceptRanges"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/BooksNoSniff"
            Cross-Origin-Resource-Policy:
              $ref: "#/components/headers/BooksSameOriginResource"
          content:
            audio/mp4:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
        "206":
          description: The range asked for (its end clamped to the file's last byte).
          headers:
            Content-Type:
              $ref: "#/components/headers/AudiobookContentType"
            Content-Length:
              $ref: "#/components/headers/AudiobookContentLength"
            Content-Range:
              $ref: "#/components/headers/AudiobookContentRange"
            Accept-Ranges:
              $ref: "#/components/headers/AudiobookAcceptRanges"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/BooksNoSniff"
            Cross-Origin-Resource-Policy:
              $ref: "#/components/headers/BooksSameOriginResource"
          content:
            audio/mp4:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/AudiobookFileNotFound"
        "416":
          description: |
            The `Range` header isn't one satisfiable range. No body; `Content-Range` is `bytes */<size>`, and the
            stored `Content-Type` is still sent.
          headers:
            Content-Range:
              description: "`bytes */<size>`."
              schema:
                type: string
                pattern: '^bytes \*/\d+$'
            Content-Type:
              $ref: "#/components/headers/AudiobookContentType"
            Accept-Ranges:
              $ref: "#/components/headers/AudiobookAcceptRanges"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/BooksNoSniff"
            Cross-Origin-Resource-Policy:
              $ref: "#/components/headers/BooksSameOriginResource"
        "503":
          $ref: "#/components/responses/AudiobookFileUnavailable"
    head:
      operationId: headAudiobookFile
      tags: [Audiobooks]
      summary: An imported audiobook's file's headers, without the body
      description: |
        As `GET`, without a body. A `Range` header is ignored: the answer is always 200 with the whole file's
        `Content-Length`, never 206 or 416.
      security: [sessionCookie: []]
      parameters:
        - $ref: "#/components/parameters/BooksBookId"
        - $ref: "#/components/parameters/AudiobookFileNumber"
      responses:
        "200":
          description: The whole file's headers, no body.
          headers:
            Content-Type:
              $ref: "#/components/headers/AudiobookContentType"
            Content-Length:
              $ref: "#/components/headers/AudiobookContentLength"
            Accept-Ranges:
              $ref: "#/components/headers/AudiobookAcceptRanges"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/BooksNoSniff"
            Cross-Origin-Resource-Policy:
              $ref: "#/components/headers/BooksSameOriginResource"
        "404":
          description: As `GET`'s 404, without the body.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/BooksNoSniff"
            Cross-Origin-Resource-Policy:
              $ref: "#/components/headers/BooksSameOriginResource"
        "503":
          description: As `GET`'s 503, without the body.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/BooksNoSniff"
            Cross-Origin-Resource-Policy:
              $ref: "#/components/headers/BooksSameOriginResource"
    post:
      operationId: uploadAudiobookChunk
      tags: [Audiobooks]
      summary: Append the next chunk of an audiobook's file (step 2 of 3)
      description: |
        The next bytes of file `n` (1 to the number of files the start declared), written at exactly `offset` and
        counted in one statement that checks the book is the account's and uploading and that `offset` is what the
        server holds. Any other offset is 409 `offset` with `received`, the byte count to resume from, so a dropped
        chunk is simply sent again. Up to three files may upload at once; an M4B is one stream.

        Checks, in order: the origin (403), the session (404), the id, `n` and the feature (404), `offset` (400), the
        body (415, 413, 400), then the file: not uploading (404, or 409 with the whole size when the book is already
        ready), the offset (409), the declared size (400), the server's free disk (409 `server`).
      security: [sessionCookie: []]
      x-quota: ["5 GB left free on the server's disk while chunks arrive (409 quota, scope server)"]
      parameters:
        - $ref: "#/components/parameters/BooksBookId"
        - $ref: "#/components/parameters/AudiobookFileNumber"
        - name: offset
          in: query
          required: true
          description: |
            Where this chunk goes in the file: the bytes already received (0 for the first chunk). 1 to 10 digits;
            missing or anything else is 400 `invalid`.
          schema:
            type: integer
            minimum: 0
            maximum: 9999999999
      requestBody:
        required: true
        description: |
          At most 896 KiB (917,504 bytes), and not empty. The chunk must not reach past the file's declared size.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The chunk is stored.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [received]
                properties:
                  received:
                    type: integer
                    minimum: 1
                    description: The bytes of this file the server now holds; the next chunk's `offset`.
        "400":
          description: |
            `offset` is missing or malformed, the body is empty, or the chunk would reach past the file's declared size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
          description: |
            No session, an id that isn't a UUID, another account's book, or a book not in the state this needs: all the
            same 404, so nothing confirms a book exists.
        "409":
          description: |
            `offset`: the server holds a different number of bytes of this file than `offset` (or the book is already
            ready, when `received` is the whole size); resume from `received`. `quota` with `scope: server`: the server
            has less than 5 GB free.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AudiobookOffsetError"
                  - $ref: "#/components/schemas/AudiobookServerFullError"
              examples:
                offset:
                  value:
                    error: offset
                    received: 917504
                server:
                  value:
                    error: quota
                    scope: server
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          description: The `Content-Type` isn't `application/octet-stream`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid
        "500":
          $ref: "#/components/responses/Failed"

  /account/books/{id}/chapters/{position}:
    post:
      operationId: uploadBookChapter
      tags: [Books]
      summary: Store one chapter of a private book import (step 3 of 4)
      description: |
        One chapter's title and structured blocks. The server checks every block (unknown types, styles or fields are
        refused; text is NFC-normalised and control characters are stripped, code keeping its line breaks), renders
        the HTML itself, sizing each picture from what is stored, paginates it and stores the result, counted against
        the book's 8 MB of HTML. Sending a position again replaces that chapter. The chapter's slug comes from its
        title, unique in the book.

        An image block with `image` above 0 may only name a picture already stored for this book
        (`POST /account/books/{id}/images/{n}`), else 400 `invalid`.

        Checks, in order: the origin (403), the session (404), the id and position (404), the body (415, 413, 400),
        the blocks (400), the pictures (400), then the store: the book (404: not the account's or not uploading), the
        position (400), the size (413).
      security: [sessionCookie: []]
      x-quota:
        - 8 MB of rendered HTML per book (413 book-too-large)
        - 5,000 blocks per chapter request (400 too-long)
      parameters:
        - $ref: "#/components/parameters/BooksBookId"
        - name: position
          in: path
          required: true
          description: |
            The chapter's 0-based position, below the `chapterCount` the start declared. 1 to 4 digits (leading zeros
            allowed); anything else is 404 before any query. A position at or past `chapterCount` is 400 `invalid`.
          schema:
            type: integer
            minimum: 0
            maximum: 9999
      requestBody:
        required: true
        description: At most 900 KB (921,600 bytes).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BooksChapterBody"
            example:
              title: Chapter 1
              blocks:
                - type: heading
                  level: 3
                  runs:
                    - text: Chapter 1
                - type: paragraph
                  runs:
                    - text: "It is a truth universally acknowledged, "
                    - text: that
                      style: em
                    - text: " a single man in possession of a good fortune must be in want of a wife."
                - type: image
                  image: 1
                  alt: The ball at Netherfield
      responses:
        "200":
          description: The chapter is stored.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksOk"
        "400":
          description: |
            `invalid`: the body isn't valid JSON or doesn't match the schema, an image block names a picture not stored
            yet, or the position is at or past the book's `chapterCount`. `too-long`: a limit on a list's length, a
            text's length or lists' nesting is passed (see the schema). `empty`: the chapter renders to no page.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid:
                  value:
                    error: invalid
                tooLong:
                  value:
                    error: too-long
                empty:
                  value:
                    error: empty
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/BooksImportNotFound"
        "413":
          description: |
            `request-too-large`: the body is over 900 KB. `book-too-large`: the book's rendered HTML would pass 8 MB.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                request:
                  value:
                    error: request-too-large
                book:
                  value:
                    error: book-too-large
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /account/books/{id}/cover:
    get:
      operationId: getBookCover
      tags: [Book details]
      summary: A private book's cover image
      description: |
        The stored cover of the account's own ready book (text or audio), with its stored type. Pages link it as
        `/account/books/{id}/cover?v=<first 8 hex digits of its SHA-256>`; `v` changes the address when the cover
        changes and is otherwise ignored. Never cached, never sniffed, never run as a page. There is no `ETag` and no
        304.

        A bad id, no session, another account's book, an unfinished upload and a book without a cover all get the
        same plain-text 404. No `Origin` check (a GET).
      security: [sessionCookie: []]
      parameters:
        - $ref: "#/components/parameters/BooksBookId"
        - name: v
          in: query
          required: false
          description: The cover's short hash, for cache busting in pages. Ignored by the server.
          schema:
            type: string
            pattern: "^[0-9a-f]{8}$"
      responses:
        "200":
          description: The cover.
          headers:
            Content-Length:
              $ref: "#/components/headers/BooksFileLength"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/BooksNoSniff"
            Content-Security-Policy:
              $ref: "#/components/headers/BooksSandboxCsp"
            Cross-Origin-Resource-Policy:
              $ref: "#/components/headers/BooksSameOriginResource"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/BooksPrivateFileNotFound"
        "503":
          $ref: "#/components/responses/BooksPrivateFileUnavailable"
    post:
      operationId: uploadBookCover
      tags: [Book details]
      summary: Upload a private book's cover
      description: |
        The body is the image itself, which the browser has always redrawn (at most 600 × 900, as a JPEG). The server
        decides the type from the bytes, whatever the `Content-Type` said: JPEG or PNG by its first bytes, 64 to 2,400
        pixels wide and 64 to 3,600 tall by its header, at most 512 KB; never SVG. It replaces any cover the book had,
        for a book that is uploading (right after an import starts) or ready, and audits `book.cover_changed`.

        Checks, in order: the origin (403), the session (404, not 401), the id (404), `source` (400), the body (415,
        413, 400 `image`), the bytes (400 `image`), then the book (404: not the account's, or neither uploading nor
        ready).
      security: [sessionCookie: []]
      parameters:
        - $ref: "#/components/parameters/BooksBookId"
        - name: source
          in: query
          required: false
          description: |
            Where the cover came from, as the book page says: `epub`, `zip` or `pdf` (from a book's file), `audio` (from
            an audiobook's file) or `upload` (chosen by the reader). Anything else, `open-library` included (only the
            server fetches those), is 400 `invalid`.
          schema:
            type: string
            enum: [epub, zip, pdf, audio, upload]
            default: upload
      requestBody:
        required: true
        description: At most 512 KB (524,288 bytes), and not empty.
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The stored cover, as pages link it.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [cover]
                properties:
                  cover:
                    $ref: "#/components/schemas/BooksCoverView"
        "400":
          description: |
            `invalid`: `source` isn't one of the five. `image`: the body is empty (`problem: type`) or isn't a JPEG or
            PNG by its bytes (`type`), is under 64 pixels on a side (`small`), or is over 2,400 × 3,600 (`large`).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/BooksCoverImageError"
              examples:
                source:
                  value:
                    error: invalid
                small:
                  value:
                    error: image
                    problem: small
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
          description: |
            No session, an id that isn't a UUID, another account's book, or a book not in the state this needs: all the
            same 404, so nothing confirms a book exists.
        "413":
          description: The body is over 512 KB.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksCoverImageError"
              example:
                error: image
                problem: large
        "415":
          description: The `Content-Type` isn't `image/jpeg` or `image/png`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksCoverImageError"
              example:
                error: image
                problem: type
        "500":
          $ref: "#/components/responses/BooksDetailsFailed"

  /account/books/{id}/finish:
    post:
      operationId: finishBookImport
      tags: [Books]
      summary: Finish a private book import (step 4 of 4)
      description: |
        Marks the import ready once every chapter (positions 0 to `chapterCount - 1`) and every declared picture (1 to
        `images.count`) is stored, and audits `book.imported`, which counts towards the hourly import limit. A ready
        book is no longer uploading, so finishing it again is 404.

        Needs no body. Checks, in order: the origin (403), the session (404), the id (404), then the store.
      security: [sessionCookie: []]
      parameters:
        - $ref: "#/components/parameters/BooksBookId"
      responses:
        "200":
          description: The book is ready.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksOk"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/BooksImportNotFound"
        "409":
          description: A chapter or a declared picture hasn't arrived yet.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: incomplete
        "500":
          $ref: "#/components/responses/Failed"

  /account/books/{id}/images/{n}:
    get:
      operationId: getBookImage
      tags: [Books]
      summary: A picture in a private book
      description: |
        Picture `n` of the account's own ready book, as its chapters' HTML links it, with its stored type. Never cached,
        never sniffed, never run as a page. It carries an `ETag` (the picture's SHA-256 in quotes), but
        `If-None-Match` isn't read, so there is no 304.

        A bad id or number, no session, another account's book, an unfinished upload and a missing picture all get
        the same plain-text 404. No `Origin` check (a GET).
      security: [sessionCookie: []]
      parameters:
        - $ref: "#/components/parameters/BooksBookId"
        - $ref: "#/components/parameters/BooksImageNumber"
      responses:
        "200":
          description: The picture.
          headers:
            Content-Length:
              $ref: "#/components/headers/BooksFileLength"
            ETag:
              description: The picture's SHA-256 in hex, in double quotes.
              schema:
                type: string
                pattern: '^"[0-9a-f]{64}"$'
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/BooksNoSniff"
            Content-Security-Policy:
              $ref: "#/components/headers/BooksSandboxCsp"
            Cross-Origin-Resource-Policy:
              $ref: "#/components/headers/BooksSameOriginResource"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/BooksPrivateFileNotFound"
        "503":
          $ref: "#/components/responses/BooksPrivateFileUnavailable"
    post:
      operationId: uploadBookImage
      tags: [Books]
      summary: Store one picture of a private book import (step 2 of 4)
      description: |
        The body is the picture itself, as the reader's browser drew it. Its bytes must be a JPEG or PNG, 16 to 1,600
        pixels wide and 16 to 4,800 tall, at most 900 KB, and of the type the `Content-Type` names. Sending the same
        `n` again replaces it. The pictures together must stay within the bytes the start declared for the book
        (`images.bytes`) and the account's 250 MB across its books. The browser sends two at a time.

        Checks, in order: the origin (403), the session (404), the id and `n` (404), the body (415, 413, 400), the
        bytes (400), then the store: the book (404: not the account's or not uploading), `n` past the declared
        `images.count` (400), the room (409).
      security: [sessionCookie: []]
      x-quota:
        - the picture bytes the import's start declared, per book (409 quota, scope book)
        - 250 MB of pictures per account, across its books (409 quota, scope user)
      parameters:
        - $ref: "#/components/parameters/BooksBookId"
        - $ref: "#/components/parameters/BooksImageNumber"
      requestBody:
        required: true
        description: At most 900 KB (921,600 bytes), and not empty.
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The picture is stored; its size as read from its header.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, width, height]
                properties:
                  ok:
                    type: boolean
                    const: true
                  width:
                    type: integer
                    minimum: 16
                    maximum: 1600
                  height:
                    type: integer
                    minimum: 16
                    maximum: 4800
        "400":
          description: |
            The body is empty, isn't a JPEG or PNG within the sizes above, isn't the type the `Content-Type` named, or
            `n` is past the `images.count` the start declared.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/BooksImportNotFound"
        "409":
          description: |
            `scope: book`: the book's pictures would pass the bytes its start declared (`max`). `scope: user`: the
            account's pictures would pass 250 MB.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksImageQuotaError"
              example:
                error: quota
                scope: book
                max: 180000
        "413":
          $ref: "#/components/responses/BooksImportTooLarge"
        "415":
          description: The `Content-Type` isn't `image/jpeg` or `image/png`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid
        "500":
          $ref: "#/components/responses/Failed"

  /account/books/{id}/open-library:
    post:
      operationId: applyOpenLibraryMatch
      tags: [Book details]
      summary: Apply the Open Library match the reader picked
      description: |
        The browser sends only the ids it picked from `POST /account/books/lookup`, never a fact to store. The server
        fetches that work's description (when `useDescription`) and that cover (when `useCover` and `coverId`) itself,
        checks the cover's bytes as an upload's are, and applies what came back in one transaction: the description
        and cover replace the book's; an empty year, and after an ISBN search an empty ISBN, are filled from the
        server's memory of the account's last search (an hour); the work is kept for the link back. Audited as
        `book.looked_up`, plus `book.details_changed` and `book.cover_changed` for what changed.

        A cover that can't be fetched or is refused doesn't stop the description (`coverProblem`). A description that
        can't be fetched is 502 or 503 only when no cover was applied either; with a cover it is silently skipped.

        Checks, in order: the origin (403), the session (401), the id (404), the body (415, 413, 400), the book (404:
        not the account's ready book), the hourly limit (429), then Open Library.
      security: [sessionCookie: []]
      x-rate-limit: ["30 lookups an hour per account, searches and applied matches together (429 rate)"]
      x-outside-services: [Open Library]
      parameters:
        - $ref: "#/components/parameters/BooksBookId"
      requestBody:
        required: true
        description: At most 2 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BooksApplyBody"
            example:
              work: OL66554W
              coverId: 8091016
              useCover: true
              useDescription: true
      responses:
        "200":
          description: What was applied.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooksApplyAnswer"
        "400":
          description: |
            The body isn't a JSON object, has an unknown field, a `work` that isn't `OL<digits>W`, a `coverId` that
            isn't a positive integer or null, or `useCover`/`useDescription` that aren't booleans.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid
        "401":
          $ref: "#/components/responses/CookieSignedOut"
          description: No valid session cookie, or the server has no database.
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
          description: |
            No session, an id that isn't a UUID, another account's book, or a book not in the state this needs: all the
            same 404, so nothing confirms a book exists.
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/BooksDetailsFailed"
        "502":
          $ref: "#/components/responses/BooksOpenLibraryUnavailable"
        "503":
          $ref: "#/components/responses/BooksOpenLibraryBusy"

  /account/removed-books:
    post:
      operationId: setBookRemoved
      tags: [Removed books]
      summary: Take a catalogue book out of the reader's library, or put it back
      description: |
        Remove from library on a catalogue book's page, and Restore in the library. Per reader: it changes nothing for
        anyone else, isn't audited, and removing a removed book or restoring one that wasn't removed isn't an error.
        Only catalogue books: a private book (`u-<uuid>`) is deleted from My books instead, so its slug is 400.

        Checks, in order: the origin (403), the session (401), the body (415, 413, 400), the slug in the catalogue
        (404), then the store.
      security: [sessionCookie: []]
      requestBody:
        required: true
        description: At most 1 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemovedBookBody"
            example:
              book: pride-and-prejudice
              removed: true
      responses:
        "200":
          description: The book as it is afterwards.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedBookBody"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/CookieSignedOut"
          description: No valid session cookie, or the server has no database.
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: The slug is well formed but isn't a book in the catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /account/repos/new:
    post:
      operationId: addRepo
      tags: [Repositories]
      summary: Add a public GitHub repository by its address
      description: |
        The address is read by `parseRepoUrl`: a repository's own address on github.com, optionally with
        `/tree/<ref>[/<path>]` or `/blob/<ref>/<path>`. The address itself is never fetched; the server asks GitHub's
        API for the repository, then the ref (tried as a branch, then as a tag or commit, with one, two, then three
        segments), and keeps it on the account. `path` is where the address pointed inside it.

        Checks, in order: the origin (403), the session (401), the body (415, 413, 400), the address (400 with its
        `reason`), the add limit (429), GitHub (404 `not_found` or `ref_not_found`, 503 `busy`, 502 `unavailable`),
        then the store (409 `exists` with the id, or `quota`).
      security: [sessionCookie: []]
      x-quota:
        - 25 repositories per account, on either plan (409 quota)
      x-rate-limit:
        - 30 adds an hour per account, counted from repo.added events (429 limited)
        - each add that asks GitHub also counts toward the 600 views an hour (429 limited)
      requestBody:
        required: true
        description: At most 2 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoAddBody"
            example:
              url: https://github.com/addyosmani/agent-skills
      responses:
        "201":
          description: The repository as it was added.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [repo, path]
                properties:
                  repo:
                    $ref: "#/components/schemas/RepoView"
                  path:
                    type: string
                    description: The folder or file the address pointed at, '' for the root.
        "400":
          description: A body that isn't the shape, or an address that isn't a repository's (with why).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [invalid]
                  reason:
                    type: string
                    enum: [empty, too_long, not_url, not_github, not_repository]
              example:
                error: invalid
                reason: not_repository
        "401":
          $ref: "#/components/responses/CookieSignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: GitHub has no public repository there, or no branch or tag by that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing:
                  value:
                    error: not_found
                ref:
                  value:
                    error: ref_not_found
        "409":
          description: The account already has this repository at this ref, or has 25.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [exists, quota]
                  id:
                    type: string
                    format: uuid
                  max:
                    type: integer
              examples:
                exists:
                  value:
                    error: exists
                    id: 0b9a3c1e-5d2f-4a6b-8c7d-9e0f1a2b3c4d
                quota:
                  value:
                    error: quota
                    max: 25
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          description: The add limit, or the view limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: limited
        "500":
          $ref: "#/components/responses/Failed"
        "502":
          $ref: "#/components/responses/RepoGitHubUnavailable"
        "503":
          $ref: "#/components/responses/RepoGitHubBusy"

  /account/repos/{id}:
    post:
      operationId: changeRepo
      tags: [Repositories]
      summary: Refresh a repository to its latest commit, or remove it
      description: |
        `refresh` asks GitHub for the head of the repository's ref (conditionally, with the last ETag); with no ref
        stored it reads the repository again by its GitHub id first, which catches a rename or a switch to private.
        A 404 marks it gone (`goneAt`) and keeps it. `remove` deletes it from the account; nothing changes on GitHub.

        Checks, in order: the origin (403), the session (401), the id (404 before any query), the body (415, 413,
        400), the repository (404 for anyone else's), the refresh limit (429), then GitHub (503 `busy`, 502).
      security: [sessionCookie: []]
      x-rate-limit: ["120 refreshes an hour per account, the automatic one on opening included (429 limited)"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: At most 1 KB.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [intent]
              properties:
                intent:
                  type: string
                  enum: [refresh, remove]
            example:
              intent: refresh
      responses:
        "200":
          description: The repository after a refresh, with whether its commit moved; or that it was removed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [repo, changed]
                    properties:
                      repo:
                        $ref: "#/components/schemas/RepoView"
                      changed:
                        type: boolean
                  - type: object
                    required: [removed]
                    properties:
                      removed:
                        type: boolean
                        enum: [true]
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/CookieSignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: Not a UUID, or not one of the account's repositories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          description: The refresh limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: limited
        "500":
          $ref: "#/components/responses/Failed"
        "502":
          $ref: "#/components/responses/RepoGitHubUnavailable"
        "503":
          $ref: "#/components/responses/RepoGitHubBusy"

  /account/repos/{id}/raw:
    get:
      operationId: getRepoPicture
      tags: [Repositories]
      summary: A picture from a repository's shown commit
      description: |
        Serves a picture the viewer shows, to the repository's owner only. The path must be a file in the shown
        commit's tree, at most 5 MB, whose bytes sniff as PNG, JPEG, GIF, WebP, AVIF, BMP, ICO or SVG; anything else is
        a 404, so it isn't a download proxy. Sent with the sniffed type, nosniff and a sandboxing CSP, never cached. No
        `Origin` check (a GET). A bad id or path, no session, anyone else's repository and a missing or non-picture
        file all get the same plain-text 404.
      security: [sessionCookie: []]
      x-rate-limit: ["600 views an hour per account, files, folders and pictures together (429, plain text)"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: path
          in: query
          required: true
          description: The file's path from the repository's root, at most 1,024 characters, with no `.` or `..`.
          schema:
            type: string
            maxLength: 1024
      responses:
        "200":
          description: The picture.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/BooksNoSniff"
            Content-Security-Policy:
              description: "`default-src 'none'; style-src 'unsafe-inline'; sandbox`"
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Not a picture the account can see.
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: The view limit.
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: GitHub couldn't be reached, or is busy.
          content:
            text/plain:
              schema:
                type: string

  /account/bookmarks/new:
    post:
      operationId: createBookmark
      tags: [Bookmarks]
      summary: Bookmark a page
      description: |
        The body names only the book and the page; the server takes the anchor (the page's first 64 characters from
        its first non-space one, and the text either side) from its own page text, so nothing the client says about
        the text is stored. Idempotent: 201 with the new bookmark, or 200 with the one the page already has.

        Checks, in order: the origin (403), the session (401), the body (400, 413, 415), the book (404 for an unknown
        book, a catalogue book that has left the library, or anyone else's private book), the page (400 when the book
        has no such page), then the store (404 when a private book is no longer the account's or not ready, 409
        `quota`). Limits: 1,000 bookmarks per book and 10,000 per account, counted apart from highlights and audio
        bookmarks, on every plan.
      security: [sessionCookie: []]
      x-quota:
        - 1,000 bookmarks per book (409 quota, scope book)
        - 10,000 bookmarks per account (409 quota, scope user)
      requestBody:
        required: true
        description: At most 2 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkCreateBody"
            examples:
              chapterBook:
                value:
                  book: pride-and-prejudice
                  position:
                    chapter: chapter-1
                    page: 2
              pagedBook:
                value:
                  book: u-0b9a3c1e-5d2f-4a6b-8c7d-9e0f1a2b3c4d
                  position:
                    printedPage: 112
      responses:
        "200":
          description: The page was already bookmarked; this is its bookmark.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkAnswer"
        "201":
          description: The new bookmark.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkAnswer"
        "400":
          $ref: "#/components/responses/Invalid"
          description: The body isn't valid JSON or doesn't match the schema, or the book has no such page.
        "401":
          $ref: "#/components/responses/CookieSignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
          description: |
            The book isn't in the catalogue, or is a private book that isn't the account's (or isn't ready).
        "409":
          $ref: "#/components/responses/BookmarkQuota"
          description: The account has 1,000 bookmarks in this book, or 10,000 in all.
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /account/bookmarks/{id}:
    post:
      operationId: deleteBookmark
      tags: [Bookmarks]
      summary: Remove a bookmark
      description: |
        Removing is the only change a bookmark has. An id that isn't a lowercase UUID is 404 right after the session
        check, before the body is read; another account's bookmark is 404 too.
      security: [sessionCookie: []]
      parameters:
        - $ref: "#/components/parameters/BookmarkIdParam"
      requestBody:
        required: true
        description: At most 2 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingDeleteBody"
            example:
              intent: delete
      responses:
        "200":
          description: Removed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingOkAnswer"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/CookieSignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /account/bookmarks/audio/new:
    post:
      operationId: createAudioBookmark
      tags: [Audio bookmarks]
      summary: Bookmark a moment while listening
      description: |
        Two kinds. **Read aloud** (`kind: voice`): the book, the page and the offset of the sentence being said; the
        server anchors on up to 64 characters from the first non-space character at or after the offset, from its own
        page text (400 when the book has no such page, or there is no text at or after the offset). **Audiobook**
        (`kind: episode`): the book, the episode id and the time in ms; the episode must be in the book's audiobook,
        the catalogue's or the account's own imported one (404 when the book has no audiobook or isn't the
        account's, 400 for an unknown episode or a time past its length). The time is rounded down to a whole second.

        Idempotent: 201 with the new bookmark, or 200 with the one that sentence or episode second already has. Checks
        run in the order origin, session, body, book, place, store. Limits: 1,000 audio bookmarks per book and 10,000
        per account, counted apart from page bookmarks, on every plan.
      security: [sessionCookie: []]
      x-quota:
        - 1,000 audio bookmarks per book (409 quota, scope book)
        - 10,000 audio bookmarks per account (409 quota, scope user)
      requestBody:
        required: true
        description: At most 2 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioBookmarkCreateBody"
            examples:
              voice:
                value:
                  book: pride-and-prejudice
                  kind: voice
                  position:
                    chapter: chapter-1
                    page: 2
                  offset: 418
              episode:
                value:
                  book: pride-and-prejudice
                  kind: episode
                  episode: chapter-01
                  positionMs: 754000
      responses:
        "200":
          description: The moment was already bookmarked; this is its bookmark.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioBookmarkAnswer"
        "201":
          description: The new audio bookmark.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioBookmarkAnswer"
        "400":
          $ref: "#/components/responses/Invalid"
          description: |
            The body isn't valid JSON or doesn't match the schema; or (voice) the book has no such page or no text at
            the offset; or (episode) the episode isn't in the audiobook, or the time is past its length.
        "401":
          $ref: "#/components/responses/CookieSignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
          description: |
            Voice: the book isn't in the catalogue or isn't one of the account's ready private books. Episode: the book
            has no audiobook (a catalogue book without one, or a private book that isn't the account's imported
            audiobook).
        "409":
          $ref: "#/components/responses/BookmarkQuota"
          description: The account has 1,000 audio bookmarks in this book, or 10,000 in all.
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /account/bookmarks/audio/{id}:
    post:
      operationId: deleteAudioBookmark
      tags: [Audio bookmarks]
      summary: Remove an audio bookmark
      description: |
        Removing is the only change an audio bookmark has. An id that isn't a lowercase UUID is 404 right after the
        session check, before the body is read; another account's bookmark is 404 too.
      security: [sessionCookie: []]
      parameters:
        - $ref: "#/components/parameters/AudioBookmarkIdParam"
      requestBody:
        required: true
        description: At most 2 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingDeleteBody"
            example:
              intent: delete
      responses:
        "200":
          description: Removed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingOkAnswer"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/CookieSignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /account/highlights:
    post:
      operationId: submitHighlightsForm
      tags: [Highlights]
      summary: Delete a highlight, or every highlight in a book (the Highlights page's form)
      description: |
        The plain form behind Delete and Delete all on `/account/highlights`, so the page works without JavaScript.
        Every outcome but a foreign origin is a 303 back to a page (`Cache-Control: private, no-store`):

        - signed out (or no database): `/login?next=%2Faccount%2Fhighlights`;
        - a body that isn't a form: `/account/highlights?error=invalid`;
        - `intent=delete` with an `id` the account has: `/account/highlights?book=<slug>&status=deleted`, the book the
          highlight was in;
        - `intent=delete` with a UUID the account doesn't have: `/account/highlights?error=missing`;
        - `intent=delete-book` with a `book` slug: `/account/highlights?status=deleted-book` when it deleted at least
          one, else `/account/highlights?error=missing`;
        - any other intent, or an `id` that isn't a UUID or a `book` that isn't a slug:
          `/account/highlights?error=invalid`;
        - a database failure: `/account/highlights?error=unavailable`.

        Notes go with their highlights. The page itself (GET) isn't described here.
      security: [sessionCookie: []]
      requestBody:
        required: true
        description: No size cap in the handler. A foreign origin is refused before the body is read.
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/HighlightsFormBody"
            examples:
              delete:
                value:
                  intent: delete
                  id: 3f2a1b4c-5d6e-4f70-8a9b-0c1d2e3f4a5b
              deleteBook:
                value:
                  intent: delete-book
                  book: pride-and-prejudice
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/HighlightsFormBody"
      responses:
        "303":
          description: Back to the Highlights page (or to sign in), with the outcome in the query string.
          headers:
            Location:
              description: One of the targets listed in the description.
              schema:
                type: string
              examples:
                deleted:
                  value: /account/highlights?book=pride-and-prejudice&status=deleted
                deletedBook:
                  value: /account/highlights?status=deleted-book
                missing:
                  value: /account/highlights?error=missing
                invalid:
                  value: /account/highlights?error=invalid
                unavailable:
                  value: /account/highlights?error=unavailable
                signedOut:
                  value: /login?next=%2Faccount%2Fhighlights
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "403":
          $ref: "#/components/responses/ForeignOrigin"

  /account/highlights/new:
    post:
      operationId: createHighlight
      tags: [Highlights]
      summary: Save a highlight, with an optional note
      description: |
        `start` and `end` are offsets in the page's text in UTF-16 units, and `text` must equal the server's page text
        between them exactly (else 409 `stale`: the page changed since it loaded). The server computes the 32
        characters either side itself. The note is cleaned (Unicode NFC, control characters but line breaks and tabs
        removed, trimmed); one that is empty afterwards is no note.

        Checks, in order: origin (403), session (401), body (400, 413, 415), the book (404), the page (400 when the
        book has no such page or `end` is past its text), the passage (409 `stale`), then the store (404 when a private
        book is no longer the account's or not ready, 409 `quota`). Limits by plan, the account's cap checked first:
        Free 50 highlights in all (notes live on highlights); Pro 1,000 per book and 10,000 in all. The 409 carries the
        `max` and the `plan`.
      security: [sessionCookie: []]
      x-quota:
        - "Free: 50 highlights per account, notes included (409 quota, scope user, plan free)"
        - "Pro: 1,000 highlights per book (409 quota, scope book) and 10,000 per account (409 quota, scope user)"
      requestBody:
        required: true
        description: At most 64 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HighlightCreateBody"
            example:
              book: pride-and-prejudice
              position:
                chapter: chapter-1
                page: 1
              start: 0
              end: 60
              text: It is a truth universally acknowledged, that a single man in
              color: yellow
              note: The famous opening.
      responses:
        "201":
          description: The new highlight.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HighlightAnswer"
        "400":
          $ref: "#/components/responses/Invalid"
          description: |
            The body isn't valid JSON or doesn't match the schema, or the book has no such page, or `end` is past the
            page's text.
        "401":
          $ref: "#/components/responses/CookieSignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
          description: |
            The book isn't in the catalogue, or is a private book that isn't the account's (or isn't ready).
        "409":
          description: |
            `stale`: `text` isn't the page's text between `start` and `end`. `quota`: the account is at its plan's
            limit.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/HighlightQuotaError"
              examples:
                stale:
                  value:
                    error: stale
                freeQuota:
                  value:
                    error: quota
                    scope: user
                    max: 50
                    plan: free
                proBookQuota:
                  value:
                    error: quota
                    scope: book
                    max: 1000
                    plan: pro
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /account/highlights/{id}:
