        `intent: update` with `color`, `note` or both; a `note` of `null` or `''` (or only whitespace) removes the
        note, and leaving `note` out keeps it. `intent: delete` deletes the highlight and its note. An id that isn't a
        lowercase UUID is 404 right after the session check, before the body is read; another account's highlight is
