        sign in and back to the book's Highlights page. On Free it is a 403 with the Pro notice's heading as plain
        text. An unknown book, a catalogue book that has left the library, or another account's private book is 404.

        **The file** (`text/markdown`, an attachment named `<book-slug>-highlights.md`; a private book `u-<uuid>` is
        named after its title instead, slugified and cut to 80 characters, or `book-highlights.md` when nothing is
        left) starts with Obsidian properties (YAML front matter, each string JSON-quoted): `title`, `author` (left
        out when empty), `source` (the absolute URL of `/account/highlights?book=<slug>`), `exported` (the UTC date,
        unquoted), `highlights` and `notes` (counts) and `tags` (`folio`, `highlights`). Then `# <title>`, a byline
        ("Jane Austen · 12 highlights · exported from Folio on 2026-11-20"), and a `##` section per chapter ("3.
        Chapter title", or "Chapter 3"), then `## Passages no longer found`, or "No highlights yet." when there are
        none. Each highlight is its passage quoted line by line (`> `), its note as written, and an absolute link to
        its page labelled like "Ch. 3 · p. 2"; a `---` rule separates highlights. Passages and titles are escaped as
        in the all-books export; notes are not.
      security: [sessionCookie: []]
      x-pro-feature: export
      parameters:
        - $ref: "#/components/parameters/HighlightExportBookParam"
      responses:
        "200":
          description: The Markdown file.
          headers:
            Content-Disposition:
              description: '`attachment; filename="<book-slug>-highlights.md"`, or the private book''s title slugified.'
              schema:
                type: string
                pattern: '^attachment; filename="[a-z0-9-]+-highlights\.md"$'
                examples: ['attachment; filename="pride-and-prejudice-highlights.md"']
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            text/markdown; charset=utf-8:
              schema:
                type: string
        "302":
          description: Signed out, or the server has no database configured.
          headers:
            Location:
              description: "`/login?next=` and the book's Highlights page, URL-encoded."
              schema:
                type: string
                examples: ["/login?next=%2Faccount%2Fhighlights%3Fbook%3Dpride-and-prejudice"]
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "403":
          $ref: "#/components/responses/ProRequiredText"
        "404":
          $ref: "#/components/responses/ReadingTextNotFound"
        "500":
          $ref: "#/components/responses/ReadingTextFailed"

