  /account/highlights/export:
    get:
      operationId: exportAllHighlights
      tags: [Highlights]
      summary: Download every book's highlights and notes as one Markdown file
      description: |
        A plain GET, so the page's link works without JavaScript; it needs no `Origin` header. Markdown export is part
        of Pro: on Free it is a 403 with the Pro notice's heading as plain text. Signed out (or no database) it is a
        302 to sign in and back to `/account/highlights`.

        **The file** (`text/markdown`, an attachment named `folio-highlights-<YYYY-MM-DD>.md`, the UTC date) starts
        with Obsidian properties (YAML front matter, each string JSON-quoted): `title: "Folio highlights"`, `source`
        (the absolute URL of `/account/highlights`), `exported` (the UTC date, unquoted), `books`, `highlights`,
        `notes` (counts) and `tags` (`folio`, `highlights`). Then `# Folio highlights` and a byline ("2 books · 14
        highlights · 3 notes · exported from Folio on 2026-11-20"), or "No highlights yet." when there are none.

        Each book is a `##` heading (its title), a byline (author, highlight and note counts, and an "Open in Folio"
        link to its Highlights page), then `###` per chapter ("3. Chapter title", or "Chapter 3" without a title) and
        a last `### Passages no longer found` section. Each highlight is its passage quoted line by line (`> `),
        then its note as written, then an absolute link to its page labelled like "Ch. 3 · p. 2"; a `---` rule
        separates the highlights within a book. Passages and the book and chapter titles are escaped with a
        backslash before each of `` \ ` * _ [ ] < > & # $ % = ~ | ^ ``, and a leading list marker; notes are not
        escaped, since they are the reader's own Markdown. Books are in title order (case and accents ignored,
        numbers in order), then by slug; catalogue books that have left the library come last, named by their slug
        in backticks and without a link, with every passage under "Passages no longer found".
      security: [sessionCookie: []]
      x-pro-feature: export
      responses:
        "200":
          description: The Markdown file.
          headers:
            Content-Disposition:
              description: '`attachment; filename="folio-highlights-<YYYY-MM-DD>.md"`, the UTC date.'
              schema:
                type: string
                pattern: '^attachment; filename="folio-highlights-\d{4}-\d{2}-\d{2}\.md"$'
                examples: ['attachment; filename="folio-highlights-2026-11-20.md"']
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            text/markdown; charset=utf-8:
              schema:
                type: string
        "302":
          description: Signed out, or the server has no database configured.
          headers:
            Location:
              schema:
                type: string
                const: /login?next=%2Faccount%2Fhighlights
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "403":
          $ref: "#/components/responses/ProRequiredText"
        "500":
          $ref: "#/components/responses/ReadingTextFailed"

