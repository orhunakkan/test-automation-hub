  /account/sync:
    post:
      operationId: saveSyncBatch
      tags: [Sync]
      summary: Save what changed on this device, for sync across devices
      description: |
        One batch of reading places, listening positions and the reader settings, sent every few seconds while
        someone reads, when the tab is hidden, when the page is left (a keepalive fetch) and before sign-out. At least
        one of the three fields; at most 20 reading and 20 listening items. Each item has its own `at`, when the reader
        did it, in milliseconds since the epoch by the device's clock; an `at` later than the server's clock becomes
        the server's clock, and per item the newest `at` wins against what the account has (a tie keeps the account's).
        Two items in one batch for the same thing keep the newer (the later in the list on a tie).

        The body is checked strictly (400 for any wrong field). Then each item is checked against the server's own
        content, and an unknown book, another account's private book, a page the book doesn't have or an episode the
        book doesn't have is skipped and counted in `skipped`, while the rest is saved in one transaction; so a
        device holding a deleted book's place doesn't retry for ever. A `positionMs` past an episode's end becomes its
        end. The device's name comes from the request's `User-Agent` ("Safari on iPhone"), never from the body.
      security: [sessionCookie: []]
      requestBody:
        required: true
        description: At most 16 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncBatchBody"
            example:
              reading:
                - book: pride-and-prejudice
                  position:
                    chapter: chapter-3
                    page: 2
                  at: 1763631000000
              listening:
                - book: pride-and-prejudice
                  kind: episode
                  episode: chapter-03
                  positionMs: 125000
                  at: 1763631000000
                - book: u-0b9a3c1e-5d2f-4a6b-8c7d-9e0f1a2b3c4d
                  kind: voice
                  position:
                    printedPage: 112
                  offset: 418
                  at: 1763631000000
              settings:
                values:
                  theme: sepia
                  font: literata
                  leading: normal
                  measure: normal
                at: 1763631000000
      responses:
        "200":
          description: Saved, except the items counted in `skipped`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAnswer"
              example:
                ok: true
                skipped: 0
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/CookieSignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /account/export:
    get:
      operationId: exportAccountData
      tags: [Data export]
      summary: Download everything the account holds, as one JSON file
      description: |
        Download all your data, on every plan. A plain GET, so the account page's link works without JavaScript; it
        needs no `Origin` header. Signed out (or no database) it is a 302 to sign in and back to `/account#data`. At
        most 10 downloads an hour, counted from the account's `account.exported` audit events; over it, a plain-text
        429 (no `Retry-After`). Each download is audited with its size in bytes, never its contents.

        The file is pretty-printed JSON (2 spaces), `format: "folio-account"`, `version: 1`. Left out on purpose:
        password, session and access-token hashes, the API key's ciphertext, passkeys' credential ids, public keys and
        counters, sign-in attempts, passkey challenges, mailed links and invites, the anchors' offsets, prefixes and
        suffixes, private books' pages, covers, pictures and audio, and Paddle's ids. Every book reference is
        `{ slug, title }`.
      security: [sessionCookie: []]
      x-rate-limit: ["10 downloads an hour per account, counted from account.exported events (429, plain text)"]
      responses:
        "200":
          description: The account's data.
          headers:
            Content-Disposition:
              description: '`attachment; filename="folio-account-<username>-<YYYY-MM-DD>.json"`, the UTC date.'
              schema:
                type: string
                pattern: '^attachment; filename="folio-account-[^"]+-\d{4}-\d{2}-\d{2}\.json"$'
                examples: ['attachment; filename="folio-account-reader-2026-11-20.json"']
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "302":
          description: Signed out, or the server has no database configured.
          headers:
            Location:
              schema:
                type: string
                const: /login?next=%2Faccount%23data
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "404":
          $ref: "#/components/responses/ReadingTextNotFound"
          description: The account was deleted between the session check and the read.
        "429":
          description: The account has downloaded its data 10 times in the last hour.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: You’ve downloaded your data 10 times in the last hour. Try again later.
        "500":
          $ref: "#/components/responses/ReadingTextFailed"

  /account/lookup/word:
    post:
      operationId: lookUpWord
      tags: [Word lookup]
      summary: A word's dictionary entry (Wiktionary) or encyclopedia summary (Wikipedia)
      description: |
        Free on both plans. The server asks Wikimedia, never the reader's browser: the English Wiktionary's
        `/api/rest_v1/page/definition/<term>` for `dictionary`, or the book's language's Wikipedia
        `/api/rest_v1/page/summary/<term>` for `wikipedia` (the language is the primary subtag of the book's
        language, `en` when it has none). A capitalised term that Wiktionary doesn't know is asked once more in lower
        case. Answers from Wikimedia, found or not, are cached in memory for 6 hours (at most 1,000), so a repeat
        doesn't reach Wikimedia, but it still counts towards the limit.

        Checks, in order: same origin (403), a session (401), the body (415, 413, 400), the term (400), the book (404:
        any catalogue book, or the caller's own ready private book), the hourly limit (429), then Wikimedia.

        Every request past the limit check is audited as `word.looked_up` (book, source, outcome), whatever the
        outcome; never the term.

        Limits: 300 lookups an hour per account, dictionary and Wikipedia together (429 `rate` with `retryAt`). At
        most 8 Wikimedia requests in flight for the whole server; past that the answer is 503 `busy` without asking.
      security: [sessionCookie: []]
      x-rate-limit:
        - 300 dictionary and Wikipedia lookups an hour per account (429 rate)
        - at most 8 Wikimedia requests in flight for the whole server (503 busy)
      x-outside-services: [Wikimedia]
      requestBody:
        required: true
        description: At most 4 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WordLookupBody"
            example:
              book: pride-and-prejudice
              term: entailed
              source: dictionary
      responses:
        "200":
          description: |
            What Wikimedia has for the term. `found` with `source: dictionary` is Wiktionary's entry, `found` with
            `source: wikipedia` the article's summary, `ambiguous` a Wikipedia disambiguation page, and `not-found`
            nothing (with Wikipedia's search page for the term when the source was `wikipedia`).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordAnswer"
              examples:
                dictionary:
                  value:
                    state: found
                    source: dictionary
                    term: entail
                    language: en
                    languageName: English
                    otherLanguage: false
                    senses:
                      - partOfSpeech: Verb
                        definitions:
                          - text: To cause, bring about, or involve by necessity or as a consequence.
                    url: https://en.wiktionary.org/wiki/entail
                wikipedia:
                  value:
                    state: found
                    source: wikipedia
                    title: Hertfordshire
                    description: County of England
                    extract: Hertfordshire is a ceremonial county in the East of England.
                    url: https://en.wikipedia.org/wiki/Hertfordshire
                ambiguous:
                  value:
                    state: ambiguous
                    title: Mercury
                    url: https://en.wikipedia.org/wiki/Mercury
                notFound:
                  value:
                    state: not-found
                    searchUrl: https://en.wikipedia.org/w/index.php?search=Lucas+Lodge
        "400":
          description: |
            The body isn't valid JSON or doesn't match the schema, or the term isn't one after it is normalised
            (1 to 60 characters, 1 to 3 words, with a letter).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid
        "401":
          $ref: "#/components/responses/CookieSignedOut"
          description: No session cookie. A cookie-only endpoint, so no `WWW-Authenticate` header is sent.
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          description: The book isn't in the catalogue and isn't one of the caller's own ready private books.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          $ref: "#/components/responses/RateLimited"
          description: 300 lookups in the last hour; `retryAt` is when the next one is allowed.
        "500":
          $ref: "#/components/responses/Failed"
        "502":
          description: Wikimedia couldn't be reached, timed out, redirected elsewhere, or answered something unreadable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: unavailable
        "503":
          description: Wikimedia answered 429 or 503, or 8 Wikimedia requests are already in flight on the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: busy

  /account/lookup/translate:
    post:
      operationId: translateText
      tags: [Word lookup]
      summary: Translate a word in its sentence, or a passage, on the reader's own Anthropic key
      description: |
        A Pro feature (`translate`). One non-streamed Anthropic Messages request with the reader's own saved key and
        chosen model: adaptive thinking, effort low, at most 1,000 output tokens, 30 s, server-side fallbacks on
        (beta `server-side-fallback-2026-07-01`), aborted when the browser goes away. It sends the text, the sentence
        (for a term), and the book's title and language, never the book's text.

        A `text` that normalises to a term (1 to 60 characters, 1 to 3 words, with a letter) is translated as that
        term with its `context` sentence; anything longer is a passage, translated as sent with its paragraphs, and
        `context` is ignored.

        Checks, in order: same origin (403), a session (401), the plan (403 `pro`), the body (415, 413, 400), the input
        (400), the book (404), a saved Anthropic key (409 `no_key`), the hourly limit (429), then Anthropic. Every
        request past the limit check is audited as `word.translated` (book, kind, target, model, tokens, error code);
        never the text or the translation.
      security: [sessionCookie: []]
      x-pro-feature: translate
      x-rate-limit: [120 translations an hour per account (429 rate)]
      x-outside-services: [Anthropic]
      requestBody:
        required: true
        description: At most 8 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateBody"
            example:
              book: pride-and-prejudice
              text: entailed
              context: The estate was entailed on Mr. Collins.
              to: tr
      responses:
        "200":
          description: The translation, plain text.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslateAnswer"
              example:
                translation: |-
                  miras yoluyla bağlanmış
                  Mülkün yalnızca belirli bir mirasçıya geçebileceği anlamında.
                model: claude-sonnet-5-5
        "400":
          $ref: "#/components/responses/Invalid"
          description: |
            The body isn't valid JSON or doesn't match the schema, or after cleaning the text is empty or over 1,000
            characters, or the context is over 1,000.
        "401":
          $ref: "#/components/responses/CookieSignedOut"
          description: No session cookie. A cookie-only endpoint, so no `WWW-Authenticate` header is sent.
        "403":
          description: |
            `text/plain` `Forbidden`: an `Origin` header from another site. JSON `pro`: the account is on Free
            (Translate is part of Pro), answered before the body is read.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: Forbidden
            application/json:
              schema:
                $ref: "#/components/schemas/ProError"
              example:
                error: pro
                feature: translate
        "404":
          description: The book isn't in the catalogue and isn't one of the caller's own ready private books.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not_found
        "409":
          description: The account has no Anthropic key saved (API keys, on the account page).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no_key
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          $ref: "#/components/responses/RateLimited"
          description: 120 translations in the last hour; `retryAt` is when the next one is allowed.
        "500":
          $ref: "#/components/responses/Failed"
        "502":
          description: |
            Anthropic refused or failed. `key_rejected`: it answered 401 or 403, the saved key no longer works.
            `billing`: 402, a billing problem on the reader's Anthropic account. `refused`: the model declined
            (stop reason `refusal`). `failed`: anything else, including an empty answer, the 30 s deadline, or the
            browser going away mid-request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                keyRejected:
                  value:
                    error: key_rejected
                billing:
                  value:
                    error: billing
                refused:
                  value:
                    error: refused
                failed:
                  value:
                    error: failed
        "503":
          description: Anthropic answered 429 or 529, or reported itself overloaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: busy

  /account/read-aloud/speak:
    post:
      operationId: speakUtterance
      tags: [Read aloud]
      summary: Speak one utterance with the reader's ElevenLabs voice
      description: |
        A Pro feature (`elevenlabs`), on the reader's own saved ElevenLabs key. The body names a position, never
        text: a book, a 0-based chapter index and either one utterance's exact `[start, end)` span in a page's text
        (as the browser's `utterances()` splits the page) or the chapter's intro ("Chapter 3. Functions."). The server
        loads that chapter from its own pages and speaks what they say there, so a key can only ever speak the books
        Folio serves the reader. Any span that isn't exactly one of the page's utterances is 400.

        It calls ElevenLabs' `POST /v1/text-to-speech/{voice}/with-timestamps` with the reader's speech model, the
        book's language, and up to 300 characters of the neighbouring utterances as `previous_text` and `next_text`.
        `format: low` asks for `mp3_44100_64`; if ElevenLabs refuses that with 400, 403 or 422 it is asked once more at
        `mp3_44100_128` and the answer says `format: standard`, which the browser should then ask for. 20 s deadline,
        aborted when the browser goes away. No redirects are followed.

        The audio is not streamed: it comes back inside the JSON answer as base64 MP3, never cached. Only a successful
        generation counts towards the hourly limit (in `speech_usage`, per minute).

        Checks, in order: same origin (403), a session (401), the plan (403 `pro`), the body (415, 413, 400), the input
        (400), the book and chapter (404), the span (400), a saved ElevenLabs key (409 `no_key`), the hourly limit
        (429), then ElevenLabs.
      security: [sessionCookie: []]
      x-pro-feature: elevenlabs
      x-rate-limit: ["150,000 characters of speech an hour per account, counted per minute (429 rate)"]
      x-outside-services: [ElevenLabs]
      requestBody:
        required: true
        description: At most 2 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakBody"
            examples:
              span:
                value:
                  book: pride-and-prejudice
                  chapter: 0
                  voice: 21m00Tcm4TlvDq8ikWAM
                  format: low
                  position:
                    chapter: chapter-1
                    page: 1
                  start: 0
                  end: 118
              intro:
                value:
                  book: pride-and-prejudice
                  chapter: 0
                  voice: 21m00Tcm4TlvDq8ikWAM
                  intro: true
      responses:
        "200":
          description: The utterance as base64 MP3, the words' page spans and times, and the format used.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeakAnswer"
              example:
                audio: SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA
                words:
                  - start: 0
                    end: 2
                    t0: 0
                    t1: 180
                  - start: 3
                    end: 5
                    t0: 180
                    t1: 340
                format: low
        "400":
          $ref: "#/components/responses/Invalid"
          description: |
            The body isn't valid JSON or doesn't match the schema, or the span isn't exactly one of the page's
            utterances (or the position isn't one of the chapter's pages).
        "401":
          $ref: "#/components/responses/CookieSignedOut"
          description: No session cookie. A cookie-only endpoint, so no `WWW-Authenticate` header is sent.
        "403":
          description: |
            `text/plain` `Forbidden`: an `Origin` header from another site. JSON `pro`: the account is on Free
            (ElevenLabs voices are part of Pro), answered before the body is read.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: Forbidden
            application/json:
              schema:
                $ref: "#/components/schemas/ProError"
              example:
                error: pro
                feature: elevenlabs
        "404":
          description: |
            `not_found`: the book isn't in the catalogue or one of the caller's own ready private books, or has no
            chapter at that index. `voice_gone`: ElevenLabs doesn't know the voice (404, `voice_not_found` or
            `invalid_voice_id`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  value:
                    error: not_found
                voiceGone:
                  value:
                    error: voice_gone
        "409":
          description: The account has no ElevenLabs key saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no_key
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          $ref: "#/components/responses/RateLimited"
          description: |
            Speaking this utterance would take the account over 150,000 characters in the last hour; `retryAt` is when
            it fits again.
        "500":
          $ref: "#/components/responses/Failed"
        "502":
          description: |
            ElevenLabs refused or failed. `key_rejected`: 401 or `invalid_api_key`/`missing_api_key`. `no_credits`:
            402 or `insufficient_credits`. `permission`: 403, the key may not use text to speech. `failed`: anything
            else, including the 20 s deadline and an answer without audio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                keyRejected:
                  value:
                    error: key_rejected
                noCredits:
                  value:
                    error: no_credits
                permission:
                  value:
                    error: permission
                failed:
                  value:
                    error: failed
        "503":
          description: |
            ElevenLabs answered 429 or 503, or `rate_limit_exceeded`, `concurrent_limit_exceeded` or `system_busy`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: busy

  /read/{book}/ask:
    post:
      operationId: askTheBook
      tags: [Ask the book]
      summary: Ask a question about the book up to the reader's page, answered as an NDJSON stream
      description: |
        A Pro feature (`ask`), on the reader's own saved Anthropic key and chosen model. The server builds the request
        from its own copy of the book up to the reader's page (or the whole book with `wholeBook`), the reader's
        highlights in that chapter when `highlights` is true (loaded on the server, never sent by the browser), the
        history and the question, and streams Anthropic's answer back: adaptive thinking, effort medium, at most 16,000
        output tokens, server-side fallbacks on (beta `server-side-fallback-2026-07-01`). The upstream request is
        aborted when the browser goes away.

        An `action` is a fixed request from one of the reader's buttons: `explain` and `define` are about the `quote`
        (which they need); `summary`, `recap`, `quiz` and `flashcards` are about the pages read (they refuse a quote).
        No action goes with `highlights: true`. `quiz` and `flashcards` need at least 400 characters of book text in
        the pages they cover (the current chapter so far, or the chapter before it as well under 3,000), else 422.

        Checks, in order, all answered as JSON before the stream starts: same origin (403), a session (401), the plan
        (403 `pro`), the book (404), the body (415, 413, 400), the position (400), for a quiz or flashcards the amount
        read (422), the hourly limit (429 `limit`), a saved Anthropic key (409), the size (413 `too_long`: the book text
        is estimated at 2.5 characters a token, at most 800,000 tokens). After that the answer is 200 and anything that
        goes wrong arrives as an `error` event in the stream.

        Audited as `book.asked` (book, models, token counts, stop reason, action, item count), never the question,
        the book text or the answer.
      security: [sessionCookie: []]
      x-pro-feature: ask
      x-rate-limit: [60 questions an hour per account, quizzes and flashcards included (429 limit)]
      x-outside-services: [Anthropic]
      parameters:
        - name: book
          in: path
          required: true
          description: |
            A catalogue book's slug, or `u-<uuid>` for one of the caller's own ready private books. Anything else,
            including another account's private book, is 404 before the body is read.
          schema:
            $ref: "#/components/schemas/BookSlug"
      requestBody:
        required: true
        description: |
          At most 128 KB. Text fields are NFC-normalised, stripped of control characters other than line breaks and
          tabs, and trimmed before their lengths are checked.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskBody"
            examples:
              question:
                value:
                  position:
                    chapter: chapter-3
                    page: 2
                  wholeBook: false
                  question: Why does Darcy refuse to dance?
                  quote: She is tolerable; but not handsome enough to tempt me.
                  history: []
              quiz:
                value:
                  position:
                    chapter: chapter-3
                    page: 2
                  wholeBook: false
                  question: Quiz me
                  action: quiz
      responses:
        "200":
          description: |
            The answer, streamed as NDJSON: one JSON object per line, each an `AskEvent`, flushed as it comes (nginx is
            told not to buffer it).

            - A question or a prose action: any number of `text` events (pieces of the answer to append) with
              `citation` events among them (each sent right after the text of the block it cites), then `done`, or
              `error` if Anthropic fails part way.
            - `quiz` or `flashcards`: no `text` or `citation`; once the message has ended, one `quiz` event (3 to 5
              questions) or `cards` event (4 to 10 cards), then `done`. An answer that doesn't keep to the format ends
              with `error` `bad_format` instead of both. A refusal (stop reason `refusal`) ends with just `done`.
            - If the browser goes away nothing more is sent.

            The `Content-Type` is `application/x-ndjson; charset=utf-8`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Accel-Buffering:
              description: Tells nginx to pass the stream through unbuffered.
              schema:
                type: string
                const: "no"
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/AskEvent"
              examples:
                text:
                  summary: One piece of the answer
                  value:
                    type: text
                    text: "Darcy is proud and ill at ease among strangers. "
                citation:
                  summary: A page the answer cites
                  value:
                    type: citation
                    pageHref: /read/pride-and-prejudice/chapter-3/2
                    label: Ch. 3 · p. 2
                    citedText: She is tolerable; but not handsome enough to tempt me.
                done:
                  summary: The last line of a finished answer
                  value:
                    type: done
                    stop: end_turn
                error:
                  summary: The last line when Anthropic failed
                  value:
                    type: error
                    code: key_rejected
        "400":
          $ref: "#/components/responses/Invalid"
          description: |
            The body isn't valid JSON or doesn't match the schema (including the action rules), or the position isn't
            a page of this book (a chapter book takes `{ chapter, page }`, a paged book `{ printedPage }`).
        "401":
          description: No session cookie. A cookie-only endpoint, so no `WWW-Authenticate` header is sent.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskRefusal"
              example:
                error: signed_out
        "403":
          description: |
            `text/plain` `Forbidden`: an `Origin` header from another site. JSON `pro`: the account is on Free (Ask
            the book is part of Pro), answered before the book or the body is read.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: Forbidden
            application/json:
              schema:
                $ref: "#/components/schemas/ProError"
              example:
                error: pro
                feature: ask
        "404":
          description: The book isn't in the catalogue and isn't one of the caller's own ready private books.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskRefusal"
              example:
                error: not_found
        "409":
          description: The account has no Anthropic key saved.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskRefusal"
              example:
                error: no_key
        "413":
          description: |
            `invalid`: the body is over 128 KB. `too_long`: the book text the question needs is estimated at more than
            800,000 tokens (ask without `wholeBook`).
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskRefusal"
              examples:
                tooLarge:
                  value:
                    error: invalid
                tooLong:
                  value:
                    error: too_long
        "415":
          $ref: "#/components/responses/NotJson"
        "422":
          description: A quiz or flashcards with less than 400 characters of book text in the pages they cover.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskRefusal"
              example:
                error: too_little
        "429":
          description: 60 questions in the last hour; `retryAt` is when the next one is allowed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskLimitError"
              example:
                error: limit
                retryAt: "2026-11-20T10:30:00.000Z"
        "500":
          description: Something went wrong on the server before the stream started; it is logged.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskRefusal"
              example:
                error: failed

  /account/plan/checkout:
    post:
      operationId: createCheckout
      tags: [Plans and billing]
      summary: Create the Paddle transaction that Paddle.js's checkout opens
      description: |
        The server creates a Paddle transaction (`POST /transactions`) for the signed-in account
        (`custom_data.folio_user`) at the price it chooses: monthly, or yearly at the founding price while Folio counts
        fewer than 100 founding subscriptions (any status), else the regular yearly price. The browser opens it with
        Paddle.js; the account becomes Pro only when Paddle's signed webhook (`POST /billing/paddle`) says so, never
        here. Audited as `billing.checkout` (`{ cadence, founding }`).

        Checks, in order: billing configured on this server (404), same origin (403), a session (401), the body (415,
        413, 400), then 409 `subscribed` when a subscription already makes the account Pro, 409 `pro` when the admin
        role or an admin's grant does.
      security: [sessionCookie: []]
      x-outside-services: [Paddle]
      requestBody:
        required: true
        description: At most 1 KB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutBody"
            example:
              cadence: year
      responses:
        "200":
          description: The transaction and what Paddle.js needs to open it.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutAnswer"
              example:
                transactionId: txn_01placeholder0000000000
                clientToken: test_placeholder0000000000
                env: sandbox
                email: reader@example.com
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/CookieSignedOut"
          description: No session cookie. A cookie-only endpoint, so no `WWW-Authenticate` header is sent.
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/BillingOff"
        "409":
          description: |
            `subscribed`: the account has a subscription that makes it Pro (active, trialing or past due). `pro`: the
            account is Pro through the admin role or an admin's grant.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                subscribed:
                  value:
                    error: subscribed
                pro:
                  value:
                    error: pro
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"
        "502":
          $ref: "#/components/responses/PaddleFailed"

  /account/plan/portal:
    post:
      operationId: openBillingPortal
      tags: [Plans and billing]
      summary: Open a session in Paddle's customer portal (Manage billing)
      description: |
        Asks Paddle for a customer portal session (`POST /customers/{id}/portal-sessions`) for the account's newest
        live subscription (else its newest of any status) and answers the portal's overview address. No body is read;
        anything sent is ignored.

        Checks, in order: billing configured on this server (404), same origin (403), a session (401), then 404 when the
        account has no subscription with a Paddle customer.
      security: [sessionCookie: []]
      x-outside-services: [Paddle]
      responses:
        "200":
          description: The portal's address, to open in the same tab.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
                    description: Paddle's portal overview; always https in production.
              example:
                url: https://customer-portal.paddle.com/cpl_placeholder
        "401":
          $ref: "#/components/responses/CookieSignedOut"
          description: No session cookie. A cookie-only endpoint, so no `WWW-Authenticate` header is sent.
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/BillingOff"
          description: |
            Billing isn't configured on this server, or the account has no subscription with a Paddle customer.
        "500":
          $ref: "#/components/responses/Failed"
        "502":
          $ref: "#/components/responses/PaddleFailed"

  /account/plan/state:
    get:
      operationId: getPlanState
      tags: [Plans and billing]
      summary: The account's plan, where it comes from, and its subscription
      description: |
        What the Pro page shows, and what it polls (every 2 s) after Paddle's checkout until the webhook has made the
        account Pro. Answers whether or not billing is configured. No `Origin` check (a GET).
      security: [sessionCookie: []]
      responses:
        "200":
          description: The plan's state.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanState"
              example:
                billing: true
                plan: pro
                source: paid
                subscription:
                  cadence: year
                  founding: true
                  status: active
                  periodEndsAt: "2027-11-20T09:30:00.000Z"
                  cancelAt: null
                  endedAt: null
                foundingLeft: 87
        "401":
          $ref: "#/components/responses/CookieSignedOut"
          description: No session cookie. A cookie-only endpoint, so no `WWW-Authenticate` header is sent.
        "500":
          $ref: "#/components/responses/Failed"

  /billing/paddle:
    post:
      operationId: receivePaddleEvent
      tags: [Webhooks]
      summary: Paddle's webhook for subscriptions
      description: |
        The only way an account becomes Pro by paying. Called by Paddle, not a browser: no `Origin` check and no
        session; the `Paddle-Signature` header guards it (see the `paddleSignature` scheme). The body is never logged.

        Checks, in order: 404 when billing isn't configured (the endpoint then doesn't exist); 413 when the raw body is
        over 64 KB; 401 when the signature is missing, malformed, wrong, or its timestamp more than 5 s off the
        server's clock; 400 when a correctly signed body isn't JSON or isn't an event envelope.

        Handled event types: `subscription.created`, `subscription.activated`, `subscription.updated`,
        `subscription.canceled`, `subscription.past_due`, `subscription.paused`, `subscription.resumed`,
        `subscription.trialing` and `transaction.completed`. Any other type is answered 200 `Ignored` and nothing is
        written.

        A handled event runs in one transaction: its `event_id` is recorded (a repeat stops there, 200
        `Already recorded`); a `subscription.*` event's `data` is mapped to a subscription row and upserted unless the
        row already holds a newer event (by `occurred_at`), writing `billing.subscription` to the audit log when the
        status changed. `transaction.completed` is recorded and changes nothing. The plan follows from the row:
        `active`, `trialing` and `past_due` are Pro, `paused` and `canceled` Free.
      security: [paddleSignature: []]
      requestBody:
        required: true
        description: |
          At most 64 KB, read raw: the signature covers the bytes exactly as sent. The `Content-Type` isn't checked;
          Paddle sends `application/json`.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaddleEvent"
            example:
              event_id: evt_01placeholder0000000000
              event_type: subscription.activated
              occurred_at: "2026-11-20T09:30:00.000Z"
              data:
                id: sub_01placeholder0000000000
                status: active
                customer_id: ctm_01placeholder0000000000
                custom_data:
                  folio_user: "42"
                items:
                  - price:
                      id: pri_01placeholder0000000000
                      billing_cycle:
                        interval: year
                current_billing_period:
                  ends_at: "2027-11-20T09:30:00.000Z"
                scheduled_change: null
                canceled_at: null
                created_at: "2026-11-20T09:29:58.000Z"
      responses:
        "200":
          description: |
            `Recorded`: a handled event, committed (whether or not the row changed, an older event included).
            `Already recorded`: this `event_id` was handled before. `Ignored`: an event type Folio doesn't handle.
          headers:
            Cache-Control:
              $ref: "#/components/headers/WebhookCacheControl"
          content:
            text/plain:
              schema:
                type: string
                enum: [Recorded, Already recorded, Ignored]
        "400":
          description: |
            A correctly signed body that isn't JSON (`Not JSON`), isn't an event envelope (`Not an event`), or is a
            `subscription.*` event whose `data` isn't a subscription Folio can read (`Not a subscription`: no `sub_` id,
            `pri_` price, month or year cycle, or string status).
          headers:
            Cache-Control:
              $ref: "#/components/headers/WebhookCacheControl"
          content:
            text/plain:
              schema:
                type: string
                enum: [Not JSON, Not an event, Not a subscription]
        "401":
          description: |
            The `Paddle-Signature` header is missing, malformed, doesn't match, or is more than 5 s old or ahead.
          headers:
            Cache-Control:
              $ref: "#/components/headers/WebhookCacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: Bad signature
        "404":
          description: Billing isn't configured on this server (no `PADDLE_` settings).
          headers:
            Cache-Control:
              $ref: "#/components/headers/WebhookCacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: Not found
        "413":
          description: The raw body is over 64 KB.
          headers:
            Cache-Control:
              $ref: "#/components/headers/WebhookCacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: Too large
        "500":
          description: |
            `Unknown status`: a subscription status the table doesn't take yet (logged with the status). `Failed`: a
            database failure. Either way Paddle retries.
          headers:
            Cache-Control:
              $ref: "#/components/headers/WebhookCacheControl"
          content:
            text/plain:
              schema:
                type: string
                enum: [Unknown status, Failed]

  /mail/events:
    post:
      operationId: receiveMailEvent
      tags: [Webhooks]
      summary: Resend's webhook for bounces, spam complaints and suppressed sends
      description: |
        Called by Resend, not a browser: no `Origin` check and no session; the Svix signature guards it (see the
        `resendSvixSignature` scheme). The body is never logged.

        Checks, in order: 404 when mail is off (no mail transport or no database) or no signing secret is configured;
        413 when the raw body is over 16 KB; 401 when the signature fails or its timestamp is more than 5 minutes off
        the server's clock; 400 when a correctly signed body isn't JSON.

        Handled events, each marking every address in `data.to` (at most the first 50, `Name <address>` accepted,
        compared case-insensitively) as bounced, idempotently: `email.bounced` whose `data.bounce.type` is
        `Permanent` (a bounce), `email.complained` (a complaint) and `email.suppressed`. Marking sets the accounts'
        `email_bounced_at`, kills their unused confirmation links and pending sign-up links to the address, and audits
        `email.bounced` per account. Anything else (other bounce types, delivery events, unknown types or shapes, no
        usable address) is answered 200 `Ignored`.
      security: [resendSvixSignature: []]
      parameters:
        - name: svix-id
          in: header
          required: true
          description: The message id, at most 100 characters; part of the signed content.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: svix-timestamp
          in: header
          required: true
          description: Unix seconds, within 5 minutes of the server's clock either way; part of the signed content.
          schema:
            type: string
            pattern: '^\d{1,12}$'
      requestBody:
        required: true
        description: |
          At most 16 KB, read raw: the signature covers the bytes exactly as sent. The `Content-Type` isn't checked;
          Resend sends `application/json`.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendMailEvent"
            example:
              type: email.bounced
              created_at: "2026-11-20T09:30:00.000Z"
              data:
                email_id: 00000000-0000-4000-8000-000000000000
                to: [reader@example.com]
                bounce:
                  type: Permanent
      responses:
        "200":
          description: "`Marked`: the addresses are marked. `Ignored`: an event Folio doesn't act on."
          headers:
            Cache-Control:
              $ref: "#/components/headers/WebhookCacheControl"
          content:
            text/plain:
              schema:
                type: string
                enum: [Marked, Ignored]
        "400":
          description: A correctly signed body that isn't JSON.
          headers:
            Cache-Control:
              $ref: "#/components/headers/WebhookCacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: Not JSON
        "401":
          description: |
            The Svix headers are missing or malformed, no `v1` signature matches, or the timestamp is more than 5
            minutes old or ahead.
          headers:
            Cache-Control:
              $ref: "#/components/headers/WebhookCacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: Bad signature
        "404":
          description: Mail is off on this server, or no Resend webhook secret is configured.
          headers:
            Cache-Control:
              $ref: "#/components/headers/WebhookCacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: Not found
        "413":
          description: The raw body is over 16 KB.
          headers:
            Cache-Control:
              $ref: "#/components/headers/WebhookCacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: Too large
        "500":
          description: A database failure; Resend tries the delivery again later.
          headers:
            Cache-Control:
              $ref: "#/components/headers/WebhookCacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: Failed

  /account/users/new:
    post:
      operationId: createUserAsAdmin
      tags: [Users]
      summary: Add an account, and see its generated password once
      description: |
        The Users page's Add. Folio generates the password (24 characters from
        `ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789`, about 140 bits); it is in this answer and
        nowhere else (not a log, an audit detail or a URL). Writes the `user.created` audit event with
        `via: 'users page'` and `by`, the admin.

        Checks, in order: a foreign `Origin` (or, without one, no `Sec-Fetch-Site: same-origin`) is 403; no session
        cookie is 401 (an `Authorization` header is ignored, so a bearer token alone is signed out); a member is 404
        `not_found`, so a member learns nothing about the page; then the body (1 KB; 415, 413 or 400 `invalid`) and its
        fields (400 `invalid`); then 409 `taken`.
      security: [sessionCookie: []]
      x-admin-only: true
      requestBody:
        required: true
        description: At most 1 KB. No fields but these.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminNewUserBody"
            example:
              username: reader
              role: member
      responses:
        "200":
          description: The new account's row, and its password.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserAnswer"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/CookieSignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
          description: |
            The caller is a member, not an admin (so a member learns nothing about the page), or what the path names
            doesn't exist or is malformed.
        "409":
          description: An account already has this username.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: taken
        "413":
          $ref: "#/components/responses/TooLarge"
          description: The body is over 1 KB.
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /account/users/{username}:
    post:
      operationId: changeUserAsAdmin
      tags: [Users]
      summary: Change or delete an account, by intent
      description: |
        One change per request, chosen by `intent`:

        - `reset-password`: a new generated password (in the answer once, as for Add). The account's passkeys go in
          the same transaction, every session and access token ends, and its sign-in failures are cleared.
        - `disable`: ends every session and access token. 409 `last_admin` for the only enabled admin. Disabling a
          disabled account keeps its first time.
        - `enable`: never refused.
        - `unlock`: clears the username's sign-in failures, which ends the lock.
        - `sign-out`: ends every session and access token.
        - `role` (with `role`): holds from the account's next request. 409 `last_admin` when it would demote the only
          enabled admin. Setting the role it already has is a 200 with nothing audited.
        - `grant-pro` / `revoke-pro`: give or take back Pro; 409 `admin` on an admin, who is always Pro. Granting
          again, or revoking a grant that isn't there, is a 200 that changes nothing.
        - `delete`: the account and everything that is theirs. A subscription that could still bill them is
          cancelled at Paddle first, at once; when Paddle can't be reached the account isn't deleted (502
          `billing`). 409 `last_admin` for the only enabled admin.

        Checks, in order: 403 foreign origin; 401 without a session cookie (a bearer token is ignored); 404 for a
        member; 404 for a malformed username, before any query; the body (1 KB; 415, 413 or 400 `invalid`) and its
        fields (400 `invalid`); 404 for an unknown username; 409 `self` for the admin's own account, which is changed
        on `/account` instead; then the change's own refusals. Each success writes its audit event with
        `via: 'users page'` and `by`.
      security: [sessionCookie: []]
      x-admin-only: true
      x-outside-services: [Paddle]
      parameters:
        - $ref: "#/components/parameters/AdminUsername"
      requestBody:
        required: true
        description: "At most 1 KB. `role` only with `intent: role`; no other fields."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserChangeBody"
            examples:
              resetPassword:
                value:
                  intent: reset-password
              role:
                value:
                  intent: role
                  role: admin
              delete:
                value:
                  intent: delete
      responses:
        "200":
          description: |
            The account's row after the change (`{ user }`, with `password` after `reset-password`), or, after
            `delete`, `{ deleted: <username> }`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AdminUserAnswer"
                  - type: object
                    additionalProperties: false
                    required: [deleted]
                    properties:
                      deleted:
                        type: string
                        description: The deleted account's username.
              examples:
                changed:
                  value:
                    user:
                      username: reader
                      role: member
                      status: disabled
                      lockedUntil: null
                      createdAt: "2026-11-20T09:30:00.000Z"
                      lastActiveAt: null
                      sessions: 0
                      hasKey: false
                      email: none
                      plan: free
                      planSource: free
                      paid: null
                      you: false
                deleted:
                  value:
                    deleted: reader
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/CookieSignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
          description: |
            The caller is a member; the username is malformed or unknown; or the account went away during the change.
        "409":
          description: |
            `self`: the admin's own account. `last_admin`: the change would leave no enabled admin (disable, role,
            delete). `admin`: `grant-pro` or `revoke-pro` on an admin.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                self:
                  value:
                    error: self
                lastAdmin:
                  value:
                    error: last_admin
                admin:
                  value:
                    error: admin
        "413":
          $ref: "#/components/responses/TooLarge"
          description: The body is over 1 KB.
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"
        "502":
          description: A `delete` refused because Paddle couldn't cancel the account's subscription. Nothing changed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: billing

  /account/users/invites/new:
    post:
      operationId: createInvite
      tags: [Invites]
      summary: Make an invite link, shown once
      description: |
        An invite makes one member account, within 7 days, at the link's `/signup?token=...`. The link is in this
        answer and nowhere else (not a log, an audit detail or the list). Writes `invite.created`; the note's text
        isn't audited.

        Checks, in order: 403 foreign origin; 401 without a session cookie (a bearer token is ignored); 404 for a
        member; the body (1 KB; 415, 413 or 400 `invalid`) and its fields (400 `invalid`); 409 `closed` while sign-up
        is off (`SIGNUP=off`); 409 `quota` at 20 pending invites, site-wide.
      security: [sessionCookie: []]
      x-admin-only: true
      x-quota: ["20 pending invites, site-wide (409 quota)"]
      requestBody:
        required: true
        description: At most 1 KB. `{}` makes an invite without a note.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInviteCreateBody"
            example:
              note: For a reader
      responses:
        "200":
          description: The invite and its link.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInviteCreated"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/CookieSignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
          description: |
            The caller is a member, not an admin (so a member learns nothing about the page), or what the path names
            doesn't exist or is malformed.
        "409":
          description: "`closed`: sign-up is off. `quota`: 20 invites are already pending."
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/AdminInviteQuotaError"
              examples:
                closed:
                  value:
                    error: closed
                quota:
                  value:
                    error: quota
                    max: 20
        "413":
          $ref: "#/components/responses/TooLarge"
          description: The body is over 1 KB.
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /account/users/invites/{id}:
    post:
      operationId: revokeInvite
      tags: [Invites]
      summary: Revoke a pending invite
      description: |
        Works whatever the sign-up mode. Writes `invite.revoked`.

        Checks, in order: 403 foreign origin; 401 without a session cookie (a bearer token is ignored); 404 for a
        member; 404 for an id that isn't a UUID, before any query; the body (1 KB; 415, 413 or 400 `invalid`) and its
        fields (400 `invalid`); 404 for an id that isn't a pending invite (unknown, a sign-up link's id, or already
        used, expired, revoked, bounced or refused 10 times).
      security: [sessionCookie: []]
      x-admin-only: true
      parameters:
        - $ref: "#/components/parameters/AdminInviteId"
      requestBody:
        required: true
        description: At most 1 KB.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [intent]
              properties:
                intent:
                  type: string
                  const: revoke
      responses:
        "200":
          description: Revoked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revoked]
                properties:
                  revoked:
                    $ref: "#/components/schemas/Uuid"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/CookieSignedOut"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The caller is a member, the id isn't a UUID, or it isn't a pending invite.
        "413":
          $ref: "#/components/responses/TooLarge"
          description: The body is over 1 KB.
        "415":
          $ref: "#/components/responses/NotJson"
        "500":
          $ref: "#/components/responses/Failed"

  /covers/{file}:
    get:
      operationId: serveCatalogueCover
      tags: [Public files]
      summary: A catalogue book's cover
      description: |
        Three forms of `file`:

        - `<slug>.svg`: the generated cover, `image/svg+xml; charset=utf-8`, `public, max-age=86400`.
        - `<slug>-<8 hex>.<jpg|png|webp>`: the book's own cover file, `public, max-age=31536000, immutable`. The hash
          is the first 8 hex digits of the file's SHA-256, so a new cover is a new address; an address with an old
          hash answers 302 to the current one.
        - `<slug>`: 302 to whichever of the two the book has (for pages with no loader).

        Only catalogue books: a private book's `u-<uuid>` is never one (its cover is
        `/account/books/<id>/cover`, for its owner). No ETag or Last-Modified, so no 304. A request carrying a session
        cookie gets `Cache-Control: private, no-store` on every answer instead (src/start.ts).
      security: []
      parameters:
        - name: file
          in: path
          required: true
          description: |
            `<slug>.svg` or `<slug>` with the slug matching `^[a-z0-9-]+$`, or `<slug>-<8 hex>.<jpg|png|webp>`.
            Anything else, or a slug that isn't in the catalogue, is 404.
          schema:
            type: string
            anyOf:
              - pattern: '^[a-z0-9-]+\.svg$'
              - pattern: "^[a-z0-9-]+$"
              - pattern: '^[a-z0-9-]+-[0-9a-f]{8}\.(jpg|png|webp)$'
          examples:
            generated:
              value: pride-and-prejudice.svg
            current:
              value: pride-and-prejudice
      responses:
        "200":
          description: The cover.
          headers:
            Cache-Control:
              description: |
                `public, max-age=86400` for the SVG; `public, max-age=31536000, immutable` for a cover file.
              schema:
                type: string
                enum: ["public, max-age=86400", "public, max-age=31536000, immutable", "private, no-store"]
            Content-Length:
              description: The cover file's size; on a cover file only.
              schema:
                type: integer
            X-Content-Type-Options:
              description: On a cover file only.
              schema:
                type: string
                const: nosniff
          content:
            image/svg+xml:
              schema:
                type: string
            image/jpeg:
              schema:
                type: string
                contentEncoding: binary
            image/png:
              schema:
                type: string
                contentEncoding: binary
            image/webp:
              schema:
                type: string
                contentEncoding: binary
        "302":
          description: |
            `<slug>`: to `/covers/<slug>-<hash>.<ext>` when the book has its own cover, else `/covers/<slug>.svg`. A
            cover file's address with an old hash or extension: to the current one.
          headers:
            Location:
              schema:
                type: string
                examples: [/covers/pride-and-prejudice.svg]
            Cache-Control:
              schema:
                type: string
                enum: ["public, max-age=3600", "private, no-store"]
        "404":
          $ref: "#/components/responses/PublicNotFound"
          description: |
            A malformed name, a slug that isn't in the catalogue, a cover file asked of a book that has none, or a file
            that can't be read. No Cache-Control.

  /images/{slug}/{file}:
    get:
      operationId: serveCatalogueImage
      tags: [Public files]
      summary: A picture in a catalogue book
      description: |
        The files the content importer wrote to `content/images/<slug>/`, each named by the first 12 hex digits of
        its SHA-256, so an address never changes what it serves: `public, max-age=31536000, immutable`. The type comes
        from the extension. No ETag or Last-Modified, so no 304. A request carrying a session cookie gets
        `Cache-Control: private, no-store` instead (src/start.ts). A private book's pictures are
        `/account/books/<id>/images/<n>`, for its owner.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: A catalogue book's slug; a malformed one, `u-<uuid>`, or one not in the catalogue is 404.
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
            examples: [pride-and-prejudice]
        - name: file
          in: path
          required: true
          description: 12 lowercase hex digits and an extension; anything else is 404.
          schema:
            type: string
            pattern: '^[0-9a-f]{12}\.(jpg|png|webp|gif)$'
            examples: [0123456789ab.jpg]
      responses:
        "200":
          description: The picture.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ["public, max-age=31536000, immutable", "private, no-store"]
            Content-Length:
              schema:
                type: integer
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                contentEncoding: binary
            image/png:
              schema:
                type: string
                contentEncoding: binary
            image/webp:
              schema:
                type: string
                contentEncoding: binary
            image/gif:
              schema:
                type: string
                contentEncoding: binary
        "404":
          description: A malformed slug or file name, a book not in the catalogue, or no such file in it.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store, "private, no-store"]
          content:
            text/plain:
              schema:
                type: string
                const: Not found

  /offline/{file}:
    get:
      operationId: downloadOfflineBook
      tags: [Public files]
      summary: A book's download, for reading offline
      description: |
        Everything the reader needs to open any page of the book and read it aloud without a connection; the browser
        keeps it in Cache Storage under this address.

        - A catalogue book is anyone's: `application/json`, `Cache-Control: no-cache` (so a new deploy's copy is seen
          at once), or `private, no-store` when the request carries a session cookie (src/start.ts). Works without a
          database.
        - A private book (`u-<uuid>`) needs its owner's session cookie (a bearer token is ignored) and a ready book:
          `private, no-store`. Anyone else, signed in or not, gets the same 404 as for a book that doesn't exist.

        Checks, in order: a name not ending `.json` is 404; `Sec-Fetch-Site: cross-site` is 403 (another site can't
        have a signed-in reader's browser fetch their book); then the book. No ETag, Last-Modified or 304.
      security: [{}, sessionCookie: []]
      parameters:
        - name: file
          in: path
          required: true
          description: |
            `<slug>.json`, the slug a catalogue slug (`^[a-z0-9]+(?:-[a-z0-9]+)*$`, at most 200 characters, not `nav`,
            not starting `u-`) or a private book's `u-<uuid>`. Anything else, or an unknown book, is 404.
          schema:
            type: string
            pattern: '^.+\.json$'
            examples: [pride-and-prejudice.json]
      responses:
        "200":
          description: The download.
          headers:
            Cache-Control:
              description: |
                `no-cache` for a catalogue book to a visitor without a session cookie; else `private, no-store`.
              schema:
                type: string
                enum: [no-cache, "private, no-store"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineBook"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
          description: "The request has `Sec-Fetch-Site: cross-site`."
        "404":
          description: |
            Not `<slug>.json`, an unknown or malformed slug, or a private book that isn't the signed-in visitor's,
            isn't ready, or is asked for while signed out.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: Not found
        "500":
          $ref: "#/components/responses/Failed"
          description: Building the download failed; it is logged.

  /og/{path}:
    get:
      operationId: renderOpenGraphImage
      tags: [Public files]
      summary: An Open Graph card, as a 1200 x 630 PNG
      description: |
        The link-preview images the pages point at, rendered on each request from the catalogue:

        - `library.png` (and `works.png`, its name from before the library moved off `/works`): "Library", with the
          number of books and series.
        - `series/<slug>.png`: the series' title and its number of volumes.
        - `book/<slug>.png`: the book's title, author and series, with its cover.

        `path` may contain `/`. `Cache-Control: public, max-age=86400`, or `private, no-store` when the request
        carries a session cookie (src/start.ts). No ETag, Last-Modified or 304.
      security: []
      parameters:
        - name: path
          in: path
          required: true
          description: |
            Catch-all; may contain `/`. `library.png`, `works.png`, `series/<slug>.png` or `book/<slug>.png`, the slug
            matching `^[a-z0-9-]+$`. Anything else, or a series or book not in the catalogue, is 404.
          schema:
            type: string
            anyOf:
              - enum: [library.png, works.png]
              - pattern: '^(series|book)/[a-z0-9-]+\.png$'
            examples: [book/pride-and-prejudice.png]
      responses:
        "200":
          description: The card.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ["public, max-age=86400", "private, no-store"]
          content:
            image/png:
              schema:
                type: string
                contentEncoding: binary
        "404":
          $ref: "#/components/responses/PublicNotFound"
          description: An unknown card, series or book. No Cache-Control.

  /works/{path}:
    get:
      operationId: redirectLegacyWorksPath
      tags: [Public files]
      summary: An old /works link, sent on to the same page under /library
      description: |
        The library used to live at `/works`; bookmarks and shared links still point there. Every GET answers 301 to
        `/library` followed by the rest of the path, with the query string kept: `/works/jane-austen?x=1` goes to
        `/library/jane-austen?x=1`. Nothing is looked up: a page that no longer exists is a 404 at the new address.
        `path` may contain `/`. No Cache-Control from the handler (`private, no-store` when the request carries a
        session cookie, src/start.ts).
      security: []
      parameters:
        - name: path
          in: path
          required: true
          description: Catch-all; may contain `/`. Any value, kept as it is.
          schema:
            type: string
            examples: [jane-austen/pride-and-prejudice]
      responses:
        "301":
          description: The same page under /library.
          headers:
            Location:
              schema:
                type: string
                examples: [/library/jane-austen/pride-and-prejudice]
            Cache-Control:
              description: Only when the request carries a session cookie.
              schema:
                type: string
                const: private, no-store

  /manifest.webmanifest:
    get:
      operationId: getWebManifest
      tags: [Public files]
      summary: The web app manifest that makes Folio installable
      description: |
        The same document on every request. `Cache-Control: public, max-age=3600`, or `private, no-store` when the
        request carries a session cookie (src/start.ts). No ETag, Last-Modified or 304.
      security: []
      responses:
        "200":
          description: The manifest.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ["public, max-age=3600", "private, no-store"]
          content:
            application/manifest+json:
              schema:
                $ref: "#/components/schemas/WebManifest"

  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Whether the database answers
      description: |
        200 `ok` when the database answers `select 1` (5 s statement timeout), else 503 `unavailable`, also when no
        database is configured. The body never carries details; the error is logged. The deploy script requires a
        200 here before it keeps a release. `Cache-Control: no-store`, or `private, no-store` when the request carries
        a session cookie (src/start.ts).
      security: []
      responses:
        "200":
          description: The database answers.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: ok
        "503":
          description: The database doesn't answer, or isn't configured.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
          content:
            text/plain:
              schema:
                type: string
                const: unavailable

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: folio_at_ followed by 43 base64url characters
      description: |
        `Authorization: Bearer <token>`, from `POST /api/tokens`. Only in that header, never a query string, form
        field or cookie. When the header is present it alone decides: a bad or ended token is signed out, and the
        session cookie is no fallback.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: |
        The session cookie `POST /login` sets (`session` when served over plain HTTP, as in local tests). Endpoints
        that take only this cookie say so with `security: [sessionCookie: []]`; a POST with it must also come from
        Folio's own origin (`Origin`, or `Sec-Fetch-Site: same-origin`).
    paddleSignature:
      type: apiKey
      in: header
      name: Paddle-Signature
      description: |
        Paddle's webhook signature, checked with node:crypto as Paddle's SDK does (`src/server/billing/signature.ts`).

        - Header: `Paddle-Signature: ts=<unix seconds>;h1=<hex>`, `;`-separated `key=value` parts, at most 1,000
          characters. `ts` is 1 to 12 digits; there is at least one `h1`, and there may be several while a secret is
          being rotated. Other keys are ignored; a part without `=` is malformed.
        - Signed content: `${ts}:${raw body}`, the body's bytes exactly as received, before parsing.
        - Algorithm: HMAC-SHA256 keyed with the notification destination's secret as it is (UTF-8, not decoded),
          as lowercase hex. The request passes when any `h1` matches, compared in constant time.
        - Tolerance: `ts` within 5 seconds of the server's clock, either way (Paddle's SDK window), against replays.
        - Secret: the `paddle_webhook_secret` systemd credential, else the `PADDLE_WEBHOOK_SECRET` environment variable
          (16 to 200 characters, no whitespace).

        Anything that fails is 401 `Bad signature`, logged with the time difference for a stale one, never the body.
    resendSvixSignature:
      type: apiKey
      in: header
      name: svix-signature
      description: |
        Resend's webhook signature, in Svix's scheme, checked with node:crypto instead of the svix package
        (`src/server/mail/signature.ts`).

        - Headers: `svix-id` (1 to 100 characters), `svix-timestamp` (unix seconds, 1 to 12 digits) and
          `svix-signature`, a space-separated list of `<version>,<base64 signature>`.
        - Signed content: `${svix-id}.${svix-timestamp}.${raw body}`, the body's bytes exactly as received.
        - Algorithm: HMAC-SHA256 keyed with the secret's bytes after `whsec_`, base64-decoded; the result is base64.
          The request passes when any `v1` entry matches, compared in constant time; other versions are ignored.
        - Tolerance: the timestamp within 5 minutes of the server's clock, either way (Folio's choice; Svix names none).
        - Secret: the `resend_webhook_secret` systemd credential, else the `RESEND_WEBHOOK_SECRET` environment
          variable (`whsec_` and base64 for at least 16 bytes). Without one the endpoint answers 404.

        Anything that fails is 401 `Bad signature`.

  parameters:
    ShelfId:
      name: shelfId
      in: path
      required: true
      description: A shelf's `id`. Anything that isn't a UUID is 404.
      schema:
        $ref: "#/components/schemas/Uuid"
    BooksBookId:
      name: id
      in: path
      required: true
      description: |
        A private book's (or imported audiobook's) id. Anything that isn't a lowercase UUID is 404 before any query; so
        is another account's book.
      schema:
        $ref: "#/components/schemas/Uuid"
    BooksImageNumber:
      name: n
      in: path
      required: true
      description: |
        A picture's number in its book, 1 to 500: digits only, no leading zero. Anything else is 404 before any query.
      schema:
        type: integer
        minimum: 1
        maximum: 500
    AudiobookFileNumber:
      name: n
      in: path
      required: true
      description: |
        A file's number in its audiobook, 1 to 500 (an M4B is file 1): digits only, no leading zero. Anything else,
        or a number past the audiobook's files, is 404.
      schema:
        type: integer
        minimum: 1
        maximum: 500
    BookmarkIdParam:
      name: id
      in: path
      required: true
      description: A bookmark's `id`. Anything that isn't a lowercase UUID is 404 before any query.
      schema:
        $ref: "#/components/schemas/Uuid"
    AudioBookmarkIdParam:
      name: id
      in: path
      required: true
      description: An audio bookmark's `id`. Anything that isn't a lowercase UUID is 404 before any query.
      schema:
        $ref: "#/components/schemas/Uuid"
    HighlightIdParam:
      name: id
      in: path
      required: true
      description: |
        A highlight's `id`. Anything that isn't a lowercase UUID is 404 before any query. (`new` and `export` are
        other routes.)
      schema:
        $ref: "#/components/schemas/Uuid"
    FlashcardIdParam:
      name: id
      in: path
      required: true
      description: A flashcard's `id`. Anything that isn't a lowercase UUID is 404 before any query.
      schema:
        $ref: "#/components/schemas/Uuid"
    HighlightExportBookParam:
      name: book
      in: path
      required: true
      description: The book's slug. One that isn't a slug is a plain-text 404 before the session is looked at.
      schema:
        $ref: "#/components/schemas/BookSlug"
    AdminUsername:
      name: username
      in: path
      required: true
      description: |
        The account's username, exactly as stored (lowercase). One that doesn't match the pattern is 404 before any
        query; an unknown one is 404 after. `new` is the add route, so an account named `new` can't be changed here.
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9_-]{2,31}$"
        examples: [reader]
    AdminInviteId:
      name: id
      in: path
      required: true
      description: A pending invite's `id`. Anything that isn't a UUID is 404 before any query.
      schema:
        $ref: "#/components/schemas/Uuid"

  headers:
    CacheControl:
      description: Every answer is about one account, so it is never cached.
      schema:
        type: string
        const: private, no-store
    WwwAuthenticate:
      description: |
        `Bearer` when no credentials were sent; `Bearer error="invalid_token"` when a token was sent but is malformed,
        unknown, expired, idle or its account disabled.
      schema:
        type: string
        enum: [Bearer, Bearer error="invalid_token"]
    SessionSetCookie:
      description: |
        The new session cookie: `__Host-session=<token>; Path=/; Max-Age=<seconds>; HttpOnly; SameSite=Lax; Secure`,
        or `session=<token>; Path=/; Max-Age=<seconds>; HttpOnly; SameSite=Lax` when the server runs with
        `COOKIE_SECURE=false` (local HTTP and tests). The token is 32 random bytes in base64url (43 characters); only
        its SHA-256 is stored. `Max-Age` is the session's 30 days (2,592,000 seconds, a second or so less). Sent only
        when the request signs in.
      schema:
        type: string
        anyOf:
          - pattern: "^__Host-session=[A-Za-z0-9_-]{43}; Path=/; Max-Age=[0-9]+; HttpOnly; SameSite=Lax; Secure$"
          - pattern: "^session=[A-Za-z0-9_-]{43}; Path=/; Max-Age=[0-9]+; HttpOnly; SameSite=Lax$"
        examples:
          - >-
            __Host-session=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA; Path=/; Max-Age=2591999; HttpOnly;
            SameSite=Lax; Secure
    SessionClearCookie:
      description: Clears the session cookie (`session=` without `Secure` when `COOKIE_SECURE=false`).
      schema:
        type: string
        enum:
          - "__Host-session=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax; Secure"
          - "session=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax"
    SigninReferrerPolicy:
      description: |
        Added by the request middleware (`src/start.ts`, `src/server/private-pages.ts`) to every answer on the paths a
        mailed link opens, so a Referer from them is the bare origin, never the token. Not `no-referrer`, which would
        make the page's own form post send `Origin: null` and fail the same-origin check.
      schema:
        type: string
        const: strict-origin
    AccountClearedSessionCookie:
      description: |
        Only on a successful `delete-account` (`/login?status=account-deleted`): clears the session cookie.
        `__Host-session` with `Secure` over HTTPS, `session` without it over plain HTTP.
      schema:
        type: string
        pattern: "^(__Host-session|session)=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax(; Secure)?$"
        examples: ["__Host-session=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax; Secure"]
    BooksNoSniff:
      description: The stored type is the only type; the browser must not sniff another.
      schema:
        type: string
        const: nosniff
    BooksSandboxCsp:
      description: A stored image can never run as a page.
      schema:
        type: string
        const: "default-src 'none'; sandbox"
    BooksSameOriginResource:
      description: Only Folio's own pages may embed it.
      schema:
        type: string
        const: same-origin
    BooksFileLength:
      description: The stored image's size in bytes.
      schema:
        type: integer
        minimum: 1
    AudiobookContentType:
      description: The type stored at the import, never one sniffed from the bytes.
      schema:
        type: string
        enum: [audio/mp4, audio/mpeg]
    AudiobookContentLength:
      description: The bytes in this answer's body (the whole file, or the range).
      schema:
        type: integer
        minimum: 0
    AudiobookAcceptRanges:
      description: The file can be asked for in byte ranges.
      schema:
        type: string
        const: bytes
    AudiobookContentRange:
      description: "`bytes <start>-<end>/<size>`, exact, which Safari wants before it will play."
      schema:
        type: string
        pattern: '^bytes \d+-\d+/\d+$'
    WebhookCacheControl:
      description: A webhook's answer is never cached.
      schema:
        type: string
        const: no-store
    HealthCacheControl:
      description: "`no-store`; `private, no-store` when the request carries a session cookie."
      schema:
        type: string
        enum: [no-store, "private, no-store"]

  responses:
    RepoGitHubUnavailable:
      description: GitHub couldn't be reached, or answered something Folio doesn't read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unavailable
    RepoGitHubBusy:
      description: Too many requests to GitHub in flight, or GitHub's hourly limit is used up; `retryAt` is its reset.
      content:
        application/json:
          schema:
            type: object
            required: [error, retryAt]
            properties:
              error:
                type: string
                enum: [busy]
              retryAt:
                type: [string, "null"]
                format: date-time
          example:
            error: busy
            retryAt: "2026-11-21T14:05:00.000Z"
    SignedOut:
      description: No valid token or session cookie.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: signed_out
    ForeignOrigin:
      description: |
        An `Origin` header from another site. A cookie request (no `Authorization` header) that changes something
        must also come from Folio's own origin.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        text/plain:
          schema:
            type: string
            const: Forbidden
    Invalid:
      description: The body isn't valid JSON, or doesn't match the schema.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid
    TooLarge:
      description: The body is over the operation's size cap.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid
    NotJson:
      description: The `Content-Type` isn't `application/json`.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid
    NotFound:
      description: Not found, malformed, or another account's.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
    ShelfConflict:
      description: |
        `duplicate`: another of the account's shelves has this name (case and accents ignored). `quota`: the account
        has 50 shelves, or 2,000 books on shelves.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ShelfQuotaError"
          examples:
            duplicate:
              value:
                error: duplicate
            quota:
              value:
                error: quota
                scope: shelves
                max: 50
    Failed:
      description: Something went wrong on the server; it is logged.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: failed
    CookieSignedOut:
      description: |
        No valid session cookie. These endpoints read the cookie only: an `Authorization: Bearer` token is ignored,
        and no `WWW-Authenticate` header is sent.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: signed_out
    ProRequiredText:
      description: The account is on Free and this file is a Pro feature. The body is the Pro notice's heading.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        text/plain; charset=utf-8:
          schema:
            type: string
          example: Markdown export is part of Pro.
    RateLimited:
      description: The account is over this operation's hourly limit; `retryAt` says when the next one is allowed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateError"
    Unavailable:
      description: A service the operation needs isn't available (no database configured, or an outside service down).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unavailable
    PasskeyQuota:
      description: The account already has 10 passkeys.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PasskeyQuotaError"
    BooksImportSignedOut:
      description: No valid session cookie (or the server has no database). The import's code is hyphenated.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: signed-out
    BooksImportNotFound:
      description: |
        No session, a malformed id or number, another account's book, or a book that isn't uploading (finished,
        deleted, or swept after 24 hours): all the same 404. The import's code is hyphenated.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not-found
    BooksImportTooLarge:
      description: The body is over the operation's size cap; the rest of it isn't read.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: request-too-large
    BooksDetailsFailed:
      description: Something went wrong on the server; it is logged. The code is `unavailable`, not `failed`.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unavailable
    BooksOpenLibraryUnavailable:
      description: Open Library couldn't be reached, timed out, answered an error, or sent too much or malformed JSON.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unavailable
    BooksOpenLibraryBusy:
      description: |
        Open Library is busy: this request would wait more than 5 seconds for the server's turn, or Open Library
        answered 429 or 503. No `Retry-After`.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: busy
    BooksPrivateFileNotFound:
      description: |
        Not found, malformed, not the account's, not ready, or signed out. Plain text, with the image headers.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/BooksNoSniff"
        Content-Security-Policy:
          $ref: "#/components/headers/BooksSandboxCsp"
        Cross-Origin-Resource-Policy:
          $ref: "#/components/headers/BooksSameOriginResource"
      content:
        text/plain:
          schema:
            type: string
            const: Not found
    BooksPrivateFileUnavailable:
      description: The database failed; it is logged. Plain text, with the image headers.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/BooksNoSniff"
        Content-Security-Policy:
          $ref: "#/components/headers/BooksSandboxCsp"
        Cross-Origin-Resource-Policy:
          $ref: "#/components/headers/BooksSameOriginResource"
      content:
        text/plain:
          schema:
            type: string
            const: Unavailable
    AudiobookFileNotFound:
      description: |
        Not the account's ready audiobook, a bad id or number, no session, the file missing on disk (logged once), or
        audiobooks turned off on this server. Plain text.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/BooksNoSniff"
        Cross-Origin-Resource-Policy:
          $ref: "#/components/headers/BooksSameOriginResource"
      content:
        text/plain:
          schema:
            type: string
            const: Not found
    AudiobookFileUnavailable:
      description: The database or the disk failed; it is logged. Plain text.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/BooksNoSniff"
        Cross-Origin-Resource-Policy:
          $ref: "#/components/headers/BooksSameOriginResource"
      content:
        text/plain:
          schema:
            type: string
            const: Unavailable
    BookmarkQuota:
      description: The account is at a bookmark limit; `scope` says which.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BookmarkQuotaError"
          example:
            error: quota
            scope: book
            max: 1000
    ReadingTextNotFound:
      description: Not found, malformed, or another account's. Plain text.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        text/plain; charset=utf-8:
          schema:
            type: string
            const: Not found
    ReadingTextFailed:
      description: Something went wrong on the server; it is logged. Plain text.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        text/plain; charset=utf-8:
          schema:
            type: string
            const: Something went wrong. Try again in a few minutes.
    BillingOff:
      description: Billing isn't configured on this server (no `PADDLE_` settings), so the endpoint doesn't exist.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not_found
    PaddleFailed:
      description: Paddle's API refused, failed or timed out (10 s), or answered something unreadable; it is logged.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: failed
    PublicNotFound:
      description: Not found.
      content:
        text/plain:
          schema:
            type: string
            const: Not found

  schemas:
    RepoAddBody:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2000
          description: A repository's address; more than 500 characters is refused as too_long.
    RepoView:
      type: object
      required: [id, owner, name, description, ref, refKind, defaultBranch, commit, addedAt, checkedAt, goneAt]
      properties:
        id:
          type: string
          format: uuid
        owner:
          type: string
          description: GitHub's own spelling.
        name:
          type: string
        description:
          type: [string, "null"]
          maxLength: 350
        ref:
          type: [string, "null"]
          description: The branch, tag or commit the address named; null follows the default branch.
        refKind:
          type: string
          enum: [default, branch, tag, commit]
        defaultBranch:
          type: string
        commit:
          type: string
          pattern: "^[0-9a-f]{40}$"
          description: The commit Folio shows; forty zeros for an empty repository.
        addedAt:
          type: string
          format: date-time
        checkedAt:
          type: string
          format: date-time
        goneAt:
          type: [string, "null"]
          format: date-time
    Uuid:
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      description: A lowercase UUID.
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 in UTC, with milliseconds.
      examples: ["2026-11-20T09:30:00.000Z"]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            [
              invalid,
              invalid_credentials,
              limited,
              signed_out,
              not_found,
              duplicate,
              unavailable,
              failed,
              admin,
              billing,
              book-too-large,
              busy,
              closed,
              drm,
              empty,
              expired,
              image,
              incomplete,
              key_rejected,
              last_admin,
              limit,
              no_credits,
              no_key,
              not-found,
              offset,
              password,
              permission,
              pro,
              quota,
              rate,
              refused,
              request-too-large,
              self,
              signed-out,
              stale,
              subscribed,
              taken,
              too-long,
              too_little,
              too_long,
              unreadable,
              voice_gone,
            ]
          description: |
            Every code an answer can carry. Most operations answer a few; each response says which. `not-found`,
            `signed-out`, `too-long`, `empty`, `request-too-large` and `book-too-large` are the private book
            import's hyphenated spellings.
    TokenQuotaError:
      type: object
      additionalProperties: false
      required: [error, max]
      properties:
        error:
          type: string
          const: quota
        max:
          type: integer
          const: 10
    ShelfQuotaError:
      type: object
      additionalProperties: false
      required: [error, scope, max]
      properties:
        error:
          type: string
          const: quota
        scope:
          type: string
          enum: [shelves, shelf_books]
          description: "`shelves`: 50 shelves per account. `shelf_books`: 2,000 books on shelves per account."
        max:
          type: integer
          enum: [50, 2000]
    TokenCreateBody:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 1024
          format: password
        name:
          type: string
          minLength: 1
          maxLength: 60
          default: Access token
          description: Trimmed; no control characters.
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 30
          default: 30
    TokenCreated:
      type: object
      additionalProperties: false
      required: [token, tokenType, expiresAt, id, name]
      properties:
        token:
          type: string
          pattern: "^folio_at_[A-Za-z0-9_-]{43}$"
          description: The token itself. Shown only in this answer.
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
    AccessToken:
      type: object
      additionalProperties: false
      required: [id, name, createdAt, lastUsedAt, expiresAt, current]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        lastUsedAt:
          description: Null until its first use; after that, updated at most every 10 minutes.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
        current:
          type: boolean
          description: Whether this is the token the request was made with.
    Me:
      type: object
      additionalProperties: false
      required: [username, role, plan, via]
      properties:
        username:
          type: string
        role:
          type: string
          enum: [admin, member]
        plan:
          type: string
          enum: [free, pro]
        via:
          type: string
          enum: [cookie, token]
          description: Whether the request signed in with the session cookie or an access token.
    ShelfName:
      type: string
      maxLength: 200
      description: |
        Cleaned before it is stored: Unicode NFC, whitespace runs become one space, control characters removed,
        trimmed. What is left must be 1 to 40 characters, or the request is 400 `invalid`. The answer carries the
        cleaned name.
    BookSlug:
      type: string
      maxLength: 200
      description: A catalogue book's slug, or `u-<uuid>` for one of the account's own uploaded books.
      anyOf:
        - pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          not:
            pattern: "^u-"
        - pattern: "^u-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      examples: [pride-and-prejudice]
    Shelf:
      type: object
      additionalProperties: false
      required: [id, name, books]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 40
        books:
          type: array
          description: |
            Book slugs, newest added first. A catalogue book that has left the catalogue is left out.
          items:
            type: string
    ShelfAnswer:
      type: object
      additionalProperties: false
      required: [shelf]
      properties:
        shelf:
          $ref: "#/components/schemas/Shelf"
    ProError:
      type: object
      additionalProperties: false
      required: [error, feature]
      properties:
        error:
          type: string
          const: pro
        feature:
          type: string
          enum: [ask, translate, export, audiobooks, elevenlabs, flashcards]
    RateError:
      type: object
      additionalProperties: false
      required: [error, retryAt]
      properties:
        error:
          type: string
          const: rate
        retryAt:
          $ref: "#/components/schemas/Timestamp"
    SigninLinkToken:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
      description: A mailed or invite link's token (its `?token=`), 32 random bytes in base64url.
    SigninPassword:
      type: string
      maxLength: 1024
      format: password
      description: |
        A new password: 15 to 256 characters after Unicode NFC (counted in characters), and not the username (case
        ignored). Never trimmed. No composition rules.
    LoginForm:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          description: Trimmed, lowercased and cut to 64 characters before it is checked; must then match
            `^[a-z0-9][a-z0-9_-]{2,31}$` to sign in.
        password:
          type: string
          maxLength: 1024
          format: password
          description: Longer than 1,024 characters is refused like a wrong password.
        next:
          type: string
          description: Where to go after signing in (a hidden field). Only a same-site path is followed; see the
            operation.
    SignupRequestForm:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
          description: |
            Trimmed. Printable ASCII only, one `@`, a local part of 1 to 64 characters (no leading, trailing or double
            dots), a domain of at least two dot-separated labels of letters, digits and hyphens. The domain is
            lowercased.
        website:
          type: string
          description: The honeypot, hidden from people. Anything but whitespace makes the request a no-op answered
            `status=sent`.
    SignupFinishForm:
      type: object
      additionalProperties: false
      required: [token, username, password, confirm]
      properties:
        token:
          $ref: "#/components/schemas/SigninLinkToken"
        username:
          type: string
          maxLength: 1024
          description: |
            Trimmed and lowercased, then must match `^[a-z0-9][a-z0-9_-]{2,31}$` and not be a reserved name (`new`,
            `invites`, `admin`, `administrator`, `root`, `owner`, `folio`, `support`, `help`, `system`, `security`,
            `postmaster`, `abuse`, `noreply`, `no-reply`) or an existing account's.
        password:
          $ref: "#/components/schemas/SigninPassword"
        confirm:
          type: string
          maxLength: 1024
          format: password
          description: Must equal `password` exactly.
    ConfirmEmailForm:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          $ref: "#/components/schemas/SigninLinkToken"
    ForgotPasswordForm:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: |
            A username or an account's email address (anything with an `@`), trimmed. Empty or over 254 characters is
            `error=invalid`; anything else, even one that names no account, is `status=sent`.
    ResetPasswordForm:
      type: object
      additionalProperties: false
      required: [token, password, confirm]
      properties:
        token:
          $ref: "#/components/schemas/SigninLinkToken"
        password:
          $ref: "#/components/schemas/SigninPassword"
        confirm:
          type: string
          format: password
          description: Must equal `password` exactly.
    PasskeyQuotaError:
      type: object
      additionalProperties: false
      required: [error, max]
      properties:
        error:
          type: string
          const: quota
        max:
          type: integer
          const: 10
    PasskeyView:
      type: object
      additionalProperties: false
      required: [id, name, createdAt, lastUsedAt, backedUp]
      description: A passkey as the account sees it. Credential ids, public keys, counters and the user handle never
        leave the server.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: From the User-Agent ("Chrome on macOS"), or "Passkey". Names may repeat.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        lastUsedAt:
          description: Null until it first signs in.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        backedUp:
          type: boolean
          description: Whether it is synced between the reader's devices.
    PasskeyTransport:
      type: string
      enum: [usb, nfc, ble, internal, hybrid, smart-card]
    PasskeyCredentialDescriptor:
      type: object
      additionalProperties: false
      required: [id, type, transports]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: A credential id, base64url.
        type:
          type: string
          const: public-key
        transports:
          type: array
          items:
            $ref: "#/components/schemas/PasskeyTransport"
    PasskeyCreationOptions:
      type: object
      additionalProperties: false
      required:
        [
          challenge,
          rp,
          user,
          pubKeyCredParams,
          timeout,
          attestation,
          excludeCredentials,
          authenticatorSelection,
          extensions,
          hints,
        ]
      description: |
        WebAuthn's PublicKeyCredentialCreationOptionsJSON, from `@simplewebauthn/server`'s
        `generateRegistrationOptions`, for `navigator.credentials.create()`.
      properties:
        challenge:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: 32 random bytes, base64url. Works once, for 5 minutes.
        rp:
          type: object
          additionalProperties: false
          required: [name, id]
          properties:
            name:
              type: string
              const: Folio
            id:
              type: string
              description: The RP ID, the server's exact hostname (`dev.agenticlibrary.app`, `agenticlibrary.app`,
                `localhost`).
        user:
          type: object
          additionalProperties: false
          required: [id, name, displayName]
          properties:
            id:
              type: string
              pattern: "^[A-Za-z0-9_-]{43}$"
              description: The account's user handle, 32 random bytes in base64url, made on first use. Never the
                account's id or username.
            name:
              type: string
              description: The username.
            displayName:
              type: string
              description: The username.
        pubKeyCredParams:
          type: array
          description: Ed25519 (-8), ES256 (-7) and RS256 (-257), in that order.
          items:
            type: object
            additionalProperties: false
            required: [alg, type]
            properties:
              alg:
                type: integer
                enum: [-8, -7, -257]
              type:
                type: string
                const: public-key
        timeout:
          type: integer
          const: 300000
        attestation:
          type: string
          const: none
        excludeCredentials:
          type: array
          maxItems: 10
          description: The account's own passkeys, so the browser doesn't make a second one on the same authenticator.
          items:
            $ref: "#/components/schemas/PasskeyCredentialDescriptor"
        authenticatorSelection:
          type: object
          additionalProperties: false
          required: [residentKey, requireResidentKey, userVerification]
          properties:
            residentKey:
              type: string
              const: required
            requireResidentKey:
              type: boolean
              const: true
            userVerification:
              type: string
              const: required
        extensions:
          type: object
          additionalProperties: false
          required: [credProps]
          properties:
            credProps:
              type: boolean
              const: true
        hints:
          type: array
          maxItems: 0
          items:
            type: string
    PasskeyRequestOptions:
      type: object
      additionalProperties: false
      required: [rpId, challenge, timeout, userVerification]
      description: |
        WebAuthn's PublicKeyCredentialRequestOptionsJSON, from `@simplewebauthn/server`'s
        `generateAuthenticationOptions`, for `navigator.credentials.get()`. No `allowCredentials`: any of this site's
        discoverable passkeys may answer, so no username is asked for.
      properties:
        rpId:
          type: string
          description: The server's exact hostname.
        challenge:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: 32 random bytes, base64url. Works once, for 5 minutes.
        timeout:
          type: integer
          const: 300000
        userVerification:
          type: string
          const: required
    PasskeyClientExtensionResults:
      type: object
      additionalProperties: false
      required: []
      description: The browser's client extension outputs. Only these keys are allowed; their contents aren't used.
      properties:
        credProps: {}
        prf: {}
        largeBlob: {}
        hmacCreateSecret: {}
        appid: {}
        appidExclude: {}
    PasskeyRegistrationCredential:
      type: object
      additionalProperties: false
      required: [id, rawId, type, response, clientExtensionResults]
      description: |
        WebAuthn's RegistrationResponseJSON, as `navigator.credentials.create()` returns it (`toJSON()`). Binary
        fields are unpadded base64url; each size limit is in decoded bytes, given here as the longest string.
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          minLength: 2
          maxLength: 1364
          description: The credential id, 1 to 1,023 bytes.
        rawId:
          type: string
          description: Must equal `id`.
        type:
          type: string
          const: public-key
        response:
          type: object
          additionalProperties: false
          required: [clientDataJSON, attestationObject]
          properties:
            clientDataJSON:
              type: string
              pattern: "^[A-Za-z0-9_-]+$"
              minLength: 2
              maxLength: 5462
              description: |
                At most 4 KB. Must decode to JSON whose `challenge` is base64url of at most 64 bytes: the challenge
                from `POST /account/passkeys/options` (else 400 `expired`).
            attestationObject:
              type: string
              pattern: "^[A-Za-z0-9_-]+$"
              minLength: 2
              maxLength: 16384
              description: At most 12 KB.
            authenticatorData:
              type: string
              pattern: "^[A-Za-z0-9_-]+$"
              minLength: 2
              maxLength: 16384
              description: At most 12 KB.
            transports:
              type: array
              maxItems: 8
              items:
                $ref: "#/components/schemas/PasskeyTransport"
            publicKeyAlgorithm:
              type: integer
            publicKey:
              type: string
              pattern: "^[A-Za-z0-9_-]+$"
              minLength: 2
              maxLength: 5462
              description: At most 4 KB.
        authenticatorAttachment:
          type: string
          enum: [platform, cross-platform]
        clientExtensionResults:
          $ref: "#/components/schemas/PasskeyClientExtensionResults"
    PasskeyAuthenticationCredential:
      type: object
      additionalProperties: false
      required: [id, rawId, type, response, clientExtensionResults]
      description: |
        WebAuthn's AuthenticationResponseJSON, as `navigator.credentials.get()` returns it (`toJSON()`). Binary fields
        are unpadded base64url; each size limit is in decoded bytes, given here as the longest string.
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          minLength: 2
          maxLength: 1364
          description: The credential id, 1 to 1,023 bytes.
        rawId:
          type: string
          description: Must equal `id`.
        type:
          type: string
          const: public-key
        response:
          type: object
          additionalProperties: false
          required: [clientDataJSON, authenticatorData, signature]
          properties:
            clientDataJSON:
              type: string
              pattern: "^[A-Za-z0-9_-]+$"
              minLength: 2
              maxLength: 5462
              description: |
                At most 4 KB. Must decode to JSON whose `challenge` is base64url of at most 64 bytes: the challenge
                from `POST /passkeys/challenge` (else 401 `refused`).
            authenticatorData:
              type: string
              pattern: "^[A-Za-z0-9_-]+$"
              minLength: 2
              maxLength: 5462
              description: At most 4 KB.
            signature:
              type: string
              pattern: "^[A-Za-z0-9_-]+$"
              minLength: 2
              maxLength: 1366
              description: At most 1 KB.
            userHandle:
              type: string
              pattern: "^[A-Za-z0-9_-]+$"
              minLength: 2
              maxLength: 86
              description: At most 64 bytes. Must be the account's user handle, or the sign-in is 401 `refused`.
        authenticatorAttachment:
          type: string
          enum: [platform, cross-platform]
        clientExtensionResults:
          $ref: "#/components/schemas/PasskeyClientExtensionResults"
    AccountCurrentPassword:
      type: string
      maxLength: 1024
      format: password
      description: |
        The account's current password. Longer than 1,024 characters is refused as wrong without hashing. Checked as
        a sign-in attempt (it counts towards the username's lock).
    AccountUsernameHint:
      type: string
      description: The page's hidden username field, for password managers. Ignored by the server.
    AccountFormBody:
      description: One of the account page's forms, chosen by `intent`.
      oneOf:
        - title: Change password
          type: object
          additionalProperties: false
          required: [intent, current, password, confirm]
          properties:
            intent:
              type: string
              const: change-password
            username:
              $ref: "#/components/schemas/AccountUsernameHint"
            current:
              $ref: "#/components/schemas/AccountCurrentPassword"
            password:
              type: string
              minLength: 15
              maxLength: 256
              format: password
              description: |
                The new password: 15 to 256 characters (counted after Unicode NFC), not the username (case ignored).
                No composition rules.
            confirm:
              type: string
              format: password
              description: Must equal `password` exactly.
        - title: Sign out everywhere else
          type: object
          additionalProperties: false
          required: [intent]
          properties:
            intent:
              type: string
              const: revoke-others
        - title: Revoke an access token
          type: object
          additionalProperties: false
          required: [intent, token]
          properties:
            intent:
              type: string
              const: token-revoke
            token:
              $ref: "#/components/schemas/Uuid"
        - title: Remove a passkey
          type: object
          additionalProperties: false
          required: [intent, passkey]
          properties:
            intent:
              type: string
              const: passkey-remove
            passkey:
              type: string
              pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
              description: A passkey's id, a UUID; lowercased before it is checked.
        - title: Delete account
          type: object
          additionalProperties: false
          required: [intent, current]
          properties:
            intent:
              type: string
              const: delete-account
            username:
              $ref: "#/components/schemas/AccountUsernameHint"
            current:
              $ref: "#/components/schemas/AccountCurrentPassword"
        - title: Add or change the email address
          type: object
          additionalProperties: false
          required: [intent, email, current]
          properties:
            intent:
              type: string
              const: email-add
            username:
              $ref: "#/components/schemas/AccountUsernameHint"
            email:
              type: string
              minLength: 3
              maxLength: 254
              format: email
              description: |
                Trimmed, then: printable ASCII only, exactly one `@`, a local part of 1–64 characters that doesn't
                start or end with a dot or hold `..`, and a domain of at least two dot-separated labels of letters,
                digits and hyphens (each at most 63, not starting or ending with a hyphen). The domain is lowercased;
                the local part is kept as typed.
            current:
              $ref: "#/components/schemas/AccountCurrentPassword"
        - title: Resend the confirmation link
          type: object
          additionalProperties: false
          required: [intent]
          properties:
            intent:
              type: string
              const: email-resend
        - title: Remove the email address, or cancel the pending one
          type: object
          additionalProperties: false
          required: [intent]
          properties:
            intent:
              type: string
              const: email-remove
            pending:
              type: string
              const: "1"
              description: |
                `1` cancels only the address waiting for confirmation and keeps a confirmed one. Without it (or with any
                other value) the confirmed address and every unused link are removed.
    ApiKeysProvider:
      type: string
      enum: [anthropic, elevenlabs]
      description: "`anthropic` for the agent features, `elevenlabs` for read aloud's voices."
    ApiKeysFormBody:
      description: One of the API keys page's forms, chosen by `intent`.
      oneOf:
        - title: Save or replace the Anthropic key
          type: object
          additionalProperties: false
          required: [intent, provider, key]
          properties:
            intent:
              type: string
              const: save
            provider:
              type: string
              const: anthropic
            key:
              type: string
              format: password
              pattern: '^\s*sk-ant-\S{13,293}\s*$'
              description: |
                Trimmed, then `sk-ant-` and 20–300 characters with no whitespace; anything else is `error=shape` and is
                never sent to Anthropic.
        - title: Save or replace the ElevenLabs key
          type: object
          additionalProperties: false
          required: [intent, provider, key]
          properties:
            intent:
              type: string
              const: save
            provider:
              type: string
              const: elevenlabs
            key:
              type: string
              format: password
              pattern: '^\s*(?!sk-ant-)\S{20,300}\s*$'
              description: |
                Trimmed, then 20–300 characters with no whitespace (`error=shape` otherwise) and not starting with
                `sk-ant-` (`error=anthropic`). Needs Pro (`error=pro` on Free).
        - title: Delete a key
          type: object
          additionalProperties: false
          required: [intent, provider]
          properties:
            intent:
              type: string
              const: delete
            provider:
              $ref: "#/components/schemas/ApiKeysProvider"
        - title: Choose the model for agent features
          type: object
          additionalProperties: false
          required: [intent, model]
          properties:
            intent:
              type: string
              const: model
            model:
              type: string
              enum: [claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5]
              description: "`claude-opus-5-5` is the default. The list is `src/shared/lib/ai-models.ts`."
        - title: Choose the ElevenLabs voice model
          type: object
          additionalProperties: false
          required: [intent, model]
          properties:
            intent:
              type: string
              const: speech-model
            model:
              type: string
              enum: [eleven_v4_turbo, eleven_v4]
              description: "`eleven_v4_turbo` is the default. The list is `src/shared/lib/speech-models.ts`."
    BooksOk:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    BooksDeleteForm:
      type: object
      additionalProperties: false
      required: [intent, id]
      properties:
        intent:
          type: string
          const: delete
        id:
          $ref: "#/components/schemas/Uuid"
      description: The fields to send. The handler ignores any others rather than refusing them.
    BooksDetailsForm:
      oneOf:
        - title: Save details
          type: object
          additionalProperties: false
          required: [intent, title, author]
          properties:
            intent:
              type: string
              const: details
            title:
              type: string
              minLength: 1
              maxLength: 300
              description: |
                Cleaned (NFC, control characters removed, whitespace runs to one space, trimmed); 1 to 300 characters
                after that.
            author:
              type: string
              minLength: 1
              maxLength: 200
              description: Cleaned as the title; 1 to 200 characters after that.
            description:
              type: string
              maxLength: 4000
              description: |
                Plain text (tags removed, entities decoded, paragraphs kept); at most 4,000 characters once cleaned,
                else `error=too-long`. Empty clears it.
            isbn:
              type: string
              description: |
                An ISBN-10 or ISBN-13, with or without hyphens, spaces or an `isbn:` prefix; stored as ISBN-13. Empty
                clears it; anything else is `error=invalid-isbn`.
            publisher:
              type: string
              maxLength: 200
              description: Cleaned as the title; at most 200 characters. Empty clears it.
            year:
              type: string
              pattern: '^\s*(\d{1,4})?\s*$'
              description: A year from 1 to next year, or empty to clear it.
        - title: Use the generated cover
          type: object
          additionalProperties: false
          required: [intent]
          properties:
            intent:
              type: string
              const: remove-cover
          description: The other form fields, if sent, are ignored; an unknown field is still `error=invalid`.
    BooksText:
      type: string
      description: |
        Cleaned before it is checked or stored: NFC, control characters and bidi controls removed, tabs and line
        breaks turned into spaces. Lengths are counted after cleaning; over the limit is 400 `too-long`.
    BooksRun:
      description: A run of text with at most one style, or a line break.
      oneOf:
        - title: Text
          type: object
          additionalProperties: false
          required: [text]
          properties:
            text:
              $ref: "#/components/schemas/BooksText"
              maxLength: 50000
            style:
              type: string
              enum: [em, strong, code, sup, sub]
        - title: Line break
          type: object
          additionalProperties: false
          required: [br]
          properties:
            br:
              type: boolean
              const: true
    BooksRuns:
      type: array
      maxItems: 5000
      description: Over 5,000 runs is 400 `too-long`.
      items:
        $ref: "#/components/schemas/BooksRun"
    BooksListBlock:
      type: object
      additionalProperties: false
      required: [type, ordered, items]
      description: A list; lists nest at most 6 deep, counting the outermost (deeper is 400 `too-long`).
      properties:
        type:
          type: string
          const: list
        ordered:
          type: boolean
        items:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/BooksListItem"
    BooksListItem:
      type: object
      additionalProperties: false
      required: [runs]
      properties:
        runs:
          $ref: "#/components/schemas/BooksRuns"
        lists:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/BooksListBlock"
    BooksTableRows:
      type: array
      maxItems: 2000
      description: Rows of at most 64 cells, each a list of runs.
      items:
        type: array
        maxItems: 64
        items:
          $ref: "#/components/schemas/BooksRuns"
    BooksBlock:
      description: One structured block of a chapter. The server renders the HTML; HTML is never sent.
      oneOf:
        - title: Heading
          type: object
          additionalProperties: false
          required: [type, level, runs]
          properties:
            type:
              type: string
              const: heading
            level:
              type: integer
              enum: [3, 4]
            runs:
              $ref: "#/components/schemas/BooksRuns"
        - title: Paragraph
          type: object
          additionalProperties: false
          required: [type, runs]
          properties:
            type:
              type: string
              const: paragraph
            runs:
              $ref: "#/components/schemas/BooksRuns"
        - title: Block quote
          type: object
          additionalProperties: false
          required: [type, paragraphs]
          properties:
            type:
              type: string
              const: blockquote
            paragraphs:
              type: array
              maxItems: 1000
              items:
                $ref: "#/components/schemas/BooksRuns"
        - $ref: "#/components/schemas/BooksListBlock"
        - title: Table
          type: object
          additionalProperties: false
          required: [type, head, body]
          properties:
            type:
              type: string
              const: table
            head:
              $ref: "#/components/schemas/BooksTableRows"
            body:
              $ref: "#/components/schemas/BooksTableRows"
        - title: Code
          type: object
          additionalProperties: false
          required: [type, text]
          properties:
            type:
              type: string
              const: code
            text:
              type: string
              maxLength: 200000
              description: Plain text; line breaks and tabs are kept, other control characters removed.
        - title: Figure
          type: object
          additionalProperties: false
          required: [type, image, alt]
          properties:
            type:
              type: string
              const: image
            image:
              type: integer
              minimum: 0
              maximum: 500
              description: |
                The picture's number in the book, already stored; or 0 for a figure whose picture was left out, which
                then needs a caption with some text.
            alt:
              type: string
              maxLength: 1000
              description: Cleaned and its whitespace collapsed; at most 1,000 characters (else `too-long`).
            caption:
              allOf:
                - $ref: "#/components/schemas/BooksRuns"
              description: At most 2,000 characters of text in all (else `too-long`).
    BooksChapterBody:
      type: object
      additionalProperties: false
      required: [title, blocks]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: Cleaned and trimmed; empty is 400 `invalid`, over 300 characters 400 `too-long`.
        blocks:
          type: array
          maxItems: 5000
          description: Over 5,000 blocks is 400 `too-long`; the browser splits a longer chapter into parts.
          items:
            $ref: "#/components/schemas/BooksBlock"
    BooksLanguage:
      type: string
      maxLength: 35
      pattern: '^\s*[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8}){0,4}\s*$'
      description: A BCP 47 tag such as `en` or `pt-BR` (trimmed).
      examples: [en]
    BooksIsbn:
      type: [string, "null"]
      description: |
        An ISBN-10 or ISBN-13 (hyphens, spaces and an `isbn:` or `urn:isbn:` prefix allowed), stored as ISBN-13. Empty,
        blank or null means none; an invalid one is 400 `invalid`.
      examples: [978-0-14-143951-8]
    BooksDescription:
      type: [string, "null"]
      maxLength: 4000
      description: |
        Plain text: tags removed, entities decoded, Markdown links to their text, paragraphs kept. Over 4,000
        characters once cleaned is 400 `invalid`. Empty or null means none.
    BooksPublisher:
      type: [string, "null"]
      maxLength: 200
      description: Cleaned to one line; over 200 characters is 400 `invalid`. Empty or null means none.
    BooksPublishedYear:
      type: [integer, "null"]
      minimum: 1
      description: A year from 1 to next year (UTC); later is 400 `invalid`.
    BooksStartBody:
      type: object
      additionalProperties: false
      required: [title, author, language, chapterCount]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: Cleaned and trimmed; empty is 400 `invalid`, over 300 characters 400 `too-long`.
        author:
          type: string
          minLength: 1
          maxLength: 200
          description: Cleaned and trimmed; empty is 400 `invalid`, over 200 characters 400 `too-long`.
        language:
          $ref: "#/components/schemas/BooksLanguage"
        chapterCount:
          type: integer
          minimum: 1
          maximum: 1000
          description: |
            How many chapter requests follow (positions 0 to `chapterCount - 1`). Over 1,000 is 400 `too-long`.
        description:
          $ref: "#/components/schemas/BooksDescription"
        isbn:
          $ref: "#/components/schemas/BooksIsbn"
        publisher:
          $ref: "#/components/schemas/BooksPublisher"
        publishedYear:
          $ref: "#/components/schemas/BooksPublishedYear"
        images:
          description: |
            The pictures that will follow (numbers 1 to `count`) and their bytes in all; null or left out means none.
            `bytes` must be at least `count` and at most `count` × 921,600.
          oneOf:
            - type: object
              additionalProperties: false
              required: [count, bytes]
              properties:
                count:
                  type: integer
                  minimum: 0
                  maximum: 500
                bytes:
                  type: integer
                  minimum: 0
                  maximum: 31457280
            - type: "null"
    BooksStarted:
      type: object
      additionalProperties: false
      required: [id, imageBytesLeft]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        imageBytesLeft:
          type: integer
          minimum: 0
          maximum: 262144000
          description: The account's picture room left once this book's declared pictures are counted.
    BooksPlanQuotaError:
      type: object
      additionalProperties: false
      required: [error, scope, max, plan]
      description: The account is at its plan's book limit, besides the starter book.
      properties:
        error:
          type: string
          const: quota
        scope:
          type: string
          const: books
        max:
          type: integer
          enum: [2, 25]
          description: 2 on Free, 25 on Pro.
        plan:
          type: string
          enum: [free, pro]
    BooksPictureRoomError:
      type: object
      additionalProperties: false
      required: [error, scope, max]
      description: The declared pictures don't fit in the account's 250 MB of picture room.
      properties:
        error:
          type: string
          const: quota
        scope:
          type: string
          const: user
        max:
          type: integer
          const: 262144000
    BooksImageQuotaError:
      type: object
      additionalProperties: false
      required: [error, scope, max]
      properties:
        error:
          type: string
          const: quota
        scope:
          type: string
          enum: [book, user]
          description: "`book`: the bytes the start declared for this book. `user`: the account's 250 MB."
        max:
          type: integer
          minimum: 0
          description: The limit in bytes (`images.bytes` for `book`, 262,144,000 for `user`).
    BooksCoverImageError:
      type: object
      additionalProperties: false
      required: [error, problem]
      properties:
        error:
          type: string
          const: image
        problem:
          type: string
          enum: [type, small, large]
          description: |
            `type`: not a JPEG or PNG (by its bytes, or the `Content-Type`), or empty. `small`: under 64 pixels on a
            side. `large`: over 512 KB, or over 2,400 × 3,600 pixels.
    BooksCoverView:
      type: object
      additionalProperties: false
      required: [src, width, height, source]
      properties:
        src:
          type: string
          pattern: '^/account/books/[0-9a-f-]{36}/cover\?v=[0-9a-f]{8}$'
          description: The cover's address, with the first 8 hex digits of its SHA-256.
          examples: [/account/books/3f2b8c1e-5d4a-4e6b-9c7d-1a2b3c4d5e6f/cover?v=1a2b3c4d]
        width:
          type: integer
          minimum: 64
          maximum: 2400
        height:
          type: integer
          minimum: 64
          maximum: 3600
        source:
          type: string
          enum: [epub, zip, pdf, audio, upload, open-library]
    BooksLookupBody:
      type: object
      additionalProperties: false
      required: [book]
      properties:
        book:
          $ref: "#/components/schemas/Uuid"
          description: The private book (or audiobook) being looked up. Missing or malformed is 404, not 400.
        title:
          type: [string, "null"]
          maxLength: 300
          description: Searched with `author` when there is no valid ISBN; 1 to 300 characters once cleaned.
        author:
          type: [string, "null"]
          maxLength: 200
        isbn:
          type: [string, "null"]
          description: A valid ISBN-10 or ISBN-13 wins over the title and author; an invalid one is dropped.
    BooksLookupMatch:
      type: object
      additionalProperties: false
      required: [work, title, author, year, coverId, thumb]
      properties:
        work:
          type: string
          pattern: '^OL\d{1,12}W$'
          description: The Open Library work id, for `POST /account/books/{id}/open-library`.
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: [string, "null"]
          maxLength: 200
        year:
          type: [integer, "null"]
          minimum: 1
          maximum: 9999
          description: The work's first publication year.
        coverId:
          type: [integer, "null"]
          minimum: 1
        thumb:
          type: [string, "null"]
          format: uri
          description: |
            The medium thumbnail the browser loads from Open Library's cover service itself
            (`https://covers.openlibrary.org/b/id/<coverId>-M.jpg` by default); null without a cover.
    BooksLookupAnswer:
      type: object
      additionalProperties: false
      required: [matches]
      properties:
        matches:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/BooksLookupMatch"
    BooksApplyBody:
      type: object
      additionalProperties: false
      required: [work, useCover, useDescription]
      properties:
        work:
          type: string
          pattern: '^OL\d{1,12}W$'
        coverId:
          type: [integer, "null"]
          minimum: 1
          maximum: 9007199254740991
          description: The match's cover; null or left out means none, and `useCover` then does nothing.
        useCover:
          type: boolean
        useDescription:
          type: boolean
    BooksApplyAnswer:
      type: object
      additionalProperties: false
      required: [changed, cover]
      properties:
        changed:
          type: object
          additionalProperties: false
          required: [description, cover, isbn, year]
          properties:
            description:
              type: boolean
            cover:
              type: boolean
            isbn:
              type: boolean
            year:
              type: boolean
        cover:
          description: The new cover when one was applied, else null.
          oneOf:
            - $ref: "#/components/schemas/BooksCoverView"
            - type: "null"
        coverProblem:
          type: string
          enum: [cover-too-large, cover-failed]
          description: |
            Present only when a cover was asked for and not applied: too large (over 1 MB fetched, or over 512 KB or
            2,400 × 3,600 once checked), or not fetched or not a usable JPEG or PNG.
    AudiobookText:
      type: string
      description: Cleaned to one line (NFC, control characters removed, whitespace collapsed, trimmed).
    AudiobookStartBody:
      type: object
      additionalProperties: false
      required: [title, author, language, details, files, chapters, cover]
      properties:
        title:
          $ref: "#/components/schemas/AudiobookText"
          minLength: 1
          maxLength: 300
        author:
          $ref: "#/components/schemas/AudiobookText"
          minLength: 1
          maxLength: 200
        narrator:
          type: [string, "null"]
          maxLength: 200
          description: Read by; cleaned to one line, at most 200 characters. Blank or null means none.
        language:
          $ref: "#/components/schemas/BooksLanguage"
        details:
          type: object
          additionalProperties: false
          required: []
          properties:
            description:
              $ref: "#/components/schemas/BooksDescription"
            isbn:
              $ref: "#/components/schemas/BooksIsbn"
            publisher:
              $ref: "#/components/schemas/BooksPublisher"
            publishedYear:
              $ref: "#/components/schemas/BooksPublishedYear"
        files:
          type: array
          minItems: 1
          maxItems: 500
          description: |
            Each file's kind and size, in play order: file `n` is `files[n - 1]`. All of one kind; an M4B (`mp4`) is
            exactly one file. At most 2 GB (2,147,483,648 bytes) in all.
          items:
            type: object
            additionalProperties: false
            required: [type, bytes]
            properties:
              type:
                type: string
                enum: [mp4, mp3]
              bytes:
                type: integer
                minimum: 1
                maximum: 2147483648
        chapters:
          type: array
          minItems: 1
          maxItems: 1000
          description: |
            Windows into the files that must tile them: in order, each file's first chapter starts at 0, each next
            chapter in a file starts where the one before ended, and every file has at least one. The server moves each
            file's last chapter to end at the file's real end at finish.
          items:
            $ref: "#/components/schemas/AudiobookChapter"
        cover:
          type: boolean
          description: Whether a cover upload follows.
    AudiobookChapter:
      type: object
      additionalProperties: false
      required: [title, fileN, startMs, durationMs]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 600
          description: At most 600 characters as sent; cleaned and cut to 300; empty once cleaned is 400.
        fileN:
          type: integer
          minimum: 1
          maximum: 500
          description: The file it is in, 1 to the number of files.
        startMs:
          type: integer
          minimum: 0
          maximum: 172800000
        durationMs:
          type: integer
          minimum: 1
          maximum: 86400000
          description: At most 24 hours.
    AudiobookServerFullError:
      type: object
      additionalProperties: false
      required: [error, scope]
      description: The server is short of disk space for audiobooks.
      properties:
        error:
          type: string
          const: quota
        scope:
          type: string
          const: server
    AudiobookStartQuotaError:
      type: object
      additionalProperties: false
      required: [error, scope, max, plan]
      properties:
        error:
          type: string
          const: quota
        scope:
          type: string
          enum: [audio, rate]
          description: "`audio`: 8 GB of audio per account. `rate`: 10 finished imports in the last hour."
        max:
          type: integer
          enum: [8589934592, 10]
        plan:
          type: string
          enum: [free, pro]
    AudiobookOffsetError:
      type: object
      additionalProperties: false
      required: [error, received]
      properties:
        error:
          type: string
          const: offset
        received:
          type: integer
          minimum: 0
          description: The bytes of this file the server holds; send the next chunk at this offset.
    AudiobookUnreadableError:
      type: object
      additionalProperties: false
      required: [error, reason]
      properties:
        error:
          type: string
          const: unreadable
        reason:
          type: string
          maxLength: 200
          description: Why, in words for the reader (redacted, at most 200 characters).
    RemovedBookBody:
      type: object
      additionalProperties: false
      required: [book, removed]
      properties:
        book:
          type: string
          maxLength: 200
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          not:
            pattern: "^u-"
          description: A catalogue book's slug. A private book's `u-<uuid>` is 400.
          examples: [pride-and-prejudice]
        removed:
          type: boolean
          description: "`true` takes the book out of the library, `false` puts it back."
    ReadingPagePosition:
      description: |
        A page in a book: `{ chapter, page }` for a chapter book (the chapter's slug and the screen page within it),
        or `{ printedPage }` for a paged book. A position the book doesn't have passes the schema but is refused (or,
        in a sync batch, skipped) once the book is loaded.
      oneOf:
        - title: Chapter book
          type: object
          additionalProperties: false
          required: [chapter, page]
          properties:
            chapter:
              type: string
              maxLength: 200
              pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
            page:
              type: integer
              minimum: 1
              maximum: 100000
        - title: Paged book
          type: object
          additionalProperties: false
          required: [printedPage]
          properties:
            printedPage:
              type: integer
              minimum: 1
              maximum: 100000
    ReadingDeleteBody:
      type: object
      additionalProperties: false
      required: [intent]
      properties:
        intent:
          type: string
          const: delete
    ReadingOkAnswer:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    BookmarkCreateBody:
      type: object
      additionalProperties: false
      required: [book, position]
      properties:
        book:
          $ref: "#/components/schemas/BookSlug"
        position:
          $ref: "#/components/schemas/ReadingPagePosition"
    BookmarkPlace:
      type: object
      additionalProperties: false
      required: [chapterIndex, chapterTitle, chapter, page, pageHref, label, position]
      description: Where the bookmark is in the book's current text.
      properties:
        chapterIndex:
          type: integer
          minimum: 0
        chapterTitle:
          type: string
        chapter:
          type: [string, "null"]
          description: The chapter slug (chapter books), or null (paged books).
        page:
          type: integer
          minimum: 1
          description: The screen page within the chapter, or the printed page.
        pageHref:
          type: string
          description: The page's reader URL (a path).
        label:
          type: string
          description: '"Ch. 3 · p. 2", or "p. 112".'
        position:
          type: integer
          minimum: 0
          description: The page's index in the book, in reading order.
    BookmarkView:
      type: object
      additionalProperties: false
      required: [id, status, opening, place, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          enum: [ok, moved, missing]
          description: |
            `ok`: on the page it was made on; `moved`: its opening words are on another page now (a re-import);
            `missing`: found nowhere.
        opening:
          type: string
          description: The page's opening words when it was bookmarked, whitespace collapsed.
        place:
          description: Null when missing.
          oneOf:
            - $ref: "#/components/schemas/BookmarkPlace"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    BookmarkAnswer:
      type: object
      additionalProperties: false
      required: [bookmark]
      properties:
        bookmark:
          $ref: "#/components/schemas/BookmarkView"
    BookmarkQuotaError:
      type: object
      additionalProperties: false
      required: [error, scope, max]
      description: The same numbers for page bookmarks and audio bookmarks, which are counted apart.
      properties:
        error:
          type: string
          const: quota
        scope:
          type: string
          enum: [book, user]
          description: "`book`: 1,000 in this book. `user`: 10,000 in all."
        max:
          type: integer
          enum: [1000, 10000]
    AudioBookmarkCreateBody:
      oneOf:
        - title: Read aloud
          type: object
          additionalProperties: false
          required: [book, kind, position, offset]
          properties:
            book:
              $ref: "#/components/schemas/BookSlug"
            kind:
              type: string
              const: voice
            position:
              $ref: "#/components/schemas/ReadingPagePosition"
            offset:
              type: integer
              minimum: 0
              maximum: 100000
              description: The sentence's offset in the page's text, in UTF-16 units.
        - title: Audiobook
          type: object
          additionalProperties: false
          required: [book, kind, episode, positionMs]
          properties:
            book:
              $ref: "#/components/schemas/BookSlug"
            kind:
              type: string
              const: episode
            episode:
              type: string
              minLength: 1
              maxLength: 200
              description: An episode id of the book's audiobook (a private book's are its imported chapters).
            positionMs:
              type: integer
              minimum: 0
              maximum: 86400000
              description: The time in the episode, in ms; stored rounded down to a whole second.
    AudioBookmarkView:
      oneOf:
        - title: Read aloud
          type: object
          additionalProperties: false
          required: [kind, id, status, opening, place, createdAt]
          properties:
            kind:
              type: string
              const: voice
            id:
              $ref: "#/components/schemas/Uuid"
            status:
              type: string
              enum: [ok, moved, missing]
            opening:
              type: string
              description: The sentence's opening words when it was bookmarked, whitespace collapsed.
            place:
              description: Null when missing.
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [chapterIndex, chapterTitle, chapter, page, pageHref, label, position, start]
                  properties:
                    chapterIndex:
                      type: integer
                      minimum: 0
                    chapterTitle:
                      type: string
                    chapter:
                      type: [string, "null"]
                    page:
                      type: integer
                      minimum: 1
                    pageHref:
                      type: string
                    label:
                      type: string
                    position:
                      type: integer
                      minimum: 0
                    start:
                      type: integer
                      minimum: 0
                      description: Where the sentence starts in the page's current text, in UTF-16 units.
                - type: "null"
            createdAt:
              $ref: "#/components/schemas/Timestamp"
        - title: Audiobook
          type: object
          additionalProperties: false
          required: [kind, id, status, positionMs, episode, createdAt]
          properties:
            kind:
              type: string
              const: episode
            id:
              $ref: "#/components/schemas/Uuid"
            status:
              type: string
              enum: [ok, missing]
              description: "`missing`: the episode is no longer in the book's audiobook."
            positionMs:
              type: integer
              minimum: 0
              description: A whole second, in ms.
            episode:
              description: Null when missing.
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [id, number, title, durationMs]
                  properties:
                    id:
                      type: string
                    number:
                      type: integer
                    title:
                      type: string
                    durationMs:
                      type: integer
                      minimum: 0
                - type: "null"
            createdAt:
              $ref: "#/components/schemas/Timestamp"
    AudioBookmarkAnswer:
      type: object
      additionalProperties: false
      required: [bookmark]
      properties:
        bookmark:
          $ref: "#/components/schemas/AudioBookmarkView"
    HighlightColor:
      type: string
      enum: [yellow, green, blue, pink]
    HighlightNote:
      description: |
        Cleaned before it is stored (Unicode NFC, control characters but line breaks and tabs removed, trimmed), then
        at most 5,000 characters (code points). Null, or empty after cleaning, is no note.
      oneOf:
        - type: string
          maxLength: 20000
        - type: "null"
    HighlightCreateBody:
      type: object
      additionalProperties: false
      required: [book, position, start, end, text, color]
      properties:
        book:
          $ref: "#/components/schemas/BookSlug"
        position:
          $ref: "#/components/schemas/ReadingPagePosition"
        start:
          type: integer
          minimum: 0
          maximum: 10000000
          description: Offset in the page's text, in UTF-16 units.
        end:
          type: integer
          minimum: 1
          maximum: 10000000
          description: Greater than `start`, and at most the page text's length (else 400).
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: |
            The passage: exactly the page's text between `start` and `end` (else 409 `stale`), never cleaned. At most
            4,000 characters (code points), well-formed UTF-16 (no lone surrogates).
        color:
          $ref: "#/components/schemas/HighlightColor"
        note:
          $ref: "#/components/schemas/HighlightNote"
    HighlightChangeBody:
      oneOf:
        - title: Update
          type: object
          additionalProperties: false
          required: [intent]
          minProperties: 2
          description: "`color`, `note` or both."
          properties:
            intent:
              type: string
              const: update
            color:
              $ref: "#/components/schemas/HighlightColor"
            note:
              $ref: "#/components/schemas/HighlightNote"
        - title: Delete
          $ref: "#/components/schemas/ReadingDeleteBody"
    HighlightPlace:
      type: object
      additionalProperties: false
      required: [chapterIndex, chapterTitle, chapter, page, pageHref, href, label, position, start, end]
      description: Where the highlight is in the book's current text.
      properties:
        chapterIndex:
          type: integer
          minimum: 0
        chapterTitle:
          type: string
        chapter:
          type: [string, "null"]
          description: The chapter slug (chapter books), or null (paged books).
        page:
          type: integer
          minimum: 1
        pageHref:
          type: string
          description: The page's reader URL (a path).
        href:
          type: string
          description: The page's reader URL with `#highlight-<id>`.
        label:
          type: string
          description: '"Ch. 3 · p. 2", or "p. 112".'
        position:
          type: integer
          minimum: 0
          description: The page's index in the book, in reading order.
        start:
          type: integer
          minimum: 0
          description: Offsets in the page's current text, in UTF-16 units.
        end:
          type: integer
          minimum: 0
    HighlightView:
      type: object
      additionalProperties: false
      required: [id, color, note, text, status, place, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        color:
          $ref: "#/components/schemas/HighlightColor"
        note:
          type: [string, "null"]
        text:
          type: string
          description: The passage.
        status:
          type: string
          enum: [ok, moved, missing]
          description: "`ok`: where it was made; `moved`: found again elsewhere; `missing`: no longer in the book."
        place:
          description: Null when missing.
          oneOf:
            - $ref: "#/components/schemas/HighlightPlace"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    HighlightAnswer:
      type: object
      additionalProperties: false
      required: [highlight]
      properties:
        highlight:
          $ref: "#/components/schemas/HighlightView"
    HighlightQuotaError:
      type: object
      additionalProperties: false
      required: [error, scope, max, plan]
      properties:
        error:
          type: string
          const: quota
        scope:
          type: string
          enum: [book, user]
          description: |
            `user`: the account's cap (Free 50, Pro 10,000), checked first. `book`: Pro's 1,000 in one book (on Free
            the per-book cap is also 50, so it never bites first).
        max:
          type: integer
          enum: [50, 1000, 10000]
        plan:
          type: string
          enum: [free, pro]
    HighlightsFormBody:
      type: object
      additionalProperties: false
      required: [intent]
      description: |
        `intent=delete` with `id`, or `intent=delete-book` with `book`. Anything else is a 303 to `?error=invalid`,
        not a 400.
      properties:
        intent:
          type: string
          enum: [delete, delete-book]
        id:
          $ref: "#/components/schemas/Uuid"
        book:
          $ref: "#/components/schemas/BookSlug"
    FlashcardCreateBody:
      type: object
      additionalProperties: false
      required: [book, front, back, position, origin]
      properties:
        book:
          $ref: "#/components/schemas/BookSlug"
        front:
          type: string
          minLength: 1
          description: 1 to 200 characters (code points) after cleaning.
        back:
          type: string
          minLength: 1
          description: 1 to 500 characters (code points) after cleaning.
        position:
          $ref: "#/components/schemas/ReadingPagePosition"
        origin:
          type: string
          enum: [quiz, flashcards]
          description: Which of Ask's answers the card came from. Stored, never answered.
    FlashcardChangeBody:
      oneOf:
        - title: Review
          type: object
          additionalProperties: false
          required: [review]
          properties:
            review:
              type: string
              enum: [again, good]
        - title: Delete
          type: object
          additionalProperties: false
          required: [delete]
          properties:
            delete:
              type: boolean
              const: true
    FlashcardView:
      type: object
      additionalProperties: false
      required: [id, front, back, source, box, dueAt, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        front:
          type: string
        back:
          type: string
        source:
          description: The page the card came from, as a reader link; null when the book no longer has that page.
          oneOf:
            - type: object
              additionalProperties: false
              required: [pageHref, label]
              properties:
                pageHref:
                  type: string
                label:
                  type: string
            - type: "null"
        box:
          type: integer
          minimum: 0
          maximum: 5
          description: The card's Leitner box; a new card is in box 0.
        dueAt:
          $ref: "#/components/schemas/Timestamp"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    FlashcardSaved:
      type: object
      additionalProperties: false
      required: [card, existed]
      properties:
        card:
          $ref: "#/components/schemas/FlashcardView"
        existed:
          type: boolean
          description: True when the book already had a card with this front (the 200).
    FlashcardQuotaError:
      type: object
      additionalProperties: false
      required: [error, scope, max]
      properties:
        error:
          type: string
          const: quota
        scope:
          type: string
          enum: [book, user]
          description: "`book`: 1,000 cards in this book. `user`: 10,000 in all."
        max:
          type: integer
          enum: [1000, 10000]
    FlashcardsFormBody:
      type: object
      additionalProperties: false
      required: [intent, book]
      description: Anything else is a 303 to `?error=invalid`, not a 400.
      properties:
        intent:
          type: string
          const: delete-book
        book:
          $ref: "#/components/schemas/BookSlug"
    SyncAt:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: When the reader did it, in ms since the epoch by the device's clock; capped at the server's clock.
    SyncReadingItem:
      type: object
      additionalProperties: false
      required: [book, position, at]
      description: A book's reading place.
      properties:
        book:
          $ref: "#/components/schemas/BookSlug"
        position:
          $ref: "#/components/schemas/ReadingPagePosition"
        at:
          $ref: "#/components/schemas/SyncAt"
    SyncListeningItem:
      oneOf:
        - title: Audiobook episode
          type: object
          additionalProperties: false
          required: [book, kind, episode, positionMs, at]
          properties:
            book:
              $ref: "#/components/schemas/BookSlug"
            kind:
              type: string
              const: episode
            episode:
              type: string
              minLength: 1
              maxLength: 200
            positionMs:
              description: The time in the episode; null when it was played to the end.
              oneOf:
                - type: integer
                  minimum: 0
                  maximum: 86400000
                - type: "null"
            at:
              $ref: "#/components/schemas/SyncAt"
        - title: Read aloud
          type: object
          additionalProperties: false
          required: [book, kind, position, offset, at]
          properties:
            book:
              $ref: "#/components/schemas/BookSlug"
            kind:
              type: string
              const: voice
            position:
              description: The page being read aloud; null when the book was read to the end (then `offset` must be 0).
              oneOf:
                - $ref: "#/components/schemas/ReadingPagePosition"
                - type: "null"
            offset:
              type: integer
              minimum: 0
              maximum: 1000000
              description: The sentence's offset in the page's text, in UTF-16 units.
            at:
              $ref: "#/components/schemas/SyncAt"
    SyncReaderSettings:
      type: object
      additionalProperties: false
      required: [theme, font, leading, measure]
      properties:
        theme:
          type: string
          enum: [light, sepia, dark]
        font:
          type: string
          enum: [literata, source-serif, geist, atkinson, opendyslexic]
        leading:
          type: string
          enum: [compact, normal, relaxed]
        measure:
          type: string
          enum: [narrow, normal, wide]
    SyncBatchBody:
      type: object
      additionalProperties: false
      required: []
      minProperties: 1
      description: At least one of `reading`, `listening` and `settings`.
      properties:
        reading:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/SyncReadingItem"
        listening:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/SyncListeningItem"
        settings:
          type: object
          additionalProperties: false
          required: [values, at]
          description: The four reader settings, as one item.
          properties:
            values:
              $ref: "#/components/schemas/SyncReaderSettings"
            at:
              $ref: "#/components/schemas/SyncAt"
    SyncAnswer:
      type: object
      additionalProperties: false
      required: [ok, skipped]
      properties:
        ok:
          type: boolean
          const: true
        skipped:
          type: integer
          minimum: 0
          description: Items left out because their book, page or episode wasn't found for this account.
    AccountExportBook:
      type: object
      additionalProperties: false
      required: [slug, title]
      description: |
        A catalogue slug or `u-<uuid>`, and a title that is null for a catalogue book that has left the library.
      properties:
        slug:
          type: string
        title:
          type: [string, "null"]
    AccountExport:
      type: object
      additionalProperties: false
      description: Every array's items are the account's own rows. Times are ISO strings.
      required:
        [
          format,
          version,
          exportedAt,
          site,
          account,
          sessions,
          apiKeys,
          passkeys,
          accessTokens,
          githubRepos,
          readerSettings,
          privateBooks,
          highlights,
          bookmarks,
          flashcards,
          audioBookmarks,
          readingPlaces,
          listeningPlaces,
          shelves,
          removedBooks,
          speechUsage,
          subscriptions,
          activity,
        ]
      properties:
        format:
          type: string
          const: folio-account
        version:
          type: integer
          const: 1
        exportedAt:
          $ref: "#/components/schemas/Timestamp"
        site:
          type: string
          format: uri
          description: The site's origin.
        account:
          type: object
          additionalProperties: false
          required:
            [username, role, createdAt, passwordChangedAt, aiModel, speechModel, email, emailVerifiedAt, emailBouncedAt]
          properties:
            username:
              type: string
            role:
              type: string
              enum: [admin, member]
            createdAt:
              $ref: "#/components/schemas/Timestamp"
            passwordChangedAt:
              $ref: "#/components/schemas/Timestamp"
            aiModel:
              type: string
              description: The Ask model the account uses (the default when none is chosen).
            speechModel:
              type: string
              description: The read-aloud model the account uses (the default when none is chosen).
            email:
              type: [string, "null"]
              description: The confirmed address only.
            emailVerifiedAt:
              type: [string, "null"]
              format: date-time
            emailBouncedAt:
              type: [string, "null"]
              format: date-time
        sessions:
          type: array
          description: The live sessions, oldest first.
          items:
            type: object
            additionalProperties: false
            required: [device, ip, createdAt, lastSeenAt, expiresAt]
            properties:
              device:
                type: string
                description: Worked out from the User-Agent, like "Safari on iPhone".
              ip:
                type: [string, "null"]
              createdAt:
                $ref: "#/components/schemas/Timestamp"
              lastSeenAt:
                $ref: "#/components/schemas/Timestamp"
              expiresAt:
                $ref: "#/components/schemas/Timestamp"
        apiKeys:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [provider, last4, createdAt, lastUsedAt, lastValidatedAt]
            properties:
              provider:
                type: string
                enum: [anthropic]
              last4:
                type: string
              createdAt:
                $ref: "#/components/schemas/Timestamp"
              lastUsedAt:
                type: [string, "null"]
                format: date-time
              lastValidatedAt:
                type: [string, "null"]
                format: date-time
        passkeys:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, createdAt, lastUsedAt, backedUp, transports]
            properties:
              name:
                type: string
              createdAt:
                $ref: "#/components/schemas/Timestamp"
              lastUsedAt:
                type: [string, "null"]
                format: date-time
              backedUp:
                type: boolean
              transports:
                type: array
                items:
                  type: string
        accessTokens:
          type: array
          description: The live access tokens, without their hashes.
          items:
            type: object
            additionalProperties: false
            required: [name, device, ip, createdAt, lastUsedAt, expiresAt]
            properties:
              name:
                type: string
              device:
                type: string
                description: The device that made it, from its User-Agent.
              ip:
                type: [string, "null"]
              createdAt:
                $ref: "#/components/schemas/Timestamp"
              lastUsedAt:
                type: [string, "null"]
                format: date-time
              expiresAt:
                $ref: "#/components/schemas/Timestamp"
        githubRepos:
          type: array
          description: The account's GitHub repositories, oldest first. Which ones, at which ref, and when; no files.
          items:
            type: object
            additionalProperties: false
            required: [owner, name, ref, addedAt, openedAt, goneAt]
            properties:
              owner:
                type: string
              name:
                type: string
              ref:
                type: [string, "null"]
                description: The branch, tag or commit the address named; null follows the default branch.
              addedAt:
                $ref: "#/components/schemas/Timestamp"
              openedAt:
                type: [string, "null"]
                format: date-time
              goneAt:
                type: [string, "null"]
                format: date-time
                description: When a refresh first found it no longer on GitHub; null while it is there.
        readerSettings:
          description: The four synced reader settings (each null when not stored), or null when there are none.
          oneOf:
            - type: object
              additionalProperties: false
              required: [theme, font, leading, measure]
              properties:
                theme:
                  type: [string, "null"]
                font:
                  type: [string, "null"]
                leading:
                  type: [string, "null"]
                measure:
                  type: [string, "null"]
            - type: "null"
        privateBooks:
          type: array
          description: The account's own books, without their pages, cover or picture bytes, or audio.
          items:
            type: object
            additionalProperties: false
            required:
              [
                slug,
                title,
                author,
                language,
                status,
                chapters,
                description,
                isbn,
                publisher,
                publishedYear,
                openLibraryWork,
                cover,
                imageCount,
                audio,
                createdAt,
                readyAt,
              ]
            properties:
              slug:
                type: string
                pattern: "^u-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
              title:
                type: string
              author:
                type: string
              language:
                type: string
              status:
                type: string
                enum: [uploading, ready]
              chapters:
                type: array
                description: Chapter titles, in order.
                items:
                  type: string
              description:
                type: [string, "null"]
              isbn:
                type: [string, "null"]
              publisher:
                type: [string, "null"]
              publishedYear:
                type: [integer, "null"]
              openLibraryWork:
                type: [string, "null"]
              cover:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [source, width, height]
                    properties:
                      source:
                        type: string
                      width:
                        type: integer
                      height:
                        type: integer
                  - type: "null"
              imageCount:
                type: integer
                minimum: 0
              audio:
                description: An imported audiobook's facts and chapters; null for a text book.
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [narrator, lengthMs, size, files, chapters]
                    properties:
                      narrator:
                        type: [string, "null"]
                      lengthMs:
                        type: integer
                        minimum: 0
                      size:
                        type: integer
                        minimum: 0
                        description: The files' size in bytes, all together.
                      files:
                        type: integer
                        minimum: 0
                      chapters:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required: [title, durationMs]
                          properties:
                            title:
                              type: string
                            durationMs:
                              type: integer
                              minimum: 0
                  - type: "null"
              createdAt:
                $ref: "#/components/schemas/Timestamp"
              readyAt:
                type: [string, "null"]
                format: date-time
        highlights:
          type: array
          description: Oldest first.
          items:
            type: object
            additionalProperties: false
            required: [book, chapter, page, text, color, note, createdAt, updatedAt]
            properties:
              book:
                $ref: "#/components/schemas/AccountExportBook"
              chapter:
                type: [string, "null"]
              page:
                type: integer
              text:
                type: string
              color:
                type: string
              note:
                type: [string, "null"]
              createdAt:
                $ref: "#/components/schemas/Timestamp"
              updatedAt:
                $ref: "#/components/schemas/Timestamp"
        bookmarks:
          type: array
          description: Oldest first; `text` is the page's opening words.
          items:
            type: object
            additionalProperties: false
            required: [book, chapter, page, text, createdAt]
            properties:
              book:
                $ref: "#/components/schemas/AccountExportBook"
              chapter:
                type: [string, "null"]
              page:
                type: integer
              text:
                type: string
              createdAt:
                $ref: "#/components/schemas/Timestamp"
        flashcards:
          type: array
          description: Oldest first.
          items:
            type: object
            additionalProperties: false
            required: [book, front, back, chapter, page, box, dueAt, createdAt]
            properties:
              book:
                $ref: "#/components/schemas/AccountExportBook"
              front:
                type: string
              back:
                type: string
              chapter:
                type: [string, "null"]
              page:
                type: integer
              box:
                type: integer
                minimum: 0
                maximum: 5
              dueAt:
                $ref: "#/components/schemas/Timestamp"
              createdAt:
                $ref: "#/components/schemas/Timestamp"
        audioBookmarks:
          type: array
          description: Oldest first. A voice bookmark has the page fields and `text`; an episode one the episode fields.
          items:
            type: object
            additionalProperties: false
            required: [book, kind, episode, positionMs, chapter, page, text, createdAt]
            properties:
              book:
                $ref: "#/components/schemas/AccountExportBook"
              kind:
                type: string
                enum: [voice, episode]
              episode:
                type: [string, "null"]
              positionMs:
                type: [integer, "null"]
              chapter:
                type: [string, "null"]
              page:
                type: [integer, "null"]
              text:
                type: [string, "null"]
              createdAt:
                $ref: "#/components/schemas/Timestamp"
        readingPlaces:
          type: array
          description: Newest first.
          items:
            type: object
            additionalProperties: false
            required: [book, chapter, page, at, device]
            properties:
              book:
                $ref: "#/components/schemas/AccountExportBook"
              chapter:
                type: [string, "null"]
              page:
                type: integer
              at:
                $ref: "#/components/schemas/Timestamp"
              device:
                type: string
        listeningPlaces:
          type: array
          description: Newest first.
          items:
            type: object
            additionalProperties: false
            required: [book, kind, episode, positionMs, chapter, page, at, device]
            properties:
              book:
                $ref: "#/components/schemas/AccountExportBook"
              kind:
                type: string
                enum: [voice, episode]
              episode:
                type: [string, "null"]
              positionMs:
                type: [integer, "null"]
              chapter:
                type: [string, "null"]
              page:
                type: [integer, "null"]
              at:
                $ref: "#/components/schemas/Timestamp"
              device:
                type: string
        shelves:
          type: array
          description: By name; each shelf's books newest added first.
          items:
            type: object
            additionalProperties: false
            required: [name, createdAt, books]
            properties:
              name:
                type: string
              createdAt:
                $ref: "#/components/schemas/Timestamp"
              books:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [book, addedAt]
                  properties:
                    book:
                      $ref: "#/components/schemas/AccountExportBook"
                    addedAt:
                      $ref: "#/components/schemas/Timestamp"
        removedBooks:
          type: array
          description: Catalogue books taken out of the account's library, newest first.
          items:
            type: object
            additionalProperties: false
            required: [book, removedAt]
            properties:
              book:
                $ref: "#/components/schemas/AccountExportBook"
              removedAt:
                $ref: "#/components/schemas/Timestamp"
        speechUsage:
          type: array
          description: Read aloud's ElevenLabs characters and requests per minute; no text.
          items:
            type: object
            additionalProperties: false
            required: [minute, characters, requests]
            properties:
              minute:
                $ref: "#/components/schemas/Timestamp"
              characters:
                type: integer
                minimum: 0
              requests:
                type: integer
                minimum: 0
        subscriptions:
          type: array
          description: Pro bought through Paddle, without Paddle's ids.
          items:
            type: object
            additionalProperties: false
            required: [status, cadence, founding, periodEndsAt, cancelAt, canceledAt, createdAt]
            properties:
              status:
                type: string
                enum: [active, trialing, past_due, paused, canceled]
              cadence:
                type: string
                enum: [month, year]
              founding:
                type: boolean
              periodEndsAt:
                type: [string, "null"]
                format: date-time
              cancelAt:
                type: [string, "null"]
                format: date-time
              canceledAt:
                type: [string, "null"]
                format: date-time
              createdAt:
                $ref: "#/components/schemas/Timestamp"
        activity:
          type: array
          description: The account's own audit events, newest first.
          items:
            type: object
            additionalProperties: false
            required: [event, at, ip, detail]
            properties:
              event:
                type: string
                examples: [account.exported]
              at:
                $ref: "#/components/schemas/Timestamp"
              ip:
                type: [string, "null"]
              detail:
                description: 'The event''s details as stored (any JSON value), e.g. `{ "bytes": 48213 }`.'
    WordLookupBody:
      type: object
      additionalProperties: false
      required: [book, term, source]
      properties:
        book:
          $ref: "#/components/schemas/BookSlug"
        term:
          type: string
          maxLength: 200
          description: |
            The selected word or name, at most 200 characters as sent. It is cleaned (NFC, control characters removed,
            whitespace collapsed), punctuation and symbols are taken off either end and a final `'s` dropped; what is
            left must be 1 to 60 characters, 1 to 3 words, with a letter, or the request is 400. That is the term
            looked up and answered.
        source:
          type: string
          enum: [dictionary, wikipedia]
          description: "`dictionary` asks Wiktionary, `wikipedia` the book's language's Wikipedia."
    WordSense:
      type: object
      additionalProperties: false
      required: [partOfSpeech, definitions]
      properties:
        partOfSpeech:
          type: string
          description: As Wiktionary names it ("Noun", "Verb", "Proper noun").
        definitions:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text:
                type: string
                maxLength: 400
                description: Plain text, never HTML; cut at a space with … when longer.
              lemma:
                type: string
                description: The word this one is a form of ("entailed" → "entail"), when Wiktionary says so.
    WordAnswer:
      oneOf:
        - title: Dictionary entry
          type: object
          additionalProperties: false
          required: [state, source, term, language, languageName, otherLanguage, senses, url]
          properties:
            state:
              type: string
              const: found
            source:
              type: string
              const: dictionary
            term:
              type: string
              description: The term the entry is for, as asked, or in lower case after a capitalised one found nothing.
            language:
              type: string
              description: The language code of the entries shown.
            languageName:
              type: string
              description: Its English name.
            otherLanguage:
              type: boolean
              description: True when the book's language had no entries and these are another language's.
            senses:
              type: array
              minItems: 1
              maxItems: 3
              items:
                $ref: "#/components/schemas/WordSense"
            url:
              type: string
              format: uri
              description: The entry's page on Wiktionary.
        - title: Wikipedia summary
          type: object
          additionalProperties: false
          required: [state, source, title, description, extract, url]
          properties:
            state:
              type: string
              const: found
            source:
              type: string
              const: wikipedia
            title:
              type: string
            description:
              type: [string, "null"]
            extract:
              type: string
              maxLength: 1200
              description: Plain text, cut at a sentence end (or a space, with …) to 1,200 characters.
            url:
              type: string
              format: uri
        - title: Not found
          type: object
          additionalProperties: false
          required: [state]
          properties:
            state:
              type: string
              const: not-found
            searchUrl:
              type: string
              format: uri
              description: Wikipedia's search page for the term; only when the source was `wikipedia`.
        - title: Disambiguation
          type: object
          additionalProperties: false
          required: [state, title, url]
          properties:
            state:
              type: string
              const: ambiguous
            title:
              type: string
            url:
              type: string
              format: uri
    TranslateBody:
      type: object
      additionalProperties: false
      required: [book, text, to]
      properties:
        book:
          $ref: "#/components/schemas/BookSlug"
        text:
          type: string
          description: |
            The term or passage. Cleaned (NFC, control characters other than line breaks and tabs removed, trimmed);
            with whitespace collapsed it must be 1 to 1,000 characters.
        context:
          type: string
          description: |
            For a term, the sentence it is in; at most 1,000 characters once cleaned and collapsed. Ignored for a
            passage. Must be a string when present (not null).
        to:
          type: string
          description: The language to translate into.
          enum:
            [
              ar,
              bn,
              cs,
              da,
              de,
              el,
              en,
              es,
              fa,
              fi,
              fr,
              he,
              hi,
              id,
              it,
              ja,
              ko,
              ms,
              nb,
              nl,
              pl,
              pt,
              ru,
              sv,
              th,
              tr,
              uk,
              ur,
              vi,
              zh-Hans,
              zh-Hant,
            ]
    TranslateAnswer:
      type: object
      additionalProperties: false
      required: [translation, model]
      properties:
        translation:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Plain text, cut to 2,000 characters (with …). A term: its translation on the first line, then one
            sentence on its sense there. A passage: the translation with its paragraphs.
        model:
          type: string
          description: The model that served it, which may be a fallback for the reader's chosen one.
    AskPosition:
      description: |
        A reader position: a chapter book's chapter slug and 1-based screen page, or a paged book's printed page.
        Read aloud's span takes the same shape.
      oneOf:
        - title: Chapter book
          type: object
          additionalProperties: false
          required: [chapter, page]
          properties:
            chapter:
              type: string
              maxLength: 200
              pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
            page:
              type: integer
              minimum: 1
              maximum: 100000
        - title: Paged book
          type: object
          additionalProperties: false
          required: [printedPage]
          properties:
            printedPage:
              type: integer
              minimum: 1
              maximum: 100000
    SpeakBody:
      description: One utterance's span on a page, or the chapter's intro; never both.
      oneOf:
        - title: Span
          type: object
          additionalProperties: false
          required: [book, chapter, voice, position, start, end]
          properties:
            book:
              $ref: "#/components/schemas/BookSlug"
            chapter:
              $ref: "#/components/schemas/SpeakChapterIndex"
            voice:
              $ref: "#/components/schemas/ElevenLabsVoiceId"
            format:
              $ref: "#/components/schemas/SpeechFormat"
            position:
              $ref: "#/components/schemas/AskPosition"
            start:
              type: integer
              minimum: 0
              maximum: 100000
              description: The utterance's first offset in the page's text.
            end:
              type: integer
              minimum: 1
              maximum: 100000
              description: One past its last offset; greater than `start`.
        - title: Intro
          type: object
          additionalProperties: false
          required: [book, chapter, voice, intro]
          properties:
            book:
              $ref: "#/components/schemas/BookSlug"
            chapter:
              $ref: "#/components/schemas/SpeakChapterIndex"
            voice:
              $ref: "#/components/schemas/ElevenLabsVoiceId"
            format:
              $ref: "#/components/schemas/SpeechFormat"
            intro:
              type: boolean
              const: true
    SpeakChapterIndex:
      type: integer
      minimum: 0
      maximum: 100000
      description: The chapter's 0-based index; one the book doesn't have is 404.
    ElevenLabsVoiceId:
      type: string
      pattern: "^[A-Za-z0-9]{1,64}$"
      description: One of the reader's ElevenLabs voice ids.
    SpeechFormat:
      type: string
      enum: [low, standard]
      default: low
      description: "`low` is 64 kbps MP3 (`mp3_44100_64`), `standard` 128 kbps (`mp3_44100_128`)."
    SpeakAnswer:
      type: object
      additionalProperties: false
      required: [audio, words, format]
      properties:
        audio:
          type: string
          contentEncoding: base64
          contentMediaType: audio/mpeg
          description: The utterance as base64 MP3, at the rate `format` says.
        words:
          type: array
          description: |
            Each word's span in the page's text and when it is said. Empty for the intro, for code read as a fixed
            phrase, and when ElevenLabs' alignment doesn't match what was said.
          items:
            type: object
            additionalProperties: false
            required: [start, end, t0, t1]
            properties:
              start:
                type: integer
                minimum: 0
                description: The word's first offset in the page's text.
              end:
                type: integer
                minimum: 0
                description: One past its last offset.
              t0:
                type: integer
                minimum: 0
                description: When the word starts, in ms from the start of the audio.
              t1:
                type: integer
                minimum: 0
                description: When it ends, in ms.
        format:
          type: string
          enum: [low, standard]
          description: The rate used; `standard` after ElevenLabs refused the low one, which the browser then asks for.
    AskBody:
      type: object
      additionalProperties: false
      required: [position, wholeBook, question]
      description: |
        `explain` and `define` need a `quote`; `summary`, `recap`, `quiz` and `flashcards` refuse one; no `action`
        goes with `highlights: true`. Anything else is 400.
      properties:
        position:
          $ref: "#/components/schemas/AskPosition"
        wholeBook:
          type: boolean
          description: Send the whole book rather than the text up to the reader's page.
        question:
          type: string
          description: |
            1 to 2,000 characters once cleaned. For an action, the button's label; the instruction is the server's.
        quote:
          type: [string, "null"]
          description: A selected passage, at most 1,000 characters once cleaned. Null or absent for none.
        history:
          type: array
          maxItems: 10
          default: []
          description: The conversation so far, oldest first; at most 16,000 characters in all once cleaned.
          items:
            type: object
            additionalProperties: false
            required: [role, text]
            properties:
              role:
                type: string
                enum: [user, assistant]
              text:
                type: string
                description: Not empty once cleaned.
        highlights:
          type: boolean
          default: false
          description: Send the reader's own highlights in this chapter (at most 50) with the question.
        action:
          type: string
          enum: [explain, summary, recap, define, quiz, flashcards]
          description: A button's fixed request. Absent for a typed question; null is refused.
    AskRefusal:
      type: object
      additionalProperties: false
      required: [error]
      description: A refusal before the stream starts.
      properties:
        error:
          type: string
          enum: [signed_out, not_found, invalid, too_little, no_key, too_long, failed]
    AskLimitError:
      type: object
      additionalProperties: false
      required: [error, retryAt]
      properties:
        error:
          type: string
          const: limit
        retryAt:
          $ref: "#/components/schemas/Timestamp"
    AskCitation:
      type: object
      additionalProperties: false
      required: [pageHref, label, citedText]
      properties:
        pageHref:
          type: string
          description: The reader's address of the cited page.
        label:
          type: string
          description: '"Ch. 4 · p. 3", or "p. 112".'
        citedText:
          type: string
          maxLength: 500
          description: The cited passage from the server's own copy of the book, never from the model.
    AskStudySource:
      type: object
      additionalProperties: false
      required: [position, label]
      description: Where a question or card came from, its first citation's page or else the reader's page.
      properties:
        position:
          $ref: "#/components/schemas/AskPosition"
        label:
          type: string
    AskQuizQuestion:
      type: object
      additionalProperties: false
      required: [question, choices, answer, why, citations, source]
      properties:
        question:
          type: string
          maxLength: 300
        choices:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: string
            maxLength: 200
        answer:
          type: integer
          enum: [0, 1, 2, 3]
          description: The index of the right choice, after the server shuffled them.
        why:
          type: string
          description: |
            The reason, at most 600 characters of the model's text, with a citation marker (U+E000, the index,
            U+E001) per entry of `citations`.
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AskCitation"
        source:
          $ref: "#/components/schemas/AskStudySource"
    AskCardDraft:
      type: object
      additionalProperties: false
      required: [front, back, citations, source]
      properties:
        front:
          type: string
          maxLength: 200
        back:
          type: string
          description: The answer, at most 500 characters of the model's text, with a citation marker per citation.
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AskCitation"
        source:
          $ref: "#/components/schemas/AskStudySource"
    AskStudySpan:
      type: string
      enum: [chapter, two]
      description: "`chapter`: the current chapter so far. `two`: the chapter before it as well."
    AskEvent:
      description: One line of the answer stream.
      oneOf:
        - title: text
          type: object
          additionalProperties: false
          required: [type, text]
          properties:
            type:
              type: string
              const: text
            text:
              type: string
              minLength: 1
              description: The next piece of the answer, to append.
        - title: citation
          type: object
          additionalProperties: false
          required: [type, pageHref, label, citedText]
          properties:
            type:
              type: string
              const: citation
            pageHref:
              type: string
            label:
              type: string
            citedText:
              type: string
              maxLength: 500
        - title: quiz
          type: object
          additionalProperties: false
          required: [type, span, questions]
          properties:
            type:
              type: string
              const: quiz
            span:
              $ref: "#/components/schemas/AskStudySpan"
            questions:
              type: array
              minItems: 3
              maxItems: 5
              items:
                $ref: "#/components/schemas/AskQuizQuestion"
        - title: cards
          type: object
          additionalProperties: false
          required: [type, span, cards]
          properties:
            type:
              type: string
              const: cards
            span:
              $ref: "#/components/schemas/AskStudySpan"
            cards:
              type: array
              minItems: 4
              maxItems: 10
              items:
                $ref: "#/components/schemas/AskCardDraft"
        - title: done
          type: object
          additionalProperties: false
          required: [type, stop]
          properties:
            type:
              type: string
              const: done
            stop:
              type: string
              description: Anthropic's stop reason (`end_turn`, `max_tokens`, `refusal`, ...).
              examples: [end_turn]
        - title: error
          type: object
          additionalProperties: false
          required: [type, code]
          properties:
            type:
              type: string
              const: error
            code:
              type: string
              enum: [key_rejected, billing, busy, too_long, bad_format, failed]
              description: |
                `key_rejected`: Anthropic answered 401 or 403. `billing`: 402. `busy`: 429, 529 or an overloaded or
                rate-limit error mid-stream. `too_long`: 413, or a 400 saying the prompt is too long. `bad_format`: a
                quiz or flashcards answer that didn't keep to the format. `failed`: anything else.
    CheckoutBody:
      type: object
      additionalProperties: false
      required: [cadence]
      properties:
        cadence:
          type: string
          enum: [month, year]
          description: "`year` is the founding price while fewer than 100 founding subscriptions exist."
    CheckoutAnswer:
      type: object
      additionalProperties: false
      required: [transactionId, clientToken, env, email]
      properties:
        transactionId:
          type: string
          pattern: "^txn_[a-z0-9]{4,60}$"
          description: The Paddle transaction Paddle.js opens.
        clientToken:
          type: string
          pattern: "^(test|live)_[A-Za-z0-9]{8,100}$"
          description: The client-side token to start Paddle.js with (`test_` on sandbox, `live_` on production).
        env:
          type: string
          enum: [sandbox, production]
        email:
          description: The account's confirmed address that hasn't bounced, for the checkout to fill in.
          oneOf:
            - type: string
              format: email
            - type: "null"
    PlanState:
      type: object
      additionalProperties: false
      required: [billing, plan, source, subscription, foundingLeft]
      properties:
        billing:
          type: boolean
          description: Whether Pro can be bought on this server.
        plan:
          type: string
          enum: [free, pro]
        source:
          type: string
          enum: [admin, paid, given, free]
          description: |
            Where the plan comes from: the admin role, a paid subscription, an admin's grant, or none. A member who pays
            and was also given Pro shows as `paid`.
        subscription:
          description: The newest live subscription, else the newest of any status; null without one. No Paddle ids.
          oneOf:
            - $ref: "#/components/schemas/SubscriptionView"
            - type: "null"
        foundingLeft:
          type: integer
          minimum: 0
          maximum: 100
          description: Founding spots left (100 when billing is off).
    SubscriptionView:
      type: object
      additionalProperties: false
      required: [cadence, founding, status, periodEndsAt, cancelAt, endedAt]
      properties:
        cadence:
          type: string
          enum: [month, year]
        founding:
          type: boolean
        status:
          type: string
          enum: [active, trialing, past_due, paused, canceled]
          description: "`active`, `trialing` and `past_due` are Pro; `paused` and `canceled` are Free."
        periodEndsAt:
          description: When the paid period ends (and it renews, unless a cancel is scheduled); null once canceled.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        cancelAt:
          description: A cancel scheduled for the period's end; null once canceled.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        endedAt:
          description: When a canceled subscription ended; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    PaddleEvent:
      type: object
      additionalProperties: true
      required: [event_id, event_type, occurred_at]
      description: |
        Paddle's webhook envelope. Only these fields are read; Paddle's others (`notification_id`, ...) are allowed and
        ignored, so this is the one place objects are open.
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 100
          description: Recorded once; a repeat is answered 200 `Already recorded`.
        event_type:
          type: string
          minLength: 1
          maxLength: 100
          description: One of the handled types, else 200 `Ignored`.
          examples: [subscription.updated]
        occurred_at:
          type: string
          maxLength: 40
          description: A date; an event older than the row's last one doesn't overwrite it.
          examples: ["2026-11-20T09:30:00.000Z"]
        data:
          description: For a `subscription.*` event, the subscription entity; for `transaction.completed`, not read.
          anyOf:
            - $ref: "#/components/schemas/PaddleSubscriptionEntity"
            - {}
    PaddleSubscriptionEntity:
      type: object
      additionalProperties: true
      required: [id, status, items]
      description: |
        The fields Folio reads from a subscription entity. A missing or wrong `id`, price, cycle or status is 400 `Not a
        subscription`, except a status string the table doesn't take yet, which is 500 `Unknown status`.
      properties:
        id:
          type: string
          pattern: "^sub_[a-z0-9]{4,60}$"
        status:
          type: string
          enum: [active, trialing, past_due, paused, canceled]
        customer_id:
          type: string
          pattern: "^ctm_[a-z0-9]{4,60}$"
          description: Kept for the customer portal; anything else is stored as none.
        custom_data:
          type: object
          additionalProperties: true
          properties:
            folio_user:
              type: string
              pattern: '^[1-9]\d{0,15}$'
              description: |
                The account's id, copied by Paddle from the checkout's transaction. Missing or malformed keeps the
                account the row already has; an id with no account is stored without one and logged.
        items:
          type: array
          description: The first item with a `price` is read.
          items:
            type: object
            additionalProperties: true
            properties:
              price:
                type: object
                additionalProperties: true
                required: [id]
                properties:
                  id:
                    type: string
                    pattern: "^pri_[a-z0-9]{4,60}$"
                    description: The founding price id (PADDLE_PRICE_FOUNDING) marks a founding subscription.
                  billing_cycle:
                    $ref: "#/components/schemas/PaddleBillingCycle"
        billing_cycle:
          $ref: "#/components/schemas/PaddleBillingCycle"
        current_billing_period:
          type: [object, "null"]
          additionalProperties: true
          properties:
            ends_at:
              type: string
        scheduled_change:
          type: [object, "null"]
          additionalProperties: true
          description: A change whose `action` is `cancel` sets the cancel date from `effective_at`.
          properties:
            action:
              type: string
            effective_at:
              type: string
        canceled_at:
          type: [string, "null"]
        created_at:
          type: [string, "null"]
    PaddleBillingCycle:
      type: object
      additionalProperties: true
      required: [interval]
      description: The price's cycle, or the subscription's when the price has none; must be month or year.
      properties:
        interval:
          type: string
          enum: [month, year]
    ResendMailEvent:
      type: object
      additionalProperties: true
      description: |
        Resend's event. Only `type` and `data.to` (and `data.bounce.type` for a bounce) are read; Resend's other
        fields are allowed and ignored. Any JSON is accepted: a shape Folio can't read is 200 `Ignored`.
      properties:
        type:
          type: string
          description: |
            `email.bounced`, `email.complained` and `email.suppressed` are acted on; anything else is ignored.
          examples: [email.bounced]
        data:
          type: object
          additionalProperties: true
          properties:
            to:
              type: array
              description: The addresses, bare or as `Name <address>`; the first 50 are read.
              items:
                type: string
            bounce:
              type: object
              additionalProperties: true
              properties:
                type:
                  type: string
                  description: Only `Permanent` marks the address; any other type, or none, is ignored.
    AdminRole:
      type: string
      enum: [admin, member]
    AdminNewUserBody:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          maxLength: 64
          description: |
            Trimmed and lowercased, then it must match `^[a-z0-9][a-z0-9_-]{2,31}$` and not be `new`, or the request
            is 400 `invalid`. Unlike sign-up, the other reserved names (`admin`, `support`, ...) are allowed.
        role:
          allOf:
            - $ref: "#/components/schemas/AdminRole"
          default: member
    AdminUserChangeBody:
      oneOf:
        - title: Intent
          type: object
          additionalProperties: false
          required: [intent]
          properties:
            intent:
              type: string
              enum: [reset-password, disable, enable, unlock, sign-out, grant-pro, revoke-pro, delete]
        - title: Role
          type: object
          additionalProperties: false
          required: [intent, role]
          properties:
            intent:
              type: string
              const: role
            role:
              $ref: "#/components/schemas/AdminRole"
    AdminPaidLabel:
      type: object
      additionalProperties: false
      required: [cadence, founding, pastDue]
      properties:
        cadence:
          type: string
          enum: [month, year]
        founding:
          type: boolean
        pastDue:
          type: boolean
    AdminUserView:
      type: object
      additionalProperties: false
      required:
        [
          username,
          role,
          status,
          lockedUntil,
          createdAt,
          lastActiveAt,
          sessions,
          hasKey,
          email,
          plan,
          planSource,
          paid,
          you,
        ]
      description: An account as the Users page shows it. Never its id, password hash or email address.
      properties:
        username:
          type: string
        role:
          $ref: "#/components/schemas/AdminRole"
        status:
          type: string
          enum: [active, disabled, locked]
          description: Disabled wins over locked.
        lockedUntil:
          description: When the sign-in lock ends, while there is one (also on a disabled account).
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        lastActiveAt:
          description: The latest activity of a live session (seen in the last 7 days), or null without one.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        sessions:
          type: integer
          minimum: 0
          description: Live sessions seen in the last 7 days.
        hasKey:
          type: boolean
          description: Whether the account has saved an Anthropic API key.
        email:
          type: string
          enum: [confirmed, bounced, none]
        plan:
          type: string
          enum: [free, pro]
        planSource:
          type: string
          enum: [admin, paid, given, free]
          description: An admin is always Pro; a member by subscription, or because an admin gave it.
        paid:
          description: How a paid plan is paid; null unless `planSource` is `paid`.
          oneOf:
            - $ref: "#/components/schemas/AdminPaidLabel"
            - type: "null"
        you:
          type: boolean
          description: Whether this is the admin making the request; always false in these answers.
    AdminUserAnswer:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AdminUserView"
        password:
          type: string
          pattern: "^[A-HJ-NP-Za-km-z2-9]{24}$"
          format: password
          description: After an add or `reset-password` only. Shown in this answer once, and nowhere else.
    AdminInviteCreateBody:
      type: object
      additionalProperties: false
      required: []
      properties:
        note:
          description: |
            Who it's for, seen only by admins. Control characters are removed and it is trimmed; empty or null means
            no note. Over 60 characters after that, or not a string, is 400 `invalid`.
          oneOf:
            - type: string
            - type: "null"
    AdminInviteView:
      type: object
      additionalProperties: false
      required: [id, note, by, createdAt, expiresAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        note:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 60
            - type: "null"
        by:
          description: The username of the admin who made it, or null if that account is gone.
          oneOf:
            - type: string
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
          description: 7 days after `createdAt`.
    AdminInviteCreated:
      type: object
      additionalProperties: false
      required: [invite, link]
      properties:
        invite:
          $ref: "#/components/schemas/AdminInviteView"
        link:
          type: string
          format: uri
          pattern: '^https?://[^/]+/signup\?token=[A-Za-z0-9_-]{43}$'
          description: "`<APP_ORIGIN>/signup?token=<token>`. Shown in this answer once; only its hash is stored."
    AdminInviteQuotaError:
      type: object
      additionalProperties: false
      required: [error, max]
      properties:
        error:
          type: string
          const: quota
        max:
          type: integer
          const: 20
    OfflineBook:
      type: object
      additionalProperties: false
      required: [v, slug, version, title, author, owner, context, content, cover, speech, pictures, bytes]
      description: |
        `OfflineBook` in src/shared/offline/book.ts. `context`, `content`, `cover` and `speech` are the reader's own
        structures (ReaderContext, BookContent, CoverStyle, SpeechBook) and are not spelled out here.
      properties:
        v:
          type: integer
          const: 1
        slug:
          type: string
          maxLength: 200
        version:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: Changes when anything the copy holds changes.
        title:
          type: string
        author:
          type: string
        owner:
          description: The owner's username for a private book; null for a catalogue book.
          oneOf:
            - type: string
              minLength: 1
            - type: "null"
        context:
          type: object
          additionalProperties: true
          description: What the reader builds its pages from; a catalogue book's catalogue trimmed to its own series.
        content:
          type: object
          additionalProperties: true
          description: The book's chapters (`kind` is `chapter` or `paged`).
        cover:
          type: object
          additionalProperties: true
          description: The generated cover's style.
        speech:
          type: object
          additionalProperties: true
          description: The book as read aloud's dock shows it.
        pictures:
          type: array
          description: Every picture the pages show, as same-origin paths.
          items:
            type: string
            pattern: "^/(?!/)"
            maxLength: 500
        bytes:
          type: integer
          minimum: 0
          description: About how much the download takes, the pages' text, pictures and cover.
    WebManifestIcon:
      type: object
      additionalProperties: false
      required: [src, sizes, type, purpose]
      properties:
        src:
          type: string
          enum: [/icons/icon-192.png, /icons/icon-512.png]
        sizes:
          type: string
          enum: [192x192, 512x512]
        type:
          type: string
          const: image/png
        purpose:
          type: string
          enum: [any, maskable]
    WebManifest:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          short_name,
          description,
          lang,
          dir,
          start_url,
          scope,
          display,
          background_color,
          theme_color,
          categories,
          icons,
        ]
      properties:
        id:
          type: string
          const: /library
          description: How browsers recognise an installed Folio; never changes.
        name:
          type: string
          const: Folio
        short_name:
          type: string
          const: Folio
        description:
          type: string
          const: A quiet place to read and listen.
        lang:
          type: string
          const: en
        dir:
          type: string
          const: ltr
        start_url:
          type: string
          const: /library
        scope:
          type: string
          const: /
        display:
          type: string
          const: standalone
        background_color:
          type: string
          const: "#0B0D17"
        theme_color:
          type: string
          const: "#0B0D17"
        categories:
          type: array
          items:
            type: string
          const: [books, education]
        icons:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/WebManifestIcon"
